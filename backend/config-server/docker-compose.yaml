name: meristem-one-app

services:

  # Applications
  config-server:
    container_name: config-server
    restart: unless-stopped
    ports:
      - "20000:20000"
    platform: linux/amd64
    env_file:
      - ../observability/env/one-meristem-app-env.env
    image: config-server:latest
    networks:
      - backend

  gateway-service:
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "20010:20010"
    platform: linux/amd64
    env_file:
      - ../observability/env/one-meristem-app-env.env
    image: gateway-service:latest
    depends_on:
      - config-server
      - redis
    networks:
      - backend
    environment:
      JAVA_TOOL_OPTIONS: -javaagent:/etc/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: "gateway-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_LOGS_EXPORTER: otlp # --- otlp is the default value if not set
      OTEL_TRACES_EXPORTER: otlp #---
      OTEL_METRICS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: "service.name=gateway-service,env=local"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_JAVAAGENT_ENABLED: true
    volumes:
      - ../observability/opentelemetry-javaagent.jar:/etc/opentelemetry-javaagent.jar

  users-service:
    container_name: users-service
    restart: unless-stopped
    platform: linux/amd64
    env_file:
      - ../observability/env/one-meristem-app-env.env
    image: users-service:latest
    depends_on:
      - config-server
      - consul
      - broker
      - redis
    networks:
      - backend
    environment:
      USER: 'Anonymous'
      JAVA_TOOL_OPTIONS: -javaagent:/etc/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: "users-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_LOGS_EXPORTER: otlp # --- otlp is the default value if not set
      OTEL_TRACES_EXPORTER: otlp #---
      OTEL_METRICS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: "service.name=users-service,env=local"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_JAVAAGENT_ENABLED: true
    volumes:
      - ../observability/opentelemetry-javaagent.jar:/etc/opentelemetry-javaagent.jar


  notification-service:
    container_name: notification-service
    platform: linux/amd64
    env_file:
      - ../observability/env/one-meristem-app-env.env
    image: notification-service:latest
    restart: unless-stopped
    depends_on:
      - config-server
      - consul
      - broker
    networks:
      - backend
    environment:
      JAVA_TOOL_OPTIONS: -javaagent:/etc/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: "notification-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_RESOURCE_ATTRIBUTES: "service=notification-service,env=local"
      # Logs are disabled by default
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_JAVAAGENT_ENABLED: true
    volumes:
      - ../observability/opentelemetry-javaagent.jar:/etc/opentelemetry-javaagent.jar


  # OBSERVABILITY
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3000:3000
    environment:
      - GF_USERS_DEFAULT_THEME=dark
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password
    volumes:
      - ../observability/configs/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/provisioning-datasources.yaml:ro
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped
    networks:
      - backend


  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    volumes:
      - ../observability/configs/tempo/tempo-local.yaml:/etc/tempo-local.yaml
    command: [ "-config.file=/etc/tempo-local.yaml" ]
    restart: unless-stopped
    networks:
      - backend


  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ../observability/configs/prometheus/prometheus.yaml:/etc/prometheus.yaml
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - backend


  # KAFKA
  broker:
    image: apache/kafka:3.9.0
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://broker:9092,CONTROLLER://broker:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secret:/etc/kafka/secrets
    restart: unless-stopped
    networks:
      - backend

# REDIS

  redis:
    image: redis:7.4.2-alpine
    container_name: redis
    command: redis-server --requirepass '${REDIS_PASSWORD}'
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  consul:
    container_name: consul
    command: "agent -server -bootstrap-expect 1 -ui -client 0.0.0.0"
    networks:
      - backend
    ports:
      - "8500:8500"
    restart: unless-stopped
    image: consul:1.15.4

# VOLUMES
volumes:
  kafka_data:
    driver: local
  kafka_secret:
    driver: local
  redis_data:
    driver: local

# NETWORKS
networks:
  backend:
    driver: bridge
