spring:
  flyway:
    locations: classpath:db/migration/postgres
  datasource:
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 10
      max-lifetime: 1800000
      keepalive-time: 300000

management:
  endpoints:
    web:
      exposure:
        include: 'health,prometheus'
  endpoint:
    health:
      show-details: always
      access: read_only
    prometheus:
      access: read_only
  health:
    mail:
      enabled: false


springdoc:
  swagger-ui:
    enabled: false

  api-docs:
    enabled=false: