spring:
  flyway:
    locations: classpath:db/migration/postgres

management:
  endpoints:
    web:
      exposure:
        include: 'health,prometheus'
  endpoint:
    health:
      show-details: always
      access: read_only
    prometheus:
      access: none
  health:
    mail:
      enabled: false

springdoc.api-docs.path: /api-docs
