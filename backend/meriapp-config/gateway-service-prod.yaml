
server:
  port: 20010
  ssl:
    key-store: classpath:keys/one-meristem-app.com-keystore.pkcs12
    key-store-password: ${KEY_STORE_PASSWORD}
    key-store-type: JKS
    key-alias: ${SSL_KEY_ALIAS}
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: 'health,prometheus,info,gateway'
  endpoint:
    health:
      show-details: always
      access: read_only
    prometheus:
      access: none
    gateway:
      access: read_only
  health:
    mail:
      enabled: false