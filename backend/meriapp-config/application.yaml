spring:
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false

  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 2000
      max-lifetime: 1800000

  kafka:
    producer:
      bootstrap-servers: ${KAFKA_HOST_URL}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    bootstrap-servers: ${KAFKA_HOST_URL}

    consumer:
      bootstrap-servers: ${KAFKA_HOST_URL}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      properties:
        spring.json.trusted.packages: 'org.meristem.oneapp.kafka.*'

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem

rsa:
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem

one-app:
  server-url: ${ONE_APP_SERVER_URL}
  email: ${ONE_APP_EMAIL}
  server-version: 1.0
  server-app-name: "Meristem One App"
  default-header-name: "X-ONE-APP-CLIENT-NAME"

#  USERS SERVICE
  users-service:
    context-path: /api/users
    application-name: users-service

#  WALLET SERVICE
  wallet-service:
    context-path: /api/wallets
    application-name: wallet-service

logging:
  file:
    max-size: 2MB
    name: ./logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 1GB
      max-history: 30
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx'
    file: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx'

springdoc.api-docs.path: /api-docs


management:
  endpoints:
    web:
      exposure:
        include: 'health'
