spring:
  kafka:
    consumer:
      group-id: ${spring.cloud.config.profile}-notification-service

  cloud:
    consul:
      discovery:
        metadata:
          contextPath: ${one-app.trustees-service.context-path}
        health-check-path: ${one-app.trustees-service.context-path}/actuator/health
        enabled: true
        fail-fast: true
        catalogServicesWatch:
          enabled: false
        hostname: ${TRUSTEES_SERVICE_HOSTNAME}
        instance-id: ${spring.application.name}:${vcap.application.instance_id:${spring.application.instance_id:${random.value}}}
        health-check-interval: 60s
      host: ${CONSUL_HOST}


  mail:
    host: ${MAILER_HOST}
    username: ${MAILER_USERNAME}
    port: ${MAILER_PORT}
    password: ${MAILER_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true


server:
  port: 20030
  servlet:
    context-path: ${one-app.notification-service.context-path}

one-app:

  notification-service:
    context-path: /api/notification
    application-name: notification-service
    mail-sender: ${MAIL_SENDER}
    mail-sender-name: ${MAIL_SENDER_NAME}

credit-switch:
  login-id: ${CREDIT_SWITCH_LOGIN_ID}
  public-key: ${CREDIT_SWITCH_PUBLIC_KEY}
  private-key: ${CREDIT_SWITCH_PRIVATE_KEY}
  sender-id: ${CREDIT_SWITCH_SMS_SENDER_ID}
  base-url: ${CREDIT_SWITCH_SMS_BASEURL}
  password: ${CREDIT_SWITCH_SMS_PASSWORD}


expo:
  push:
    notifications:
      token: ${EXPO_PUSH_TOKEN}
  query:
    receipts:
      cron: 0 */20 * * * *