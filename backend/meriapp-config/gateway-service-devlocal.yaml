
server:
  port: 8443
  ssl:
    key-store: classpath:keys/one-meristem-app.com-keystore.pkcs12
    key-store-password: ${KEY_STORE_PASSWORD}
    key-store-type: JKS
    key-alias: ${SSL_KEY_ALIAS}
    enabled: true

spring:
  datasource:
    username: sa
    password: '${H2_PASSWORD}'
    url: jdbc:h2:mem:mydb;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  flyway:
    locations: classpath:db/migration/h2

management:
  endpoints:
    web:
      exposure:
        include: 'health,prometheus,info,gateway'
  endpoint:
    health:
      show-details: always
      access: read_only
    prometheus:
      access: none
    gateway:
      access: read_only
  health:
    mail:
      enabled: false