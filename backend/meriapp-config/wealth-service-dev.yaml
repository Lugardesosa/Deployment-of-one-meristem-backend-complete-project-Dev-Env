spring:
  flyway:
    locations: classpath:db/migration/postgres
  datasource:
    url: ${DB_SERVER}/${WEALTH_DB_NAME}
    password: ${WEALTH_DB_PASSWORD}
    username: ${WEALTH_DB_USERNAME}
    driver-class-name: org.postgresql.Driver

one-app:
  wallet-service:
    smile-id:
      server-ips: ${SMILE_ID_DEV_WHITELIST_IPS}
      api-key: ${SMILE_ID_DEV_API_KEY}
      url: ${SMILE_ID_TEST_LAMBDA_URL}
      callback-url: ${SMILE_ID_DEV_CALLBACK_URL}