spring:
  datasource:
    url: jdbc:postgresql://${DB_SERVER}:${DB_PORT:5432}/${WALLET_DB_NAME}
    password: ${WALLET_DB_PASSWORD}
    username: ${WALLET_DB_USERNAME}
    driver-class-name: org.postgresql.Driver


one-app:
  wallet-service:
    smile-id:
      server-ips: ${SMILE_ID_DEV_WHITELIST_IPS}
      api-key: ${SMILE_ID_DEV_API_KEY}
      url: ${SMILE_ID_TEST_LAMBDA_URL}
      callback-url: ${SMILE_ID_DEV_CALLBACK_URL}