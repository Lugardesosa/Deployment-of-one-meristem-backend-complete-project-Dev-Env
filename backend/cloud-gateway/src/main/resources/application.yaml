
spring:
  application:
    name: gateway-service
  config:
    import: configserver:${CONFIG_SERVER_URI}
  cloud:
    config:
      label: ${GITHUB_BRANCH}
      profile: ${APP_PROFILE}
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
      request-connect-timeout: 10
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 3000
        max-interval: 3500
  profiles:
    active: ${spring.cloud.config.profile}

encrypt:
  key: '${ENCRYPTION_KEY}'

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
