x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-labels:
  &default-labels
  logging: "promtail"
  logging_jobname: "containerlogs"

services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
    networks:
      - traces
      
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3000:3000
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./configs/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/provisioning-datasources.yaml:ro
    depends_on:
      - tempo
      - loki
      - prometheus
      #- jaeger
    networks:
      - traces
    logging: *default-logging

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    ports:
      - 3200:3200   # tempo http
      - 9095:9095   # tempo grpc
      - "14268" # jaeger ingest
#      - 4318:4318   # otlp http
      - "4317"   # otlp grpc
    volumes:
      - ./configs/tempo/tempo-local.yaml:/etc/tempo-local.yaml
    command: ["-config.file=/etc/tempo-local.yaml"]
    networks:
      - traces
    logging: *default-logging
    
  #jaeger:
    #image: jaegertracing/all-in-one:latest
    #ports:
      #- "6831:6831/udp" # UDP port for Jaeger agent
      #- "16686:16686" # Web UI
      #- "14268:14268" # HTTP port for spans
      #- "4317"
    #networks:
      #- traces
    #logging: *default-logging

#  promtail:
#    image:  grafana/promtail:2.9.7
#    container_name: promtail
#    volumes:
#      - ./configs/promtail/promtail.yaml:/etc/promtail/docker-config.yaml
#      - /var/lib/docker/containers:/var/lib/docker/containers:ro
#      - /var/run/docker.sock:/var/run/docker.sock
#    command: -config.file=/etc/promtail/docker-config.yaml
#    depends_on:
#      - loki
#    networks:
#      - traces
#    logging: *default-logging

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - traces
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./configs/prometheus/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"
    networks:
      - traces
    logging: *default-logging


networks:
  traces:
    name: traces
    driver: bridge
