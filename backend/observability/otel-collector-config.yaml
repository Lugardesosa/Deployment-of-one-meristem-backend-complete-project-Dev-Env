# extensions:
#   health_check:
#     # HTTP health endpoint for uptime probes (e.g. liveness)
#     endpoint: ":13133"
#     response_body: {
#       "healthy": "UP",
#       "unhealthy": "DOWN"
#     }

receivers:
  otlp:
    protocols:
      # http:
      #   endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # batch metrics before sending to reduce API usage
  batch:
    send_batch_max_size: 1000
    send_batch_size: 100
    timeout: 10s
extensions:
  health_check: {}
exporters:
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:9090"
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki]
