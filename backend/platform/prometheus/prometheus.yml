global:
  scrape_interval: 2s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: 'gateway-service'
    scrape_interval: 2s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'gateway-service:20010' ]
  - job_name: 'users-service'
    scrape_interval: 2s
    metrics_path: '/api/users/actuator/prometheus'
    static_configs:
      - targets: [ 'users-service:20020' ]
