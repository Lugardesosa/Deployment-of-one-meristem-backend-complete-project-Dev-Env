spring:
  application:
    name: users-service
  config:
    import: configserver:${CONFIG_SERVER_URI}
  cloud:
    config:
      label: observabilityV2 # TODO: change to the branch being deployed
      profile: local
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
      request-connect-timeout: 10
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 3000
        max-interval: 3500


# TODO: DELETE
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.jdbc: DEBUG
spring.datasource.hikari.data-source-properties.logUnclosedConnections: true
logging.level.com.zaxxer.hikari.HikariConfig: DEBUG
logging.level.com.zaxxer.hikari: TRACE
