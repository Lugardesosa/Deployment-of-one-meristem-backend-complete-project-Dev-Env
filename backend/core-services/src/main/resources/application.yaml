spring:
  application:
    name: core-services

  config:
    import: configserver:${CONFIG_SERVER_URI}
  cloud:
    config:
      profile: ${APP_PROFILE}
      label: ${GITHUB_BRANCH}
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 3000
        max-interval: 3500
  profiles:
    active: ${spring.cloud.config.profile}

encrypt:
  key: '${ENCRYPTION_KEY}'
