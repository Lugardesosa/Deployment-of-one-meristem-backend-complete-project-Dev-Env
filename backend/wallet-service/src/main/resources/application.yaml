spring:
  application:
    name: wallet-service
  config:
    import: configserver:${CONFIG_SERVER_URI}
  cloud:
    config:
      label: ${GITHUB_BRANCH}
      profile: ${GITHUB_PROFILE}
      request-connect-timeout: 10
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 3000
        max-interval: 3500