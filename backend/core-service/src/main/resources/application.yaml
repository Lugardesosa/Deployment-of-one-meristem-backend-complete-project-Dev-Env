spring:
  application:
    name: core-service
  config:
    import: configserver:${CONFIG_SERVER_URI}
  cloud:
    config:
      label: ${GITHUB_BRANCH}
      profile: ${APP_PROFILE}
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
      request-connect-timeout: 10
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 3000
        max-interval: 3500

  security:
    oauth2:
      client:
        registration:
          core-service:
            client-id: ${CORE_CLIENT_ID}
            client-secret: ${CORE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: users-service
            scope:
              - beneficiaries.get
        provider:
          users-service:
            token-uri: ${USER_SERVICE_URI}/${one-app.users-service.context-path}/oauth2/token
  profiles:
    active: ${spring.cloud.config.profile}

encrypt:
  key: '${ENCRYPTION_KEY}'

