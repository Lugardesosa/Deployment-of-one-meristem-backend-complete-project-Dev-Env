{{- if .Values.networkpolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "middleware-service.fullname" . }}-ingress-from-mobile-backend
  namespace: {{ .Values.global.middleware-namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "middleware-service.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              ns: one-meristem-app
        - podSelector:
            matchLabels:
              app: {{ include "report-service.name" . }}
      ports:
        - protocol: TCP
          port: {{ .Values.global.middleware.networkpolicy.port }}

  egress: 
    - to:
        - ipBlock:
            cidr: {{ .Values.global.corebanking.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.global.corebanking.port }}
{{- end }}
