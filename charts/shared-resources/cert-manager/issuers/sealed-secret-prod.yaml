apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: zerossl-eab-prod
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  encryptedData:
    # REPLACE WITH PRODUCTION SEALED VALUES
    kid: AgBX9Km3RpN...REPLACE_WITH_SEALED_KID_PROD...
    hmac: AgD2Pn8kQwM...REPLACE_WITH_SEALED_HMAC_PROD...
  template:
    metadata:
      name: zerossl-eab-prod
      namespace: cert-manager
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: issuer-credentials
        environment: production
    type: Opaque
