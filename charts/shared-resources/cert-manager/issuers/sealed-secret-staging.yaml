# =============================================================================
# SEALED SECRET: ZeroSSL EAB Credentials (Staging)
#
# PURPOSE:
# Stores External Account Binding (EAB) credentials required by ZeroSSL.
# These credentials link cert-manager to your ZeroSSL account.
#
# HOW TO GENERATE:
# 1. Get EAB credentials from https://app.zerossl.com/developer
# 2. Create sealed secret:
#    echo -n "YOUR_EAB_KID" | kubeseal --raw \
#      --namespace cert-manager \
#      --name zerossl-eab-staging \
#      --from-file=/dev/stdin
# 3. Replace the encryptedData values below
#
# =============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: zerossl-eab-staging
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "3"  # Before ClusterIssuer
spec:
  encryptedData:
    # REPLACE THESE WITH YOUR ACTUAL SEALED VALUES
    # Get credentials from: https://app.zerossl.com/developer
    # Then seal them using kubeseal
    kid: AgBQ7Vl2TqK...REPLACE_WITH_SEALED_KID...
    hmac: AgC8Hn4mPvL...REPLACE_WITH_SEALED_HMAC...
  template:
    metadata:
      name: zerossl-eab-staging
      namespace: cert-manager
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: issuer-credentials
        environment: staging
    type: Opaque
