# =============================================================================
# tls-secrets.yaml
# TLS secrets for Kubernetes ingress — type: kubernetes.io/tls
# One secret per subdomain — referenced by secretName in ingress.yaml
# Raw PEM content injected via ArgoCD app set from CD pipeline
# Kubernetes handles base64 encoding automatically via stringData
# =============================================================================

# -------------------------------------------------------
# TLS Secret — cloud-gateway (onemeristemstag.meristemng.com)
# Master ingress — owns the ELB 443 listener
# -------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.cloudGateway.tlsSecretName }}
  namespace: {{ .Values.namespace }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.ingress.cloudGateway.tlsCert | quote }}
  tls.key: {{ .Values.ingress.cloudGateway.tlsKey | quote }}

---

# -------------------------------------------------------
# TLS Secret — web-app (onemeristemwebstag.meristemng.com)
# Slave ingress — references cloud-gateway-ingress as master
# -------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.webApp.tlsSecretName }}
  namespace: {{ .Values.namespace }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.ingress.webApp.tlsCert | quote }}
  tls.key: {{ .Values.ingress.webApp.tlsKey | quote }}

---

# -------------------------------------------------------
# TLS Secret — admin-app (onemeristemadminstag.meristemng.com)
# Slave ingress — references cloud-gateway-ingress as master
# -------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.adminApp.tlsSecretName }}
  namespace: {{ .Values.namespace }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.ingress.adminApp.tlsCert | quote }}
  tls.key: {{ .Values.ingress.adminApp.tlsKey | quote }}
