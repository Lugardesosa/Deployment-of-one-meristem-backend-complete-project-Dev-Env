# #Persistent Volume (PV)
pv:
  name: pv-obs-users-service
  size: 500Mi
  volumeHandle: obs-microservice-storage-one-meristem-app-stag-env # <-- Replace with actual OBS bucket name
  enterpriseProjectID: ad2cb210-4c6e-47dd-9a5a-bcc02dc3faeb # <-- Replace with actual Enterprise Project ID
  region: af-south-1
  obsVolumeType: STANDARD
  secretName: huawei-credentials-obs-ak

#Roles
namespace: one-meristem-app
role:
  name: sa-secret-role

#Role Binding
roleBinding:
  name: sa-secret-rolebinding

#Secrets
k8sSecret:
  name: credentials

#SecretProviderClass
environment: stag-env
secretProviderClass:
  name: huawei-csms-credentials
  provider: cce
  k8sSecretName: huawei-csms-credentials

serviceAccount:
  name: app-spc-sa
  dewResources:
    - "db-admin-secret-one-meristem-app-dev-env"
    - "redis-middleware-credentials-one-meristem-app-dev-env"
    - "redis-mobile-backend-credentials-one-meristem-app-dev-env"
    - "kafka-credentials-one-meristem-app-dev-env"
    - "db-notification_service-secret-one-meristem-app-dev-env"
    - "db-users_service-secret-one-meristem-app-dev-env"
    - "db-wallet_service-secret-one-meristem-app-dev-env"
    - "db-report_service-secret-one-meristem-app-dev-env"
    - "db-trustees_service-secret-one-meristem-app-dev-env"

# image pull secret
imagePullSecret:
  dockerconfigjson: "%"
obsSecret:
  enabled: true
  name: huawei-credentials-obs-ak
  namespace: one-meristem-app
