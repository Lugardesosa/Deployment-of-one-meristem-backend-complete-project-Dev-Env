# =============================================================================
# CREDENTIALS SECRET
# Values are always empty in git
# Real values injected via argocd app set from GitHub Secrets in pipeline
# =============================================================================
credentials:
  #Web-App Credentials
  adminPassword: ""
  encryptionKey: ""

  # Backend Credentials
  githubUsername:             ""
  githubPassword:             ""
  mailerHost:                 ""
  mailerUsername:             ""
  mailerPassword:             ""
  creditSwitchPublicKey:      ""
  creditSwitchPrivateKey:     ""
  creditSwitchSmsPassword:    ""
  huaweiCloudAccessKeyId:     ""
  huaweiCloudSecretAccessKey: ""
  h2Password:                 ""
  providusApiPublicKey:       ""
  providusApiSecretKey:       ""
  trusteesClientSecret:       ""
  encSalt:                    ""
  expoToken:                  ""
  okhiHeaderValue:            ""
  paystackSecretKey:          ""
  smileIdProdApiKey:    ""
  smileIdDevApiKey:     ""
  mobileSecret:         ""
  trusteesSecret:       ""
  notificationSecret:   ""
  wealthClientSecret: ""
  idHashingSecret:   ""
  webSecret:         ""
  walletSecret:      ""
  wealthSecret:      ""
  middlewareApiKey:  ""
  dojahSecretKey:    ""
  dojahPrivateKey:   ""
  pastelApiKey:      ""
  pastelApiSecret:   ""


namespace: one-meristem-app

#Roles
role:
  name: sa-secret-role

#Role Binding
roleBinding:
  name: sa-secret-rolebinding

#Secrets
k8sSecret:
  name: credentials

#SecretProviderClass
environment: stag_env
secretProviderClass:
  name: huawei-csms-credentials
  provider: cce
  k8sSecretName: huawei-csms-credentials

serviceAccount:
  name: app-spc-sa
  dewResources:
    - "db-admin-secret-one-meristem-app-stag-env"
    - "redis-middleware-credentials-one-meristem-app-stag-env"
    - "redis-mobile-backend-credentials-one-meristem-app-stag-env" 
    - "kafka-credentials-one-meristem-app-stag-env"
    - "db-notification_service-secret-one-meristem-app-stag-env"
    - "db-users_service-secret-one-meristem-app-stag-env"
    - "db-wallet_service-secret-one-meristem-app-stag-env"
    - "db-report_service-secret-one-meristem-app-stag-env"
    - "db-trustees_service-secret-one-meristem-app-stag-env"
    - "db-wealth_service-secret-one-meristem-app-stag-env"


