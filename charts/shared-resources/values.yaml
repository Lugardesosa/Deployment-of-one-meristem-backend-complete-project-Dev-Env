# =============================================================================
# INGRESS — Values
# =============================================================================

ingress:
  enabled: true
  elbId: ""   

  cloudGateway:
    host: "onemeristemstag.meristemng.com"
    tlsSecretName: "tls-onemeristemstag"
    servicePort: 8082              # Kubernetes service port
    # pod targetPort is 20010 — used in elb.backend-port annotation
    tlsCert: ""                    # injected via ArgoCD parameter
    tlsKey: ""                     # injected via ArgoCD parameter

  webApp:
    host: "onemeristemwebstag.meristemng.com"
    tlsSecretName: "tls-onemeristemwebstag"
    servicePort: 8083              # pod port = service port for frontend
    tlsCert: ""
    tlsKey: ""

  adminApp:
    host: "onemeristemadminstag.meristemng.com"
    tlsSecretName: "tls-onemeristemadminstag"
    servicePort: 8084
    tlsCert: ""
    tlsKey: ""
