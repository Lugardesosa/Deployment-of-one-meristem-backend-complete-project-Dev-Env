apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloud-gateway.fullname" . }}-pdb
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "cloud-gateway.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "cloud-gateway.selectorLabels" . | nindent 6 }}
