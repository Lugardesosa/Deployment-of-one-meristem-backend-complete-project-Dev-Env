{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ .Values.ingress.namespace | default .Release.Namespace }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "cce" | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- range .Values.ingress.tls.hosts }}
    - hosts:
        - {{ .host | quote }}
      secretName: {{ .secretName | default "backendstag-tls" | quote }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.ingress.rules }}
    - host: {{ .host | default "" | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "ImplementationSpecific" }}
            backend:
              service:
                name: {{ include "cloud-gateway.fullname" $ }}
                port:
                  number: {{ .service.port }}
        {{- end }}
  {{- end }}
{{- end }}



