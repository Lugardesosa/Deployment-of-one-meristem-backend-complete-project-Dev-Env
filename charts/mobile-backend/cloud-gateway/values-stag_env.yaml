#--------------------- CLOUD-GATEWAY VALUES ---------------------
# This file contains the configuration values for the cloud-gateway service deployment.

environment: stag_env

global:
  namespace: one-meristem-app
  serviceAccountName: app-spc-sa
  create: false     # Prevent chart from trying to create it
  
#Deployment configuration for cloud-gateway service
replicaCount: 2

image:
  repository: swr.af-south-1.myhuaweicloud.com/swr-repo-one-meristem-app-stag_env/cloud-gateway
  pullPolicy: Always
  tag: latest

imagePullSecrets:
  - name: huawei-swr-auth #relying on CCE's automatic injection

resources:
  limits:
    cpu: "0.5"
    memory: 1Gi
  requests:
    cpu: "0.3"
    memory: 512Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

volumeMounts:
  - name: huawei-csms-credentials
    mountPath: /mnt/secrets-store/cloud-gateway
    readOnly: true
  - name: gateway-data
    mountPath: /mnt/gateway
  - name: secret-volume
    mountPath: /etc/secrets-store/cloud-gateway
    readOnly: true

volumes:
  - name: gateway-data
    emptyDir: {}
  - name: huawei-csms-credentials
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: huawei-csms-credentials
        #csi.storage.k8s.io/provisioner-secret-name: huawei-csms-credentials
        #csi.storage.k8s.io/provisioner-secret-namespace: one-meristem-app
  - name: secret-volume
    secret:
      secretName: credentials

env:
  GITHUB_BRANCH: "stag_env"
  APP_PROFILE: "dev"
  COMPANY_NAME: "Meristem Securities Limited"
  DATA_PRIVACY_POLICY_URL: "https://www.onemerristem.merristem.com"
  GREEN_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag_env.obs.af-south-1.myhuaweicloud.com/Meristem_Green_Logo.png"
  WHITE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag_env.obs.af-south-1.myhuaweicloud.com/Meristem_White_Logo.png"
  FINANCE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag_env.obs.af-south-1.myhuaweicloud.com/Meristem_Finance_Logo.png"
  CONFIG_SERVER_URI: "http://config-server:20000/config"
  USER_SERVICE_URI: "http://users-service:20020"
  NOTIFICATION_SERVICE_URI: "http://notification-service:20030"
  WALLET_SERVICE_URI: "http://wallet-service:20040"
  REPORT_SERVICE_URI: "http://report-service:20050"
  ADMIN_USERNAME: "admin"
  TRUSTEES_SERVICE_URI: "http://trustees_service:20060"

secretEnv:
  ADMIN_PASSWORD:
    secretName: credentials
    secretKey: key3
  ENCRYPTION_KEY:
    secretName: credentials
    secretKey: key4
  REDIS_HOST:
    secretName: huawei-csms-credentials
    secretKey: REDIS_HOST
  REDIS_PASSWORD:
    secretName: huawei-csms-credentials
    secretKey: REDIS_PASSWORD
  H2_PASSWORD:
    secretName: credentials
    secretKey: key13

#PVC configuration
# pvc:
#   name: cloud-gateway-pvc-evs
#   accessModes:
#     - ReadWriteOnce
#   resources:
#     requests:
#       storage: 20Gi
#   storageClassName: csi-disk-topology
#   volumeMode: Filesystem

# HorizontalPodAutoscaler configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70


# Ingress configuration
ingress:
  enabled: true
  name: cloud-gateway-ingress
  elbId: ${MOBILE_ELB_ID} #Elb id
  elbIp: ${MOBILE_ELB_IP} #ELB IP
  certificateIds: "${MOBILE_CERTIFICATE_IDS}" #Cerificates IDs
  host: onemerristem.merristem.com
  servicePort: 20010

# Service configuration
service:
  type: ClusterIP
  port: 8081
  targetPort: 20010
  annotations:
    kubernetes.io/elb.class: performance
    kubernetes.io/elb.protocol-port: "https:443"
    kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
    kubernetes.io/elb.health-check-flag: "on"
    kubernetes.io/elb.health-check-option: '{"protocol":"HTTPS","port":"443","uri":"/health","interval":5,"timeout":10,"rise":2,"fall":2}'


