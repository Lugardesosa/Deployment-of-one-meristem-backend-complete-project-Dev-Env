# =============================================================================
# VOLUMES & MOUNTS
# =============================================================================
volumeMounts:
  - name: cloud-gateway-secrets
    mountPath: /mnt/secrets-store/cloud-gateway
    readOnly: true
  - name: gateway-data
    mountPath: /mnt/gateway
  - name: secret-volume
    mountPath: /etc/secrets-store/cloud-gateway
    readOnly: true

volumes:
  - name: gateway-data
    emptyDir: {}
  - name: cloud-gateway-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: cloud-gateway-secrets
  - name: secret-volume
    secret:
      secretName: credentials

# =============================================================================
# SERVICE — ClusterIP, ingress in shared-resources handles external traffic
# =============================================================================
service:
  type: ClusterIP
  port: 8082
  targetPort: 20010
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "20010"
    prometheus.io/path: "/actuator/prometheus"

# =============================================================================
# PROMETHEUS
# =============================================================================
prometheus:
  enabled: true
  path: /actuator/prometheus
  port: 20010

# =============================================================================
# INGRESS — lives in backend-repo/shared-resources
# cloud-gateway is the primary backend entry point referenced in shared ingress
# =============================================================================



