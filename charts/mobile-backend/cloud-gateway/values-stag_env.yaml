##--------------------- CLOUD-GATEWAY VALUES ---------------------
## This file contains the configuration values for the cloud-gateway service deployment.



##--------------------- CLOUD-GATEWAY STAGING VALUES ---------------------
## API Gateway — Spring Boot running on port 20010
## Node pool: backend | Namespace: one-meristem-app
## Routes traffic to all backend microservices

environment: stag-env

global:
  namespace: one-meristem-app
  serviceAccountName: app-spc-sa
  create: false

# =============================================================================
# DEPLOYMENT
# =============================================================================
replicaCount: 2

image:
  repository: swr.af-south-1.myhuaweicloud.com/swr-repo-one-meristem-app-stag-env/cloud-gateway
  pullPolicy: Always
  tag: ""

imagePullSecrets:
  - name: huawei-swr-auth

terminationGracePeriodSeconds: 60

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# =============================================================================
# RESOURCES — gateway handles all inbound traffic, needs more CPU than others
# =============================================================================
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "800m"
    memory: "800Mi"

# =============================================================================
# HEALTH PROBES — Spring Boot actuator endpoints
# =============================================================================
probes:
  startup:
    path: /actuator/health
    failureThreshold: 30      # 30 * 10s = 5 mins max startup
    periodSeconds: 10

  liveness:
    path: /actuator/health
    initialDelaySeconds: 90
    periodSeconds: 35
    timeoutSeconds: 5
    failureThreshold: 5

  readiness:
    path: /actuator/health
    initialDelaySeconds: 45
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 5

# =============================================================================
# SCHEDULING & AVAILABILITY
# =============================================================================
nodePool: one-meristem-backend

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_pool
              operator: In
              values:
                - one-meristem-backend
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - cloud-gateway-stag-env
          topologyKey: kubernetes.io/hostname

# =============================================================================
# AUTOSCALING — CCE CustomedHPA
# Gateway needs higher ceiling — all traffic passes through it
# =============================================================================
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  minScaleStep: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      percentValue: 100
      podsValue: 2
    scaleDown:
      stabilizationWindowSeconds: 300
      percentValue: 25

# =============================================================================
# SECRET PROVIDER CLASS — Redis + Kafka only, no database
# =============================================================================
secretProviderClass:
  name: cloud-gateway-secrets
  provider: cce
  k8sSecretName: cloud-gateway-secrets

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
env:
  GITHUB_BRANCH: "test_env"
  APP_PROFILE: "staging"
  COMPANY_NAME: "Meristem Securities Limited"
  DATA_PRIVACY_POLICY_URL: "https://www.onemeristem.meristemng.com"
  GREEN_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Green_Logo.png"
  WHITE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_White_Logo.png"
  FINANCE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Finance_Logo.png"

  # Internal service URIs — using Kubernetes DNS
  CONFIG_SERVER_URI: "http://config-server-stag-env.one-meristem-app.svc.cluster.local:8082/config"
  USER_SERVICE_URI: "http://users-service-stag-env.one-meristem-app.svc.cluster.local:8082"
  NOTIFICATION_SERVICE_URI: "http://notification-service-stag-env.one-meristem-app.svc.cluster.local:8082"
  WALLET_SERVICE_URI: "http://wallet-service-stag-env.one-meristem-app.svc.cluster.local:8082"
  REPORT_SERVICE_URI: "http://report-service-stag-env.one-meristem-app.svc.cluster.local:8082"
  TRUSTEES_SERVICE_URI: "http://trustees-service-stag-env.one-meristem-app.svc.cluster.local:8082"
  WEALTH_SERVICE_URI: "http://wealth-service-stag-env.one-meristem-app.svc.cluster.local:8082"

  # Gateway config
  ADMIN_USERNAME: "admin"
  GATEWAY_REPLENISH_RATE: "10"
  GATEWAY_BURST_CAPACITY: "20"
  GATEWAY_REQUESTED_TOKENS: "2"
  WHITELISTED_IPS: "52.18.220.93,18.202.96.242"
  GATEWAY_SERVICE_HOSTNAME: "cloud-gateway-stag-env.one-meristem-app.svc.cluster.local"
  GATEWAY_SERVICE_PORT: "8082"
  CONSUL_HOST: "consul-stag-env.one-meristem-app.svc.cluster.local"
  ALLOWED_ORIGINS: "https://onemeristemstag.meristemng.com,https://admin.onemeristemstag.meristemng.com"
  ENC_ALGORITHM: "AES"
  ENC_ALGORITHM_GCM: "AES/GCM/NoPadding"
  MIDDLE_WARE_BASE_URL: "http://gateway-api-stag-env.middleware-core-app.svc.cluster.local:8080"

# =============================================================================
# SECRET ENV — pulled from credentials and cloud-gateway-secrets
# Keys match credentials-secret.yaml template exactly
# =============================================================================
secretEnv:
  ADMIN_PASSWORD:
    secretName: credentials
    secretKey: ADMIN_PASSWORD          # matches credentials template
  ENCRYPTION_KEY:
    secretName: credentials
    secretKey: ENCRYPTION_KEY          # matches credentials template
  H2_PASSWORD:
    secretName: credentials
    secretKey: H2_PASSWORD             # matches credentials template
  ENC_SALT:
    secretName: credentials
    secretKey: ENC_SALT                # matches credentials template
  REDIS_HOST:
    secretName: cloud-gateway-secrets  # from CSMS via SecretProviderClass
    secretKey: REDIS_HOST
  REDIS_PASSWORD:
    secretName: cloud-gateway-secrets  # from CSMS via SecretProviderClass
    secretKey: REDIS_PASSWORD
    
