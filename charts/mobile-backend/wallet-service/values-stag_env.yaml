# =============================================================================
# VOLUMES & MOUNTS
# =============================================================================
volumeMounts:
  - name: wallet-service-secrets
    mountPath: /mnt/secrets-store/wallet-service
    readOnly: true
  - name: wallet-data
    mountPath: /mnt/wallet
  - name: secret-volume
    mountPath: /etc/secrets-store/wallet-service
    readOnly: true

volumes:
  - name: wallet-data
    emptyDir: {}
  - name: wallet-service-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: wallet-service-secrets
  - name: secret-volume
    secret:
      secretName: credentials

# =============================================================================
# SERVICE
# =============================================================================
service:
  type: ClusterIP
  port: 8082
  targetPort: 20040
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "20040"
    prometheus.io/path: "/api/wallets/actuator/prometheus"
    consul.hashicorp.com/service-name: "wallet-service"
    consul.hashicorp.com/service-tags: "springboot,backend,wallet"
    consul.hashicorp.com/service-meta-environment: "stag-env"
    consul.hashicorp.com/check-path: "/api/wallets/actuator/health"
    consul.hashicorp.com/check-interval: "30s"
    consul.hashicorp.com/check-timeout: "15s"
    consul.hashicorp.com/check-method: "GET"

# =============================================================================
# PROMETHEUS
# =============================================================================
prometheus:
  enabled: true
  path: /api/wallets/actuator/prometheus
  port: 20040

