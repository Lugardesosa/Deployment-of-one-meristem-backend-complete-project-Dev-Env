##--------------------- WALLET-SERVICE STAGING VALUES ---------------------
## Spring Boot Wallet Service — payments, transactions, virtual accounts
## Node pool: backend | Namespace: one-meristem-app
## Port: 20040 (actuator/app) | Service port: 8082

environment: stag-env

global:
  namespace: one-meristem-app
  serviceAccountName: app-spc-sa
  create: false

# =============================================================================
# DEPLOYMENT
# =============================================================================
replicaCount: 2

image:
  repository: swr.af-south-1.myhuaweicloud.com/swr-repo-one-meristem-app-stag-env/wallet-service
  tag: ""
  pullPolicy: Always

imagePullSecrets:
  - name: huawei-swr-auth

terminationGracePeriodSeconds: 60

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# =============================================================================
# RESOURCES — wallet handles financial transactions, needs stable memory
# =============================================================================
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "800m"
    memory: "1Gi"

# =============================================================================
# HEALTH PROBES
# =============================================================================
probes:
  startup:
    path: /api/wallets/actuator/health
    failureThreshold: 30
    periodSeconds: 10

  liveness:
    path: /api/wallets/actuator/health
    initialDelaySeconds: 120
    periodSeconds: 40
    timeoutSeconds: 5
    failureThreshold: 5

  readiness:
    path: /api/wallets/actuator/health
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

# =============================================================================
# SCHEDULING & AVAILABILITY
# =============================================================================
nodePool: one-meristem-backend

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_pool
              operator: In
              values:
                - one-meristem-backend
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - wallet-service-stag-env
          topologyKey: kubernetes.io/hostname

# =============================================================================
# AUTOSCALING — CCE CustomedHPA
# Wallet handles payments — higher ceiling for transaction spikes
# =============================================================================
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  minScaleStep: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      percentValue: 100
      podsValue: 2
    scaleDown:
      stabilizationWindowSeconds: 300
      percentValue: 25

# =============================================================================
# SECRET PROVIDER CLASS
# =============================================================================
secretProviderClass:
  name: wallet-service-secrets
  provider: cce
  k8sSecretName: wallet-service-secrets

# =============================================================================
# NETWORK POLICY — egress to middleware namespace
# Enable when middleware services are deployed
# =============================================================================
networkpolicy:
  enabled: true    
  middlewareNamespace: middleware-core-app
  middlewarePorts:  
    - 8080    # all middleware API services listen here

nameOverride: ""
fullnameOverride: ""

# =============================================================================
