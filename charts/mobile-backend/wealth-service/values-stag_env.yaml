  ADMIN_PASSWORD:
    secretName: credentials
    secretKey: ADMIN_PASSWORD
  ENCRYPTION_KEY:
    secretName: credentials
    secretKey: ENCRYPTION_KEY
  H2_PASSWORD:
    secretName: credentials
    secretKey: H2_PASSWORD
  WEALTH_CLIENT_SECRET:
    secretName: credentials
    secretKey: WEALTH_CLIENT_SECRET    # named key — no more key21 confusion
  ENC_SALT:
    secretName: credentials
    secretKey: ENC_SALT
  ID_HASHING_SECRET:
    secretName: credentials
    secretKey: ID_HASHING_SECRET
  WALLET_SECRET:
    secretName: credentials
    secretKey: WALLET_SECRET
  WEALTH_SECRET:
    secretName: credentials
    secretKey: WEALTH_SECRET
  MIDDLE_WARE_API_KEY:
    secretName: credentials
    secretKey: MIDDLE_WARE_API_KEY
    
  # From CSMS via SecretProviderClass
  DB_SERVER:
    secretName: wealth-service-secrets
    secretKey: DB_SERVER
  WEALTH_DB_NAME:
    secretName: wealth-service-secrets
    secretKey: WEALTH_DB_NAME
  WEALTH_DB_USERNAME:
    secretName: wealth-service-secrets
    secretKey: WEALTH_DB_USERNAME
  WEALTH_DB_PASSWORD:
    secretName: wealth-service-secrets
    secretKey: WEALTH_DB_PASSWORD
  KAFKA_HOST_URL:
    secretName: wealth-service-secrets
    secretKey: KAFKA_HOST_URL
  REDIS_HOST:
    secretName: wealth-service-secrets
    secretKey: REDIS_HOST
  REDIS_PASSWORD:
    secretName: wealth-service-secrets
    secretKey: REDIS_PASSWORD

