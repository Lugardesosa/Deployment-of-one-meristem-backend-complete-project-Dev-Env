##--------------------- WEALTH-SERVICE STAGING VALUES ---------------------
## Spring Boot Wealth Service — wealth management, investments
## Node pool: backend | Namespace: one-meristem-app
## Port: 20070 (actuator/app) | Service port: 8082

environment: stag-env

global:
  namespace: one-meristem-app
  serviceAccountName: app-spc-sa
  create: false

# networkpolicy:
#   enabled: false

# =============================================================================
# DEPLOYMENT
# =============================================================================
replicaCount: 2

image:
  repository: swr.af-south-1.myhuaweicloud.com/swr-repo-one-meristem-app-stag-env/wealth-service
  tag: ""
  pullPolicy: Always

imagePullSecrets:
  - name: huawei-swr-auth

terminationGracePeriodSeconds: 60

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# =============================================================================
# RESOURCES
# =============================================================================
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "800m"
    memory: "900Mi"

# =============================================================================
# HEALTH PROBES
# =============================================================================
probes:
  startup:
    path: /api/wealth/actuator/health
    failureThreshold: 30
    periodSeconds: 10

  liveness:
    path: /api/wealth/actuator/health
    initialDelaySeconds: 120
    periodSeconds: 40
    timeoutSeconds: 5
    failureThreshold: 5

  readiness:
    path: /api/wealth/actuator/health
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

# =============================================================================
# SCHEDULING & AVAILABILITY
# =============================================================================
nodePool: one-meristem-backend

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_pool
              operator: In
              values:
                - one-meristem-backend
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - wealth-service-stag-env
          topologyKey: kubernetes.io/hostname

# =============================================================================
# AUTOSCALING — CCE CustomedHPA
# =============================================================================
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  minScaleStep: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      percentValue: 100
      podsValue: 2
    scaleDown:
      stabilizationWindowSeconds: 300
      percentValue: 25

# =============================================================================
# SECRET PROVIDER CLASS
# =============================================================================
secretProviderClass:
  name: wealth-service-secrets
  provider: cce
  k8sSecretName: wealth-service-secrets

# =============================================================================
# NETWORK POLICY — egress to middleware namespace
# Enable when middleware services are deployed
# =============================================================================
networkpolicy:
  enabled: true    
  middlewareNamespace: middleware-core-app
  middlewarePorts:  
    - 8080    # all middleware API services listen here

nameOverride: ""
fullnameOverride: ""

# =============================================================================
