# =============================================================================
# VOLUMES & MOUNTS
# =============================================================================
volumeMounts:
  - name: wealth-service-secrets
    mountPath: /mnt/secrets-store/wealth-service
    readOnly: true
  - name: wealth-data
    mountPath: /mnt/wealth
  - name: secret-volume
    mountPath: /etc/secrets-store/wealth-service
    readOnly: true

volumes:
  - name: wealth-data
    emptyDir: {}
  - name: wealth-service-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: wealth-service-secrets
  - name: secret-volume
    secret:
      secretName: credentials

# =============================================================================
# SERVICE
# =============================================================================
service:
  type: ClusterIP
  port: 8082
  targetPort: 20070
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "20070"
    prometheus.io/path: "/api/wealth/actuator/prometheus"
    # consul.hashicorp.com/service-name: "wealth-service"
    # consul.hashicorp.com/service-tags: "springboot,backend,wealth"
    # consul.hashicorp.com/service-meta-environment: "stag-env"
    # consul.hashicorp.com/check-path: "/api/wealth/actuator/health"
    # consul.hashicorp.com/check-interval: "10s"
    # consul.hashicorp.com/check-timeout: "5s"

# =============================================================================
# PROMETHEUS
# =============================================================================
prometheus:
  enabled: true
  path: /api/wealth/actuator/prometheus
  port: 20070

# =============================================================================
# INGRESS — lives in backend-repo/shared-resources
# =============================================================================
