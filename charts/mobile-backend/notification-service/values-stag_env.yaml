   secretName: credentials
   secretKey: ID_HASHING_SECRET
  WALLET_SECRET:
    secretName: credentials
    secretKey: WALLET_SECRET
  MIDDLE_WARE_API_KEY:
    secretName: credentials
    secretKey: MIDDLE_WARE_API_KEY
    
  # From CSMS via SecretProviderClass
  DB_SERVER:
    secretName: notification-service-secrets
    secretKey: DB_SERVER
  NOTIFICATION_DB_NAME:
    secretName: notification-service-secrets
    secretKey: NOTIFICATION_DB_NAME
  NOTIFICATION_DB_USERNAME:
