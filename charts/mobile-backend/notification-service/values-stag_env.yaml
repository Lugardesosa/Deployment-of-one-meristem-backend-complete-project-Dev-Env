##--------------------- NOTIFICATION-SERVICE STAGING VALUES ---------------------
## Spring Boot Notification Service — email, SMS, push notifications
## Node pool: backend | Namespace: one-meristem-app
## Port: 20030 (actuator/app) | Service port: 8082

environment: stag-env

global:
  namespace: one-meristem-app
  serviceAccountName: app-spc-sa
  create: false

# =============================================================================
# DEPLOYMENT
# =============================================================================
replicaCount: 2

image:
  repository: swr.af-south-1.myhuaweicloud.com/swr-repo-one-meristem-app-stag-env/notification-service
  tag: ""
  pullPolicy: Always

imagePullSecrets:
  - name: huawei-swr-auth

terminationGracePeriodSeconds: 60

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# =============================================================================
# RESOURCES
# =============================================================================
resources:
  requests:
    cpu: "500m"
    memory: "400Mi"
  limits:
    cpu: "800m"
    memory: "700Mi"

# =============================================================================
# HEALTH PROBES
# =============================================================================
probes:
  startup:
    path: /api/notification/actuator/health
    failureThreshold: 30
    periodSeconds: 10

  liveness:
    path: /api/notification/actuator/health
    initialDelaySeconds: 120
    periodSeconds: 60
    timeoutSeconds: 5
    failureThreshold: 5

  readiness:
    path: /api/notification/actuator/health
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# SCHEDULING & AVAILABILITY
# =============================================================================
nodePool: one-meristem-backend

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_pool
              operator: In
              values:
                - one-meristem-backend
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - notification-service-stag-env
          topologyKey: kubernetes.io/hostname

# =============================================================================
# AUTOSCALING — CCE CustomedHPA
# =============================================================================
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  minScaleStep: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      percentValue: 100
      podsValue: 2
    scaleDown:
      stabilizationWindowSeconds: 300
      percentValue: 25

# =============================================================================
# SECRET PROVIDER CLASS
# =============================================================================
secretProviderClass:
  name: notification-service-secrets
  provider: cce
  k8sSecretName: notification-service-secrets

# =============================================================================
# NETWORK POLICY — egress to middleware namespace
# Enable when middleware services are deployed
# =============================================================================
networkpolicy:
  enabled: true    
  middlewareNamespace: middleware-core-app
  middlewarePorts:  
    - 8080    # all middleware API services listen here

nameOverride: ""
fullnameOverride: ""

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
env:
  COMPANY_NAME: "Meristem Securities Limited"
  DATA_PRIVACY_POLICY_URL: "https://www.onemeristem.meristemng.com"
  GREEN_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Green_Logo.png"
  WHITE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_White_Logo.png"
  FINANCE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Finance_Logo.png"
  GITHUB_BRANCH: "test_env"
  APP_PROFILE: "staging"
  ONE_APP_SERVER_URL: "https://onemeristemstag.meristemng.com"
  ONE_APP_EMAIL: "hello@onemeristem.meristemng.com"
  ADMIN_USERNAME: "admin"
  CONFIG_SERVER_URI: "http://config-server-stag-env.one-meristem-app.svc.cluster.local:8082/config"
  CREDIT_SWITCH_LOGIN_ID: "315497"
  CREDIT_SWITCH_SMS_MERCHANT_NAME: "Meristem Securities Limited"
  CREDIT_SWITCH_SMS_BASEURL: "http://176.58.99.160:9014/api/v1/sms/send"
  CREDIT_SWITCH_SMS_SENDER_ID: "Meristem"
  # CONSUL_HOST: "consul-stag-env.one-meristem-app.svc.cluster.local"
  NOTIFICATION_SERVICE_HOSTNAME: "notification-service-stag-env.one-meristem-app.svc.cluster.local"
  NOTIFICATION_SERVICE_PORT: "8082"
  NOTIFICATION_SERVICE_URI: "http://notification-service-stag-env.one-meristem-app.svc.cluster.local:8082"
  TRUSTEES_CLIENT_ID: "trustees-service"
  HUAWEI_OBS_UNSTRUCTURED_BUCKET: "obs-unstructured-logo-one-meristem-stag-env"
  MAIL_SENDER: "reply@onemeristem.meristemng.com"
  MAILER_HOST: "live.smtp.mailtrap.io"
  MERISTEM_GREEN_LOGO: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Green_Logo.png"
  SUPPORT_PHONE: "0700-MERISTEM"
  SUPPORT_EMAIL: "support@onemeristem.com"
  MAIL_SENDER_NAME: "One Meristem"
  MAILER_PORT: "2525"
  EXPO_URL: "https://exp.host/--/api/v2"
  ENC_ALGORITHM: "AES"
  ENC_ALGORITHM_GCM: "AES/GCM/NoPadding"
  USER_SERVICE_URI: "http://users-service-stag-env.one-meristem-app.svc.cluster.local:8082"
  HOLLA_TAGS_FROM: "maijamaa190"
  MIDDLE_WARE_BASE_URL: "http://gateway-api-stag-env.middleware-core-app.svc.cluster.local:8080"

