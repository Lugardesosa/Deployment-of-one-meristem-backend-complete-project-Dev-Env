# =============================================================================
# VOLUMES & MOUNTS
# =============================================================================
volumeMounts:
  - name: notification-service-secrets
    mountPath: /mnt/secrets-store/notification-service
    readOnly: true
  - name: notification-data
    mountPath: /mnt/notification
  - name: secret-volume
    mountPath: /etc/secrets-store/notification-service
    readOnly: true

volumes:
  - name: notification-data
    emptyDir: {}
  - name: notification-service-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: notification-service-secrets
  - name: secret-volume
    secret:
      secretName: credentials

# =============================================================================
# SERVICE
# =============================================================================
service:
  type: ClusterIP
  port: 8082
  targetPort: 20030
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "20030"
    prometheus.io/path: "/api/notification/actuator/prometheus"
    # consul.hashicorp.com/service-name: "notification-service"
    # consul.hashicorp.com/service-tags: "springboot,backend,notification"
    # consul.hashicorp.com/service-meta-environment: "stag-env"
    # consul.hashicorp.com/check-path: "/api/notification/actuator/health"
    # consul.hashicorp.com/check-interval: "10s"
    # consul.hashicorp.com/check-timeout: "5s"

# =============================================================================
# PROMETHEUS
# =============================================================================
prometheus:
  enabled: true
  path: /api/notification/actuator/prometheus
  port: 20030

# =============================================================================
# INGRESS — lives in backend-repo/shared-resources
