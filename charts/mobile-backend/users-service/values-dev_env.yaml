secretEnv:
  ADMIN_PASSWORD:
    secretName: credentials
    secretKey: key3
  DB_SERVER:
    secretName: huawei-csms-credentials
    secretKey: DB_SERVER
  USERS_DB_NAME:
    secretName: huawei-csms-credentials
    secretKey: USERS_DB_NAME
  USERS_DB_USERNAME:
    secretName: huawei-csms-credentials
    secretKey: USERS_DB_USERNAME
  USERS_DB_PASSWORD:
    secretName: huawei-csms-credentials
    secretKey: USERS_DB_PASSWORD
  KAFKA_HOST_URL:
    secretName: huawei-csms-credentials
    secretKey: KAFKA_HOST_URL
  REDIS_HOST:
    secretName: huawei-csms-credentials
    secretKey: REDIS_HOST
  REDIS_PASSWORD:
    secretName: huawei-csms-credentials
    secretKey: REDIS_PASSWORD
  MAILER_HOST:
    secretName: credentials
    secretKey: key5
  MAILER_USERNAME:
    secretName: credentials
    secretKey: key6
  MAILER_PASSWORD:
    secretName: credentials
    secretKey: key7
  HUAWEI_ACCESS_KEY_ID:
    secretName: credentials
    secretKey: key11
  HUAWEI_SECRET_ACCESS_KEY_ID:
    secretName: credentials
    secretKey: key12
  H2_PASSWORD:
    secretName: credentials
    secretKey: key13
  TRUSTEES_CLIENT_SECRET: 
    secretName: credentials
    secretKey: key16

volumeMounts:
  - name: huawei-csms-credentials
    mountPath: /mnt/secrets-store/users-service
    readOnly: true
  - name: users-data
    mountPath: /mnt/users
  - name: secret-volume
    mountPath: /etc/secrets-store/users-service
    readOnly: true
  - name: users-service-storage
    mountPath: /app/data/geoip 
    readOnly: true

volumes:
  - name: users-data
    emptyDir: {}
  - name: huawei-csms-credentials
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: huawei-csms-credentials
        #csi.storage.k8s.io/provisioner-secret-name: huawei-csms-credentials
        #csi.storage.k8s.io/provisioner-secret-namespace: one-meristem-app
  - name: secret-volume
    secret:
      secretName: credentials
  - name: users-service-storage
    persistentVolumeClaim:
      claimName: users-service-pvc


resources:
  limits:
    cpu: "0.7"
    memory: 720Mi
  requests:
    cpu: "0.5"
    memory: 512Mi

imagePullSecrets:
  - name: huawei-swr-auth #relying on CCE's automatic injection

# pvc:
#   name: users-service-pvc-evs
#   accessModes:
#     - ReadWriteOnce
#   resources:
#     requests:
#       storage: 20Gi
#   storageClassName: csi-disk-topology
#   volumeMode: Filesystem

# Persistent Volume configuration
pv:
  name: pv-obs-users-service

pvc:
  name: users-service-pvc
  size: 500Mi




# HorizontalPodAutoscaler configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70


# service configuration
service:
  type: ClusterIP
  name: users-service
  port: 8082
  targetPort: 20020
