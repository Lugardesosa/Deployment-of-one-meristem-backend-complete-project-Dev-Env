# =============================================================================
# VOLUMES & MOUNTS — includes OBS PVC for GeoIP database
# =============================================================================
volumeMounts:
  - name: users-service-secrets
    mountPath: /mnt/secrets-store/users-service
    readOnly: true
  - name: users-data
    mountPath: /mnt/users
  - name: secret-volume
    mountPath: /etc/secrets-store/users-service
    readOnly: true
  - name: users-service-storage
    mountPath: /app/data/geoip
    readOnly: true

volumes:
  - name: users-data
    emptyDir: {}
  - name: users-service-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: users-service-secrets
  - name: secret-volume
    secret:
      secretName: credentials
  - name: users-service-storage
    persistentVolumeClaim:
      claimName: users-service-pvc

# =============================================================================
# OBS PVC — GeoIP database stored in OBS bucket
# =============================================================================
pvc:
  enabled: true
  useExistingBucket: true
  name: users-service-pvc
  size: "1Gi"

everest:
  enterpriseProjectID: ad2cb210-4c6e-47dd-9a5a-bcc02dc3faeb

# =============================================================================
# SERVICE
# NOTE: targetPort 20020 is app port, prometheus scrapes on 20030
# Ensure app exposes actuator on separate management port 20030
# =============================================================================
service:
  type: ClusterIP
  port: 8082
  targetPort: 20020
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "20030"
    prometheus.io/path: "/api/users/actuator/prometheus"
    consul.hashicorp.com/service-name: "users-service"
    consul.hashicorp.com/service-tags: "springboot,backend,users"
    consul.hashicorp.com/service-meta-environment: "stag-env"
    consul.hashicorp.com/check-path: "/api/users/actuator/health"  # fixed — was /actuator/health
    consul.hashicorp.com/check-interval: "10s"
    consul.hashicorp.com/check-timeout: "5s"

