# {{- if .Values.pvc.enabled }}
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: {{ .Values.pvc.name }}
#   namespace: {{ .Values.global.namespace }}
#   annotations:
#     everest.io/obs-volume-type: STANDARD
# spec:
