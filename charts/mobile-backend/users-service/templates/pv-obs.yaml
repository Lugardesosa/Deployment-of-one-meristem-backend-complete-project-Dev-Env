
{{- if and .Values.pvc.enabled .Values.pvc.useExistingBucket }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: users-service-obs-pv-{{ .Values.environment }}
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  labels:
    argocd.argoproj.io/instance: users-service
spec:
  capacity:
    storage: {{ .Values.pvc.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: obs.csi.everest.io
    nodeStageSecretRef:
      name: huawei-credentials-obs-ak
      namespace: one-meristem-app
    volumeAttributes:
      everest.io/obs-volume-type: STANDARD
      storage.kubernetes.io/csiProvisionerIdentity: obs.csi.everest.io
    volumeHandle: obs-microservice-storage-one-meristem-app-{{ .Values.environment }}
{{- end }}
