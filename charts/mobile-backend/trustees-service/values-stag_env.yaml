##--------------------- TRUSTEES-SERVICE STAGING VALUES ---------------------
## Spring Boot Trustees Service
## Node pool: backend | Namespace: one-meristem-app
## Port: 20060 (actuator/app) | Service port: 8082

environment: stag-env

global:
  namespace: one-meristem-app
  serviceAccountName: app-spc-sa
  create: false

# networkpolicy:
#   enabled: false

# =============================================================================
# DEPLOYMENT
# =============================================================================
replicaCount: 2

image:
  repository: swr.af-south-1.myhuaweicloud.com/swr-repo-one-meristem-app-stag-env/trustees-service
  tag: ""
  pullPolicy: Always

imagePullSecrets:
  - name: huawei-swr-auth

terminationGracePeriodSeconds: 60

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# =============================================================================
# RESOURCES
# =============================================================================
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "800Mi"

# =============================================================================
# HEALTH PROBES
# =============================================================================
probes:
  startup:
    path: /api/trustees/actuator/health
    failureThreshold: 30
    periodSeconds: 10

  liveness:
    path: /api/trustees/actuator/health
    initialDelaySeconds: 120
    periodSeconds: 40
    timeoutSeconds: 5
    failureThreshold: 5

  readiness:
    path: /api/trustees/actuator/health
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# SCHEDULING & AVAILABILITY
# =============================================================================
nodePool: one-meristem-backend

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_pool
              operator: In
              values:
                - one-meristem-backend
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - trustees-service-stag-env
          topologyKey: kubernetes.io/hostname

# =============================================================================
# AUTOSCALING — CCE CustomedHPA
# =============================================================================
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  minScaleStep: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      percentValue: 100
      podsValue: 2
    scaleDown:
      stabilizationWindowSeconds: 300
      percentValue: 25

# =============================================================================
# SECRET PROVIDER CLASS
# =============================================================================
secretProviderClass:
  name: trustees-service-secrets
  provider: cce
  k8sSecretName: trustees-service-secrets

# =============================================================================
# NETWORK POLICY — egress to middleware namespace
# Enable when middleware services are deployed
# =============================================================================
networkpolicy:
  enabled: true    
  middlewareNamespace: middleware-core-app
  middlewarePorts:  
    - 8080    # all middleware API services listen here

nameOverride: ""
fullnameOverride: ""

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
env:
  COMPANY_NAME: "Meristem Securities Limited"
  DATA_PRIVACY_POLICY_URL: "https://www.onemeristem.meristemng.com"
  GREEN_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Green_Logo.png"
  WHITE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_White_Logo.png"
  FINANCE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Finance_Logo.png"
  GITHUB_BRANCH: "test_env"
  APP_PROFILE: "staging"
  ONE_APP_SERVER_URL: "https://onemeristemstag.meristemng.com"
  ONE_APP_EMAIL: "hello@onemeristem.meristemng.com"
  ADMIN_USERNAME: "admin"
  CONFIG_SERVER_URI: "http://config-server-stag-env.one-meristem-app.svc.cluster.local:8082/config"
  TRUSTEES_CLIENT_ID: "trustees-service"
  TRUSTEES_SERVICE_HOSTNAME: "trustees-service-stag-env.one-meristem-app.svc.cluster.local"
  TRUSTEES_SERVICE_PORT: "8082"
  TRUSTEES_SERVICE_URI: "http://trustees-service-stag-env.one-meristem-app.svc.cluster.local:8082"
  CONSUL_HOST: "consul-stag-env.one-meristem-app.svc.cluster.local"
  USER_SERVICE_URI: "http://users-service-stag-env.one-meristem-app.svc.cluster.local:8082"
  USER_SERVICE_HOSTNAME: "users-service-stag-env.one-meristem-app.svc.cluster.local"
  HUAWEI_OBS_UNSTRUCTURED_BUCKET: "obs-unstructured-logo-one-meristem-stag-env"
  MERISTEM_GREEN_LOGO: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Green_Logo.png"
  SUPPORT_PHONE: "0700-MERISTEM"
  SUPPORT_EMAIL: "support@onemeristem.com"
  ENC_ALGORITHM: "AES"
  ENC_ALGORITHM_GCM: "AES/GCM/NoPadding"
  MIDDLE_WARE_BASE_URL: "http://gateway-api-stag-env.middleware-core-app.svc.cluster.local:8080"

# =============================================================================
# SECRET ENV — keys match credentials-secret.yaml template exactly
# =============================================================================
secretEnv:
  # From credentials Kubernetes secret
  ADMIN_PASSWORD:
    secretName: credentials
    secretKey: ADMIN_PASSWORD
  ENCRYPTION_KEY:
    secretName: credentials
    secretKey: ENCRYPTION_KEY
  H2_PASSWORD:
    secretName: credentials
    secretKey: H2_PASSWORD
  TRUSTEES_CLIENT_SECRET:
    secretName: credentials
    secretKey: TRUSTEES_CLIENT_SECRET
  ENC_SALT:
    secretName: credentials
    secretKey: ENC_SALT
  ID_HASHING_SECRET:
    secretName: credentials
    secretKey: ID_HASHING_SECRET
  WALLET_SECRET:
    secretName: credentials
    secretKey: WALLET_SECRET
  MIDDLE_WARE_API_KEY:
    secretName: credentials
    secretKey: MIDDLE_WARE_API_KEY
    
  # From CSMS via SecretProviderClass
  DB_SERVER:
    secretName: trustees-service-secrets
    secretKey: DB_SERVER
  TRUSTEES_DB_NAME:
    secretName: trustees-service-secrets
    secretKey: TRUSTEES_DB_NAME
  TRUSTEES_DB_USERNAME:
    secretName: trustees-service-secrets
    secretKey: TRUSTEES_DB_USERNAME
  TRUSTEES_DB_PASSWORD:
    secretName: trustees-service-secrets
    secretKey: TRUSTEES_DB_PASSWORD
  KAFKA_HOST_URL:
    secretName: trustees-service-secrets
    secretKey: KAFKA_HOST_URL
  REDIS_HOST:
    secretName: trustees-service-secrets
    secretKey: REDIS_HOST
  REDIS_PASSWORD:
    secretName: trustees-service-secrets
    secretKey: REDIS_PASSWORD

