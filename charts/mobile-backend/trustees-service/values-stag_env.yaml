# =============================================================================
# VOLUMES & MOUNTS
# Fixed: mountPath was pointing to notification-service — corrected to trustees-service
# =============================================================================
volumeMounts:
  - name: trustees-service-secrets
    mountPath: /mnt/secrets-store/trustees-service    # fixed — was /mnt/secrets-store/notification-service
    readOnly: true
  - name: trustees-data
    mountPath: /mnt/trustees
  - name: secret-volume
    mountPath: /etc/secrets-store/trustees-service
    readOnly: true

volumes:
  - name: trustees-data
    emptyDir: {}
  - name: trustees-service-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: trustees-service-secrets
  - name: secret-volume
    secret:
      secretName: credentials

# =============================================================================
# SERVICE
# =============================================================================
service:
  type: ClusterIP
  port: 8082
  targetPort: 20060
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "20060"
    prometheus.io/path: "/api/trustees/actuator/prometheus"
    consul.hashicorp.com/service-name: "trustees-service"
    consul.hashicorp.com/service-tags: "springboot,backend,trustees"
    consul.hashicorp.com/service-meta-environment: "stag-env"
    consul.hashicorp.com/check-path: "/api/trustees/actuator/health"  # fixed — was /actuator/health
    consul.hashicorp.com/check-interval: "10s"
    consul.hashicorp.com/check-timeout: "5s"

# =============================================================================
# PROMETHEUS
# =============================================================================
prometheus:
  enabled: true
  path: /api/trustees/actuator/prometheus
  port: 20060

# =============================================================================
# INGRESS — lives in backend-repo/shared-resources
# =============================================================================

ingress:
  enabled: false

# =============================================================================
# CERTIFICATE — prod only
# =============================================================================
certificate:
  enabled: false
