##--------------------- CONFIG-SERVER STAGING VALUES ---------------------
## Spring Cloud Config Server — reads config from GitHub
## Node pool: backend | Namespace: one-meristem-app
## All microservices depend on this — must be healthy before others start

environment: stag-env

global:
  namespace: one-meristem-app
  serviceAccountName: app-spc-sa
  create: false

# =============================================================================
# DEPLOYMENT
# =============================================================================
replicaCount: 2

image:
  repository: swr.af-south-1.myhuaweicloud.com/swr-repo-one-meristem-app-stag-env/config-server
  tag: ""
  pullPolicy: Always

imagePullSecrets:
  - name: huawei-swr-auth

terminationGracePeriodSeconds: 60

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# =============================================================================
# RESOURCES — config server reads from GitHub on boot, needs stable memory
# =============================================================================
resources:
  requests:
    cpu: "400m"
    memory: "600Mi"
  limits:
    cpu: "800m"
    memory: "900Mi"

# =============================================================================
# HEALTH PROBES — config server path prefix is /config/actuator/health
# Longer startup time — clones GitHub repo on boot
# =============================================================================
probes:
  startup:
    path: /config/actuator/health
    failureThreshold: 36      # 36 * 10s = 6 mins — GitHub clone can be slow
    periodSeconds: 10

  liveness:
    path: /config/actuator/health
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

  readiness:
    path: /config/actuator/health
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# SCHEDULING & AVAILABILITY
# =============================================================================
nodePool: one-meristem-backend

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_pool
              operator: In
              values:
                - one-meristem-backend
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - config-server-stag-env
          topologyKey: kubernetes.io/hostname

# =============================================================================
# AUTOSCALING — config server is mostly read-only, low scale ceiling
# =============================================================================
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4        # config server rarely needs more than 2-4 replicas
  minScaleStep: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      percentValue: 100
      podsValue: 2
    scaleDown:
      stabilizationWindowSeconds: 300
      percentValue: 25

# =============================================================================
# ENVIRONMENT VARIABLES — no secretEnv list format, using map format
# =============================================================================
env:
  GREEN_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Green_Logo.png"
  WHITE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_White_Logo.png"
  FINANCE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-stag-env.obs.af-south-1.myhuaweicloud.com/Meristem_Finance_Logo.png"
  DATA_PRIVACY_POLICY_URL: "https://www.onemeristem.meristemng.com"
  COMPANY_NAME: "Meristem Securities Limited"
  GITHUB_BRANCH: "test_env"
  SERVER_PORT: "20000"
  ADMIN_USERNAME: "admin"
  ENC_ALGORITHM: "AES"
  ENC_ALGORITHM_GCM: "AES/GCM/NoPadding"
  GITHUB_URL: "https://github.com/mit-meristem/one_meristem_app.git"
  SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START: "true"
  SPRING_CLOUD_CONFIG_SERVER_GIT_TIMEOUT: "30"
  SPRING_CLOUD_CONFIG_SERVER_GIT_REFRESH_RATE: "10"

# =============================================================================
# SECRET ENV — all from credentials secret
# Keys match credentials-secret.yaml template exactly
# =============================================================================
secretEnv:
  ADMIN_PASSWORD:
    secretName: credentials
    secretKey: ADMIN_PASSWORD      # matches credentials template
  GITHUB_USERNAME:
    secretName: credentials
    secretKey: GITHUB_USERNAME     # matches credentials template
  GITHUB_PASSWORD:
    secretName: credentials
    secretKey: GITHUB_PASSWORD     # matches credentials template
  ENCRYPTION_KEY:
    secretName: credentials
    secretKey: ENCRYPTION_KEY      # matches credentials template
  H2_PASSWORD:
    secretName: credentials
    secretKey: H2_PASSWORD         # matches credentials template
  ENC_SALT:
    secretName: credentials
    secretKey: ENC_SALT            # matches credentials template

# secretEnv:
#   ADMIN_PASSWORD:
#     secretName: credentials
#     secretKey: key3
#   GITHUB_USERNAME:
#     secretName: credentials
#     secretKey: key1
#   GITHUB_PASSWORD:
#     secretName: credentials
#     secretKey: key2
#   ENCRYPTION_KEY:
#     secretName: credentials
#     secretKey: key4
#   H2_PASSWORD:
#     secretName: credentials
#     secretKey: key13
#   ENC_SALT:
#     secretName: credentials
#     secretKey: key17

# =============================================================================
# VOLUMES & MOUNTS — no CSI secrets needed, only credentials secret
# Config server does not need CSMS — it reads from GitHub not database
# =============================================================================
volumeMounts:
  - name: secret-volume
    mountPath: /etc/secrets-store/config-server
    readOnly: true
  - name: config-data
    mountPath: /mnt/config

volumes:
  - name: config-data
    emptyDir: {}
  - name: secret-volume
    secret:
      secretName: credentials

# =============================================================================
# SERVICE
# =============================================================================
service:
  type: ClusterIP
  port: 8082
  targetPort: 20000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "20000"
    prometheus.io/path: "/api/config/actuator/prometheus"

# =============================================================================
# PROMETHEUS
# =============================================================================
prometheus:
  enabled: true
  path: /api/config/actuator/prometheus
  port: 20000

# =============================================================================
# INGRESS — lives in backend-repo/shared-resources
# Config server is internal only — not exposed externally
# =============================================================================
