#--------------------- CONFIG-SERVER VALUES ---------------------
# This file contains the configuration values for the config-server service deployment.

environment: stag-env

global:
  namespace: one-meristem-app
  serviceAccountName: app-spc-sa
  create: false     # Prevent chart from trying to create it

#Deployment configuration for config-server service
replicaCount: 2

image:
  repository: swr.af-south-1.myhuaweicloud.com/swr-repo-one-meristem-app-stag_env/config-server
  tag: latest
  pullPolicy: Always
  
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources:
  limits:
    cpu: "0.5"
    memory: 1Gi
  requests:
    cpu: "0.3"
    memory: 512Mi

imagePullSecrets:
  - name: huawei-swr-auth #relying on CCE's automatic injection

env:
  - name: GREEN_LOGO_URL
    value: "https://obs-unstructured-logo-one-meristem-stag_env.obs.af-south-1.myhuaweicloud.com/Meristem_Green_Logo.png"
  - name: WHITE_LOGO_URL
    value: "https://obs-unstructured-logo-one-meristem-stag_env.obs.af-south-1.myhuaweicloud.com/Meristem_White_Logo.png"
  - name: FINANCE_LOGO_URL
    value: "https://obs-unstructured-logo-one-meristem-stag_env.obs.af-south-1.myhuaweicloud.com/Meristem_Finance_Logo.png"
  - name: DATA_PRIVACY_POLICY_URL
    value: "https://www.onemerristem.merristem.com"
  - name: COMPANY_NAME
    value: "Meristem Securities Limited"
  - name: GITHUB_BRANCH
    value: "dev_env"
  - name: SERVER_PORT
    value: "20000"
  - name: ADMIN_USERNAME
    value: "admin"
  # - name: ADMIN_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: credentials
  #       key: key3
  - name: GITHUB_URL
    value: "https://github.com/mit-meristem/one_meristem_app.git"
  # - name: GITHUB_USERNAME
  #   valueFrom:
  #     secretKeyRef:
  #       name: credentials
  #       key: key1
  # - name: GITHUB_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: credentials
  #       key: key2
  - name: SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START
    value: "true"
  # - name: ENCRYPTION_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: credentials
  #       key: key4
  - name: SPRING_CLOUD_CONFIG_SERVER_GIT_TIMEOUT
    value: "30"
  - name: SPRING_CLOUD_CONFIG_SERVER_GIT_REFRESH_RATE
    value: "10"
  # - name: GITHUB_USERNAME
  #   valueFrom:
  #     secretKeyRef:
  #       name: credentials
  #       key: key1

secretEnv:
  ADMIN_PASSWORD:
    secretName: credentials
    secretKey: key3
  GITHUB_USERNAME:
    secretName: credentials
    secretKey: key1
  GITHUB_PASSWORD:
    secretName: credentials
    secretKey: key2
  ENCRYPTION_KEY:
    secretName: credentials
    secretKey: key4
  H2_PASSWORD:
    secretName: credentials
    secretKey: key13

volumeMounts:
  - name: secret-volume
    mountPath: /etc/secrets-store/config-server
    readOnly: true
  - name: config-data
    mountPath: /mnt/config


volumes:
  - name: config-data
    emptyDir: {}
  - name: secret-volume
    secret:
      secretName: credentials


# HorizontalPodAutoscaler configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

#PVC configuration
# pvc:
#   name: config-server-pvc-evs
#   accessModes:
#     - ReadWriteOnce
#   resources:
#     requests:
#       storage: 20Gi
#   storageClassName: csi-disk-topology
#   volumeMode: Filesystem:


# Service configuration
service:
  type: ClusterIP
  port: 8082
  targetPort: 20000
  name: config-server
