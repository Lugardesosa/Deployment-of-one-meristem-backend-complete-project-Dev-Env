version: '3.8'

services:
  config-server:
    build:
      context:  ./backend/config-server
      dockerfile: Dockerfile-config-server
    container_name: config-server
    ports:
      - "20000:20000"
    networks:
      - microservices-network
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped

  users-service:
    build:
      context: ./backend/users-service
      dockerfile: Dockerfile-users-service
    container_name: users-service
    ports:
      - "20020:20020"
    networks:
      - microservices-network
    depends_on:
      - config-server
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/users_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=“Lemmisson10%”
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile-notification-service
    container_name: notification-service
    ports:
      - "20030:20030"
    networks:
      - microservices-network
    depends_on:
      - config-server
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=“Lemmisson10%”
    restart: unless-stopped

  cloud-gateway:
    build:
      context: ./backend/cloud-gateway
      dockerfile: Dockerfile-cloud-gateway
    container_name: cloud-gateway
    ports:
      - "80:20010"
      - "443:20010"
    networks:
      - microservices-network
    depends_on:
      - config-server
      - users-service
      - notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: “Lemmisson10%”
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - microservices-network
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge

volumes:
  postgres-data:
