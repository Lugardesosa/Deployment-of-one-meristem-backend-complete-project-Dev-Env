#The updated Dockerfile

version: '3.8'

services:
  # ======================
  # REDIS SERVICE
  # ======================
  redis:
    image: redis:7.4.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - meristem-network
    restart: unless-stopped
    healthcheck:
      test: ["redis-cli", "ping"]

  # ======================
  # KAFKA SERVICE
  # ======================
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - meristem-network
    restart: unless-stopped
    healthcheck:
      test: ["kafka-topics", "--list", "--bootstrap-server", "localhost:9092"]

  # ======================
  # CONFIG SERVER
  # ======================
  config-server:
    build:
      context: ./backend/config-server
      dockerfile: Dockerfile-config-server
    container_name: config-server
    ports:
      - "20000:20000"
    networks:
      - meristem-network
    depends_on:
      - redis
          condition: service_healthy
      - kafka
          condition: service_healthy
      - postgres
          condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=${GITHUB_URL}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME=${GITHUB_USERNAME}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD=${GITHUB_PASSWORD}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["curl", "-f", "http://localhost:20000/actuator/health"]

  # ======================
  # POSTGRESQL DATABASE
  # ======================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MAIN_DB},${POSTGRES_NOTIFICATION_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh  #The Database init-db.sh to be run inorder to create the databases
    ports:
      - "5433:5432"
    networks:
      - meristem-network
    restart: unless-stopped
    healthcheck:
      test: ["pg_isready", "-U", "${POSTGRES_USER}"]

  # ======================
  # USERS SERVICE
  # ======================
  users-service:
    build:
      context: ./backend/users-service
      dockerfile: Dockerfile-users-service
    container_name: users-service
    ports:
      - "20020:20020"
    networks:
      - meristem-network
    depends_on:
      - config-server
          condition: service_healthy
      - postgres
          condition: service_healthy
      - redis
          condition: service_healthy
      - kafka
          condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - DB_SERVER=jdbc:postgresql://<VM_PRIVATE_IP>:5432 #input the private ip here
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONFIG_SERVER_URI=${CONFIG_SERVER_URI}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_HOST_URL=${KAFKA_HOST}
      - MAILER_HOST=${MAILER_HOST}
      - MAILER_USERNAME=${MAILER_USERNAME}
      - MAILER_PASSWORD=${MAILER_PASSWORD}
     # - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped

  # ======================
  # NOTIFICATION SERVICE
  # ======================
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile-notification-service
    container_name: notification-service
    ports:
      - "20030:20030"
    networks:
      - meristem-network
    depends_on:
      - config-server
          condition: service_healthy
      - postgres
          condition: service_healthy
      - kafka
          condition: service_healthy
      - redis
          condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - DB_SERVER=jdbc:postgresql://<VM_PRIVATE_IP>:5432 #input the private ip here
      - DB_NAME=${POSTGRES_NOTIFICATION_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONFIG_SERVER_URI=${CONFIG_SERVER_URI}
      - KAFKA_HOST_URL=${KAFKA_HOST}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped

  # ======================
  # API GATEWAY
  # ======================
  cloud-gateway:
    build:
      context: ./backend/cloud-gateway
      dockerfile: Dockerfile-cloud-gateway
    container_name: cloud-gateway
    ports:
      - "8080:20010"
      - "443:20010"
    networks:
      - meristem-network
    depends_on:
      - config-server
          condition: service_healthy
      - users-service
          condition: service_healthy
      - notification-service
          condition: service_healthy
      - redis
          condition: service_healthy
      - postgres
          condition: service_healthy
      - kafka
          condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SERVER_PORT=20010
      - CONFIG_SERVER_URI=${CONFIG_SERVER_URI}
      - USER_SERVICE_URI=${USER_SERVICE_URI}
      - NOTIFICATION_SERVICE_URI=${NOTIFICATION_SERVICE_URI}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SERVER_ADDRESS=22.345.23.45   # Add this line with your public IP, Use your public endpoint here for the http
     # - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["curl", "-f", "http://localhost:8080/actuator/health"]

# ======================
# INFRASTRUCTURE
# ======================
networks:
  meristem-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
