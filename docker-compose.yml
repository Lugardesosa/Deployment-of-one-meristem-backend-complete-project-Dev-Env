services:
  # ======================
  # REDIS SERVICE (Internal only)
  # ======================
  redis:
    image: redis:7.4.2-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=AHjsoie67&8*
    volumes:
      - redis_data:/data
    networks:
      - meristem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  # ======================
  # KAFKA SERVICE (Internal only)
  # ======================
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secret:/etc/kafka/secrets
    networks:
      - meristem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9092"]
      interval: 10s
      timeout: 30s
      retries: 2  # Kafka can take 2-3 minutes to start

  # ======================
  # CONFIG SERVER (Internal only)
  # ======================
  config-server:
    image: config-server
    container_name: config-server
    networks:
      - meristem-network
    depends_on:
      - redis
      - kafka
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=${GITHUB_URL}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME=${GITHUB_USERNAME}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD=${GITHUB_PASSWORD}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_TIMEOUT=30  # Default is 5s (often too short)
      - SPRING_CLOUD_CONFIG_SERVER_GIT_REFRESH_RATE=10  # Check for updates every 10s
    restart: unless-stopped

  # ======================
  # POSTGRESQL DATABASE (Internal only)
  # ======================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=${DB_NAME_USER_SERVICES},${DB_NAME_NOTIFICATION_SERVICES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh  # The Database init-db.sh to be run in order to create the databases
    networks:
      - meristem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"]

  # ======================
  # USERS SERVICE (Internal only)
  # ======================
  users-service:
    image: users-service
    container_name: users-service
    networks:
      - meristem-network
    depends_on:
      - config-server
      - postgres
      - redis
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - DB_SERVER=jdbc:postgresql://postgres:5432/users-service # input the private ip here
      - DB_NAME=users-service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CONFIG_SERVER_URI=${CONFIG_SERVER_URI}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_HOST_URL=${KAFKA_HOST}
      - MAILER_HOST=${MAILER_HOST}
      - MAILER_USERNAME=${MAILER_USERNAME}
      - MAILER_PASSWORD=${MAILER_PASSWORD}
     # - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped

  # ======================
  # NOTIFICATION SERVICE (Internal only)
  # ======================
  notification-service:
    image: notification-service
    container_name: notification-service
    networks:
      - meristem-network
    depends_on:
      - config-server
      - postgres
      - kafka
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - DB_SERVER=jdbc:postgresql://postgres:5432/${DB_NAME_NOTIFICATION_SERVICES} # input the private ip here
      - DB_NAME=${DB_NAME_NOTIFICATION_SERVICES}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CONFIG_SERVER_URI=${CONFIG_SERVER_URI}
      - KAFKA_HOST_URL=${KAFKA_HOST}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MAILER_HOST=${MAILER_HOST}
      - MAILER_USERNAME=${MAILER_USERNAME}
      - MAILER_PASSWORD=${MAILER_PASSWORD}
    restart: unless-stopped

  # ======================
  # API GATEWAY (Exposed publicly)
  # ======================
  cloud-gateway:
    image: cloud-gateway
    container_name: cloud-gateway
    ports:
      - "8080:20011"  # Exposed for HTTP
    networks:
      - meristem-network
    depends_on:
      - config-server
      - users-service
      - notification-service
      - redis
      - postgres
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SERVER_PORT=20011 #Reinforce the port setting
        #- MANAGEMENT_SERVER=-1 #Disable the actuator port
      - CONFIG_SERVER_URI=${CONFIG_SERVER_URI}
      - USER_SERVICE_URI=${USER_SERVICE_URI}
      - NOTIFICATION_SERVICE_URI=${NOTIFICATION_SERVICE_URI}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
        #- SERVER_ADDRESS=${VM_PUBLIC_IP}   # Add this line with your public IP, Use your public endpoint here for the HTTP
     # - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    #healthcheck:
      #test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]

# ======================
# INFRASTRUCTURE
# ======================
networks:
  meristem-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  kafka_secret:

