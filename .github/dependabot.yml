# Dependabot configurations for security recommendations
# on the branches and directories listed below
# prod_env
# stag_env
# test_env.
#
# N.B: This file must exist in the DEFAULT branch (prod_env)

version: 2
updates:

  # ─────────────────────────────
  # TEST ENVIRONMENT SCANS
  # ─────────────────────────────
  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "test_env"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    reviewers:
      - "lugardesosa100"
      - "realninety5"
    labels:
      - "dependabot"
      - "security"
      - "test-env"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "test_env"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "11:30"
    reviewers:
      - "lugardesosa100"
    labels:
      - "ci"
      - "automation"
      - "test-env"


  # ─────────────────────────────
  # STAGING BRANCH SCANS
  # ─────────────────────────────
  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "stag_env"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    commit-message:
      prefix: "Maven Upgrade"
      include: "scope"
    reviewers:
      - "lugardesosa100"
      - "realninety5"
    labels:
      - "dependabot"
      - "security"
      - "automated"

  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "stag_env"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "12:00"
    reviewers:
      - "lugardesosa100"
      - "realninety5"
    labels:
      - "dependabot"
      - "security"
      - "automated"

  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "stag_env"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
    reviewers:
      - "lugardesosa100"
      - "realninety5"
    labels:
      - "dependabot"
      - "security"
      - "automated"


  # ─────────────────────────────
  # PRODUCTION BRANCH SCANS
  # ─────────────────────────────
  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "prod_env"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    reviewers:
      - "lugardesosa100"
      - "realninety5"
    labels:
      - "dependabot"
      - "security"
      - "production"

  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "prod_env"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "12:00"
    reviewers:
      - "lugardesosa100"
      - "realninety5"
    labels:
      - "dependabot"
      - "security"
      - "production"

  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "prod_env"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
    reviewers:
      - "lugardesosa100"
      - "realninety5"
    labels:
      - "dependabot"
      - "security"
      - "production"


  # ─────────────────────────────
  # GITHUB ACTIONS UPDATES
  # ─────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "stag_env"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "14:00"
    reviewers:
      - "lugardesosa100"
    labels:
      - "ci"
      - "automation"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "stag_env"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "14:00"
    reviewers:
      - "lugardesosa100"
    labels:
      - "ci"
      - "automation"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "prod_env"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "14:00"
    reviewers:
      - "lugardesosa100"
    labels:
      - "ci"
      - "automation"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "prod_env"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "14:00"
    reviewers:
      - "lugardesosa100"
    labels:
      - "ci"
      - "automation"
