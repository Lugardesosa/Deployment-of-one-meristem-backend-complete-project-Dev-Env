# =====================================================
# GitHub Actions Workflow: Deploy One_Meristem_App to Huawei Cloud ECS
# Stages: Build changed microservices → Deploy with rollback support
# =====================================================

name: Deployment of One_Meristem_App

on:
  pull_request:
    branches:
      - dev_env
  push:
    branches:
      - dev_env

# Global environment variables
env:
  REPO_NAME: Meristem-Innovation-Team/one_meristem_app
  SERVICES_DIR: backend

# =====================================================
# Build Stage: Detect and Build Changed Microservices
# =====================================================
jobs:
  build:
    name: Build Changed Microservices
    runs-on: self-hosted

    outputs:
      changed_services: ${{ steps.check_change.outputs.changed_services }}

    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4.1.0

      # Detect changed services in backend/
      - name: Detect Changed Microservices
        id: check_change
        run: |
          git pull origin dev_env
          CHANGED=$(git diff --name-only origin/dev_env | grep -E "${{ env.SERVICES_DIR }}/(cloud-gateway|users-service|config-server|notification-service|wallet-service)/" | cut -d'/' -f2 | sort -u | xargs)
          echo "Changed services: $CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "changed_services=none" >> "$GITHUB_OUTPUT"
          else
            echo "changed_services=$CHANGED" >> "$GITHUB_OUTPUT"
          fi


# =====================================================
# Test Stage: Java Static Code Analysis using Checkstyle (JDK 21)
# =====================================================
  test:
    name: Java Static Code Analysis
    runs-on: self-hosted
    needs: build
    if: needs.build.outputs.changed_services != 'none'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Checkstyle on Changed Microservices
        run: |
          echo "Changed services: ${{ needs.build.outputs.changed_services }}"
          cd ${{ env.SERVICES_DIR }}

          analyze_service() {
            SERVICE=$1
            echo "Running Checkstyle for $SERVICE..."

            cd "$SERVICE" || { echo "Missing directory: $SERVICE"; exit 1; }

            if [ -f "pom.xml" ]; then
              mvn checkstyle:check -B
            else
              echo "No pom.xml found in $SERVICE, skipping..."
            fi

            cd ..
          }

          for svc in ${{ needs.build.outputs.changed_services }}; do
            analyze_service "$svc"
          done


# =====================================================
# Deploy Stage: SSH to ECS and Deploy with Rollback
# =====================================================
  deploy:
    name: Deploy to Huawei Cloud ECS
    runs-on: self-hosted
    needs: build
    if: needs.build.outputs.changed_services != 'none'

    steps:
      - name: Debug SSH vars (partial)
        env:
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          echo "ECS_USER: ${ECS_USER:0:3}***"
          echo "ECS_HOST: ${ECS_HOST:0:5}***"

      # Start SSH agent with ECS private key
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}

      # SSH into ECS and deploy with rollback logic
      - name: SSH and Deploy with Rollback Support
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} <<EOF
          set -e

          # -----------------------------
          # Clone the latest application code
          # -----------------------------
          #Update packages
          sudo apt update
          
          echo "Cloning latest repo..."
          rm -rf one_meristem_app || true
          git clone https://${{ secrets.GH_PAT }}@github.com/${{ env.REPO_NAME }}.git
          cd one_meristem_app
          
          echo "Switching to 'dev_env' branch..."
          git checkout dev_env || git checkout -b dev_env origin/dev_env
          
          # Pull latest changes just in case
          git pull origin dev_env
          
          echo "Switched to 'dev_env' branch with latest code."
          ls -l

          
          # -----------------------------
          # Enter the backend folder
          # -----------------------------
          echo "Changing into backend directory..."
          cd backend || { echo "Backend folder not found. Check repo structure."; exit 1; }

          # -----------------------------
          # Backup current Docker state
          # -----------------------------
          echo "Backing up Docker state..."
          TIMESTAMP=\$(date +%s)
          rm -f /one_meristem_app/docker-compose.backup.*.yml || true
          sudo cp ../docker-compose.yml ../docker-compose.backup.\$TIMESTAMP.yml || true
          sudo docker-compose -f ../docker-compose.yml config > ../docker-compose.backup.yml || true

          # -----------------------------
          # Build each changed microservice
          # -----------------------------
          echo "Building changed microservices..."

          build_service() {
            cd "\$1" || { echo "Missing directory: \$1"; exit 1; }
            echo "Building \$1..."
            sudo pack build "\$1" --builder paketobuildpacks/builder-jammy-base --path .
            cd ..
          }

          for svc in ${{ needs.build.outputs.changed_services }}; do
            case \$svc in
              cloud-gateway|users-service|config-server|notification-service|wallet-service)
                if [ -d "\$svc" ]; then
                  build_service "\$svc"
                else
                  echo "Directory \$svc not found!"
                fi
                ;;
              *)
                echo "Skipping untracked service: \$svc"
                ;;
            esac
          done

          # -----------------------------
          # Attempt to redeploy services
          # -----------------------------
          echo "Restarting Docker Compose services..."
          set +e
          sudo docker-compose down
          sudo docker volume prune -f
          sudo docker-compose up -d --build
          DEPLOY_STATUS=\$?
          set -e

          # -----------------------------
          # If failed, roll back to previous config
          # -----------------------------
          if [ \$DEPLOY_STATUS -ne 0 ]; then
            echo "Deployment failed. Rolling back..."
            sudo docker-compose down || true
            sudo docker-compose -f /one_meristem_app/docker-compose.last-known-good.yml up -d || {
              echo "Rollback failed. Manual intervention required."
              exit 1
            }
            echo "Rollback successful."
            exit 1
          else
            echo "Deployment completed successfully!"
          fi
          EOF
