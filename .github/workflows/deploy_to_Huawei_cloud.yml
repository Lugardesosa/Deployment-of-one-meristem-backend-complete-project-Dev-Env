# =====================================================
# GitHub Actions Workflow: Deploy One_Meristem_App to Huawei Cloud ECS
# Stages: Build changed microservices → Deploy with rollback support
# =====================================================

name: Deployment of One_Meristem_App to Huawei Cloud

on:
  push:
    branches:
      - dev_env
    paths:
      - 'backend/**'               # app src  
      - 'github/workflows/deploy_to_Huawei_cloud.yml' # CI/CD pipeline file.
      - 'docker-compose.yml' 

# Global environment variables
env:
  REPO_NAME: mit-meristem/one_meristem_app 
  SERVICES_DIR: backend
  GH_PAT: ${{ secrets.GH_PAT }}

# =====================================================
# Build Stage: Detect and Build Changed Microservices
# =====================================================
jobs:
  detect_changes:
    name: Detect Changed Microservices
    runs-on: self-hosted

    outputs:
      changed_services: ${{ steps.check_change.outputs.changed_services }}
      compose_changed: ${{ steps.check_change.outputs.compose_changed }}

    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 2
      #Add git log for debugging
      - name: Show Commit History
        run: git log --oneline -n 5
      # - name: Clean up old docker images older than 24h
      #   run: |
      #     docker image prune -a --filter "until=24h" -f
      # Detect changed services in backend/
      - name: Detect Changed Microservices
        id: check_change
        run: |

          # Get all changed files
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if docker-compose.yml changed
          if echo "$CHANGED_FILES" | grep -q "^docker-compose.yml$"; then
            echo "docker-compose.yml has changed!"
            echo "compose_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "compose_changed=false" >> "$GITHUB_OUTPUT"
          fi
                        
          # Check for changed services in backend/
          CHANGED=$(echo "$CHANGED_FILES" \
            | grep -E "${{ env.SERVICES_DIR }}/(cloud-gateway|users-service|config-server|notification-service|wallet-service|trustees-service|wealth-services|report-service|observability|meriapp-config|platform)/" \
            | cut -d'/' -f2 | sort -u | xargs || true)
          echo "Changed services: $CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "changed_services=none" >> "$GITHUB_OUTPUT"
          else
            echo "changed_services=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

# =====================================================
# Deploy Stage: SSH to ECS and Deploy with Rollback.
# =====================================================
  deploy:
    name: Deploy to Huawei Cloud ECS
    runs-on: self-hosted
    needs: detect_changes
    steps:
      - name: Debug SSH vars (partial)
        env:
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          echo "ECS_USER: ${ECS_USER:0:3}***"
          echo "ECS_HOST: ${ECS_HOST:0:5}***"
      - name: Log Changed Services
        run: |
          echo "Changed services: ${{ needs.detect_changes.outputs.changed_services }}"
          echo "Compose changed: ${{ needs.detect_changes.outputs.compose_changed }}"
          
      # Start SSH agent with ECS private key
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}

      # SSH into ECS and deploy with rollback logic
      - name: SSH and Deploy with Rollback Support
        env:
          REPO_NAME: ${{ env.REPO_NAME }}  
          GH_PAT: ${{ secrets.GH_PAT }}
          CHANGED_SERVICES: ${{ needs.detect_changes.outputs.changed_services }}
          COMPOSE_CHANGED: ${{ needs.detect_changes.outputs.compose_changed }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} bash -s <<ENDSSH
          set -e

          # ============================================================
          # SECTION 1: Get Variables and Clone/Update Repository
          # ============================================================
          
          REPO_NAME="${REPO_NAME:-mit-meristem/one_meristem_app}"
          CHANGED_SERVICES="${CHANGED_SERVICES}"
          COMPOSE_CHANGED="${COMPOSE_CHANGED}"
          GH_PAT="${GH_PAT}"

          export GH_PAT="${GH_PAT}"
          export REPO_NAME="${REPO_NAME:-mit-meristem/one_meristem_app}"
          
          echo "================================================"
          echo "Repository: $REPO_NAME"
          echo "Changed Services: $CHANGED_SERVICES"
          echo "Docker-compose Changed: $COMPOSE_CHANGED"
          echo "================================================"
          
          # -----------------------------
          # Clone the latest application code & Update Packages
          # -----------------------------

          # Update packages
          sudo apt update || echo "apt update failed, continuing..."
          
          echo "Checking if Repo Exists Locally on Server..."
          if [ ! -d "one_meristem_app/.git" ]; then
            echo "Repo not found locally, cloning for the first time..."
            git clone https://$GH_PAT@github.com/$REPO_NAME.git one_meristem_app 
          fi

          echo "Changing Directory into the one_meristem_app..."
          cd one_meristem_app
          echo "Current directory: \$(pwd)"
          echo ""

          # Show current state
          echo "Current branch:"
          git branch --show-current
          echo ""
          echo "Current commit:"
          git log --oneline -n 1
          echo "================================================"

          # Update the remote URL to new organization
          echo "Updating remote URL to: ${REPO_NAME}"
          git remote set-url origin https://$GH_PAT@github.com/$REPO_NAME.git

          # Verify remote URL changed
          echo "Remote URL:"
          git remote -v
          echo "================================================"

          # ============================================================
          # Fetch and safely merge latest changes from dev_env (Add files on the server to gitignore)
          # ============================================================
          echo "============================================================"
          echo "Syncing with Remote Repository"
          echo "============================================================"

          echo "Fetching latest changes..."
          git fetch origin dev_env

          echo "Checking out dev_env branch..."
          git checkout dev_env 2>/dev/null || git checkout -b dev_env origin/dev_env

          echo "Hard resetting to origin/dev_env..."
          git reset --hard origin/dev_env

          echo "============================================================"
          echo "Repository synced successfully!"
          echo "Latest commit: \$(git log --oneline -n 1)"
          echo "============================================================"

          
          # ============================================================
          # SECTION 2: Grant Database Permissions
          # ============================================================
          echo "Granting Database host file permissions to persist data on host..."
          mkdir -p ./data/postgres ./data/redis ./data/kafka
          chown -R 70:70 ./data/postgres/ || true
          chown -R 777 ./data/redis/ || true
          chown -R 1000:1000 ./data/kafka/ || true

          # ============================================================
          # SECTION 3: Enter Backend Directory
          # ============================================================
          echo "Changing into backend directory..."
          cd backend || { echo "Backend folder not found. Check repo structure."; exit 1; }

          # ============================================================
          # SECTION 4: Backup Current Docker State
          # ============================================================
          echo "Backing up Docker state..."
          TIMESTAMP="\$(date +%s)"
          
          
          # Clean any old backups on project root
          rm -f ../docker-compose.backup.*.yml || true
          
           # Save validated config as last-known-good in project root
          sudo docker-compose -f ../docker-compose.yml config > ../docker-compose.backup.yml || {
            echo "Failed to create rollback config. Aborting deployment."
            exit 1
          }


          # ============================================================
          # SECTION 5: Build Changed Microservices
          # ============================================================

          BUILT_SERVICES=""

          if [ "\$CHANGED_SERVICES" != "none" ]; then
            echo "Building changed microservices..."

            if ! command -v pack &> /dev/null; then
              echo "pack CLI not found. Installing..."
              curl -sSL "https://github.com/buildpacks/pack/releases/latest/download/pack-v0.31.0-linux.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack
            fi

            # Function to build a service
            build_service() {
              cd "\$1" || { echo "Missing directory: \$1"; exit 1; }
              echo "Building \$1..."
              sudo pack build "\$1" --builder paketobuildpacks/builder-jammy-base --path .
              cd ..
            }

            BUILT_SERVICES=""

            for svc in \$CHANGED_SERVICES; do
              case \$svc in
                cloud-gateway|users-service|config-server|notification-service|wallet-service|report-service|wealth-services|trustees-service)
                  if [ -d "\$svc" ]; then
                    build_service "\$svc"
                    BUILT_SERVICES="\$BUILT_SERVICES \$svc"
                  else
                    echo "Directory \$svc not found!"
                  fi
                  ;;
                *)
                  echo "Skipping untracked service: \$svc"
                  ;;
              esac
            done
            BUILT_SERVICES="\$(echo "\$BUILT_SERVICES" | xargs)"
            echo "Built services: \$BUILT_SERVICES"
          else
            echo "No service code changes detected. Skipping build step."
          fi

         
         
          # ============================================================
          # SECTION 6: Return to Project Root
          # ============================================================
          echo "Returning to project root..."
          cd ..

          
          # ============================================================
          # SECTION 7: Deploy Services with Rollback
          # ============================================================
          
          set +e

          ALL_SERVICES="config-server users-service notification-service report-service wallet-service trustees-service wealth-services cloud-gateway redis"

          #When Docker Compose File Changes
          if [ "\$COMPOSE_CHANGED" = "true" ]; then
            echo "docker-compose.yml changed → restarting ALL services"

            sudo docker-compose stop \$ALL_SERVICES
            sudo docker-compose rm -f \$ALL_SERVICES
            sudo docker-compose up -d \$ALL_SERVICES

          DEPLOY_STATUS=$?

          #When Microservices Change
          elif [ -n "\$BUILT_SERVICES" ]; then
            echo "Code changed → deploying ONLY built services: \$BUILT_SERVICES"

            sudo docker-compose stop \$BUILT_SERVICES
            sudo docker-compose rm -f \$BUILT_SERVICES
            sudo docker-compose up -d \$BUILT_SERVICES

          DEPLOY_STATUS=$?

          #When No Changes 
          else
            echo "No changes detected. Skipping deployment."
            DEPLOY_STATUS=0
          fi

          # # If docker-compose.yml changed OR services changed, restart containers
          # if [ "$COMPOSE_CHANGED" = "true" ] || [ "$CHANGED_SERVICES" != "none" ]; then
            
          #   if [ "$COMPOSE_CHANGED" = "true" ] && [ "$CHANGED_SERVICES" = "none" ]; then
          #     # Only docker-compose.yml changed - restart all containers without rebuild
          #     echo "================================================"
          #     echo "Docker-compose.yml changed. Restarting all app services..."
          #     echo "================================================"
              
          #     sudo docker-compose -f docker-compose.yml stop \
          #       config-server users-service notification-service report-service wallet-service trustees-service wealth-service cloud-gateway redis 

          #     sudo docker-compose -f docker-compose.yml rm -f \
          #       config-server users-service notification-service report-service wallet-service trustees-service cloud-gateway wealth-service redis 

          #     sudo docker-compose -f docker-compose.yml up -d \
          #       config-server users-service notification-service report-service wallet-service trustees-service cloud-gateway wealth-service redis 
          #   else
          #     # Service code changed - rebuild and restart
          #     echo "================================================"
          #     echo "Service code changed. Rebuilding and restarting app services..."
          #     echo "================================================"
              
          #     sudo docker-compose -f docker-compose.yml stop \
          #       config-server users-service notification-service report-service wallet-service trustees-service cloud-gateway wealth-service redis 

          #     sudo docker-compose -f docker-compose.yml rm -f \
          #       config-server users-service notification-service report-service wallet-service trustees-service cloud-gateway wealth-service redis 

          #     sudo docker-compose -f docker-compose.yml up -d --build \
          #       config-server users-service notification-service report-service wallet-service trustees-service cloud-gateway wealth-service redis 
          #   fi
            
          #   DEPLOY_STATUS=$?
          # else
          #   echo "================================================"
          #   echo "No changes to deploy. Skipping restart."
          #   echo "================================================"
          #   DEPLOY_STATUS=0
          # fi
          
          set -e
 
          # ============================================================
          # SECTION 8: Check Deployment Status and Rollback if Needed
          # ============================================================

          if [[ "$DEPLOY_STATUS" -ne 0 ]]; then
            echo "Deployment failed. Rolling back..."
            set +e
            sudo docker-compose -f docker-compose.yml stop \
              config-server users-service notification-service report-service wallet-service trustees-service cloud-gateway wealth-services
            sudo docker-compose -f ../docker-compose.backup.yml up -d \
              config-server users-service notification-service report-service wallet-service trustees-service cloud-gateway wealth-services || {
                echo "Rollback failed. Manual intervention required."
                exit 1
            }
            echo "Rollback successful."
            exit 1
          else
            echo "Verifying health of core services..."
            sudo docker ps --filter "health=unhealthy" --format '{{.Names}}' | grep . && {
              echo " Some containers are unhealthy. Investigate logs."
              sudo docker ps --filter "health=unhealthy"
            } || echo " All containers healthy."

            echo "================================================"
            echo " Deployment completed successfully!"
            echo "================================================"

            # Show running containers
            echo "Running containers:"
            sudo docker-compose -f docker-compose.yml ps
          fi
          ENDSSH
