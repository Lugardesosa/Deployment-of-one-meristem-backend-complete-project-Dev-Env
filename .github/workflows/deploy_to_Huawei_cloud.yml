# =====================================================
# GitHub Actions Workflow: Deploy One_Meristem_App to Huawei Cloud ECS
# Stages: Build changed microservices → Deploy with rollback support
# =====================================================

name: Deployment of One_Meristem_App to Huawei Cloud

on:
  push:
    branches:
      - dev_env
    paths:
      - 'backend/**'               # app src              
      - 'docker-compose.yml' 
      - 'github/workflows/deploy_to_Huawei_cloud.yml' # CI/CD pipeline file

# Global environment variables
env:
  REPO_NAME: Meristem-Innovation-Team/one_meristem_app
  SERVICES_DIR: backend

# =====================================================
# Build Stage: Detect and Build Changed Microservices
# =====================================================
jobs:
  build:
    name: Build Changed Microservices
    runs-on: self-hosted

    outputs:
      changed_services: ${{ steps.check_change.outputs.changed_services }}

    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 2
      #Add git log for debugging
      - name: Show Commit History
        run: git log --oneline -n 5
      - name: Clean up old docker images older than 24h
        run: |
          docker image prune -a --filter "until=24h" -f
      # Detect changed services in backend/
      - name: Detect Changed Microservices
        id: check_change
        run: |
          git pull origin dev_env
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E "${{ env.SERVICES_DIR }}/(cloud-gateway|users-service|config-server|notification-service|wallet-service|trusties-service|report-service|observability|meriapp-config|platform)/" | cut -d'/' -f2 | sort -u | xargs)
          echo "Changed services: $CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "changed_services=none" >> "$GITHUB_OUTPUT"
          else
            echo "changed_services=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

# =====================================================
# Deploy Stage: SSH to ECS and Deploy with Rollback
# =====================================================
  deploy:
    name: Deploy to Huawei Cloud ECS
    runs-on: self-hosted
    needs: build
    steps:
      - name: Debug SSH vars (partial)
        env:
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          echo "ECS_USER: ${ECS_USER:0:3}***"
          echo "ECS_HOST: ${ECS_HOST:0:5}***"
      - name: Log Changed Services
        run: |
          echo "Services to build: ${{ needs.build.outputs.changed_services }}"

      - name: Log Changed Services
        run: |
          echo "Services to build: ${{ needs.build.outputs.changed_services }}"
      # Start SSH agent with ECS private key
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}

      # SSH into ECS and deploy with rollback logic
      - name: SSH and Deploy with Rollback Support
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} <<EOF
          set -e

          # -----------------------------
          # Clone the latest application code
          # -----------------------------

          # Update packages
          sudo apt update
          
          echo "Using existing repo folder..."
          if [ ! -d "one_meristem_app/.git" ]; then
            echo "Repo not found locally, cloning once..."
            git clone https://${{ secrets.GH_PAT }}@github.com/${{ env.REPO_NAME }}.git one_meristem_app
          fi
          
          cd one_meristem_app
          
          echo "Fetching latest 'dev_env' branch..."
          git fetch origin dev_env
          
          echo "Switching to 'dev_env' branch..."
          git checkout dev_env || git checkout -b dev_env origin/dev_env
          
          echo "Resetting local branch to match remote..."
          git reset --hard origin/dev_env
          
          echo "Now on latest 'dev_env' branch."
          ls -l

          
          # -----------------------------
          # Enter the backend folder
          # -----------------------------
          echo "Granting Database host file permissions to persisit data on host..."
          chown -R 70:70 ./data/postgres/
          chown -R 70:70 ./data/redis/
          chown -R 70:70 ./data/kafka/
          
          echo "Changing into backend directory..."
          cd backend || { echo "Backend folder not found. Check repo structure."; exit 1; }

          # -----------------------------
          # Backup current Docker state
          # -----------------------------
          echo "Backing up Docker state..."
          TIMESTAMP=$(date +%s)
          
          # Clean any old backups in project root
          rm -f ../docker-compose.backup.*.yml || true
          
          # Save validated config as last-known-good in project root
          sudo docker-compose -f ../docker-compose.yml config > ../docker-compose.backup.yml || {
            echo "Failed to create rollback config. Aborting deployment."
            exit 1
          }


          # -----------------------------
          # Build each changed microservice
          # -----------------------------
          echo "Building changed microservices..."

          build_service() {
            cd "\$1" || { echo "Missing directory: \$1"; exit 1; }
            echo "Building \$1..."
            sudo pack build "\$1" --builder paketobuildpacks/builder-jammy-base --path .
            cd ..
          }

          for svc in ${{ needs.build.outputs.changed_services }}; do
            case \$svc in
              cloud-gateway|users-service|config-server|notification-service|wallet-service|report-service|trusties-service)
                if [ -d "\$svc" ]; then
                  build_service "\$svc"
                else
                  echo "Directory \$svc not found!"
                fi
                ;;
              *)
                echo "Skipping untracked service: \$svc"
                ;;
            esac
          done

          
          # -----------------------------
          # Go back to project root
          # -----------------------------
          echo "Returning to project root..."
          cd ..

          
          # -----------------------------
          # Attempt to redeploy services
          # -----------------------------
          echo "Restarting application services only..."

          set +e
          # Bring down only app-layer services
          sudo docker-compose -f docker-compose.yml stop \
            config-server users-service notification-service report-service wallet-service trusties-service cloud-gateway redis

          # Remove only containers for app-layer services (keeps infra running)
          sudo docker-compose -f docker-compose.yml rm -f \
            config-server users-service notification-service report-service wallet-service trusties-service cloud-gateway redis

          # Rebuild and start only app-layer services
          sudo docker-compose -f docker-compose.yml up -d --build \
            config-server users-service notification-service report-service wallet-service trusties-service cloud-gateway redis
          
          DEPLOY_STATUS=$?
          set -e

          if [ $DEPLOY_STATUS -ne 0 ]; then
            echo "Deployment failed. Rolling back..."
            set +e
            sudo docker-compose -f docker-compose.yml stop \
              config-server users-service notification-service report-service wallet-service trusties-service cloud-gateway redis
            sudo docker-compose -f docker-compose.backup.yml up -d \
              config-server users-service notification-service report-service wallet-service trusties-service cloud-gateway redis || {
                echo "Rollback failed. Manual intervention required."
                exit 1
            }
            echo "Rollback successful."
            exit 1
          else
            echo "Deployment completed successfully!"
          fi
          EOF

