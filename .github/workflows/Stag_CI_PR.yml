# =====================================================
# One-Meristem Mobile Backend CI for Staging Env
# Spring Boot | Java 21 + Java 25 | self-hosted runner
# =====================================================
# Trigger: PR to stag_env
# Paths: backend/**, charts/**, scripts/**, argocd/**
#
# Job flow:
#   detect_changes → test + helm_lint (parallel)
#                 → build_and_push
# =====================================================

name: One-Meristem Mobile Backend CI for Staging Env

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - stag_env
    paths:
      - "backend/**"
      - "charts/**"
      - "scripts/**"
      - "argocd/**"
      #- ".github/workflows/backend-ci-stag.yaml"

# =============================================================================
# GLOBAL ENV
# =============================================================================
env:
  # =====================================================
  # SERVICE DEFINITIONS
  # =====================================================
  SERVICES_DIR: backend
  JAVA_21_SERVICES: "config-server cloud-gateway users-service trustees-service report-service"
  JAVA_25_SERVICES: "wealth-service notification-service wallet-service "
  ALL_SERVICES: "config-server cloud-gateway users-service notification-service wallet-service trustees-service report-service wealth-service"

  # =====================================================
  # GITHUB VARIABLES
  # =====================================================
  GIT_REPO_URL: ${{ vars.GIT_REPO_URL }}
  GIT_BRANCH: ${{ vars.GIT_BRANCH }}
  APP_NAMESPACE: ${{ vars.APP_NAMESPACE }}
  ARGOCD_NAMESPACE: ${{ vars.ARGOCD_NAMESPACE }}
  ARGOCD_PROJECT: ${{ vars.ARGOCD_PROJECT }}
  ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
  HELM_REPO_PATH: ${{ vars.HELM_REPO_PATH }}
  HELM_MOBILE_REPO_PATH: ${{ vars.HELM_MOBILE_REPO_PATH }}
  VALUES_FILE: ${{ vars.VALUES_FILE }}
  CLUSTER_SERVER_URL: ${{ vars.CLUSTER_SERVER_URL }}

  # ArgoCD App Names
  CONFIG_SERVER_APP_NAME: ${{ vars.CONFIG_SERVER_APP_NAME }}
  NOTIFICATION_SERVICE_APP_NAME: ${{ vars.NOTIFICATION_SERVICE_APP_NAME }}
  WALLET_SERVICE_APP_NAME: ${{ vars.WALLET_SERVICE_APP_NAME }}
  REPORT_SERVICE_APP_NAME: ${{ vars.REPORT_SERVICE_APP_NAME }}
  USERS_SERVICE_APP_NAME: ${{ vars.USERS_SERVICE_APP_NAME }}
  TRUSTEES_SERVICE_APP_NAME: ${{ vars.TRUSTEES_SERVICE_APP_NAME }}
  WEALTH_SERVICE_APP_NAME: ${{ vars.WEALTH_SERVICE_APP_NAME }}
  CLOUD_GATEWAY_APP_NAME: ${{ vars.CLOUD_GATEWAY_APP_NAME }}
  WEB_APP_APP_NAME: ${{ vars.WEB_APP_APP_NAME }}
  ADMIN_APP_APP_NAME: ${{ vars.ADMIN_APP_APP_NAME }}

  # Others
  APP_NAME: ${{ vars.APP_NAME }}
  INGRESS_HOST: ${{ vars.INGRESS_HOST }}
  GITHUB_REPO_URL: "https://github.com/mit-meristem/one_meristem_app.git"
  ARGO_INGRESS_HOST: ${{ vars.ARGO_INGRESS_HOST }}
  STAG_INGRESS_HOST: ${{ vars.STAG_INGRESS_HOST }}
  BRANCH_ENV: ${{ vars.BRANCH_ENV }}
  HUAWEI_ENTERPRISE_PROJECT_ID: ${{ vars.HUAWEI_ENTERPRISE_PROJECT_ID }}
  REPO_NAME: ${{ vars.REPO_NAME }}

  # =====================================================
  # GITHUB SECRETS — SWR & Cluster
  # =====================================================
  SWR_REGISTRY_URL: ${{ secrets.SWR_REGISTRY_URL }}
  HUAWEI_SWR_USERNAME: ${{ secrets.HUAWEI_SWR_USERNAME }}
  HUAWEI_SWR_PASSWORD: ${{ secrets.HUAWEI_SWR_PASSWORD }}
  SWR_ORGANIZATION_NAME: ${{ secrets.SWR_ORGANIZATION_NAME }}
  SWR_REGION: ${{ secrets.SWR_REGION }}
  ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  # =====================================================
  # GITHUB SECRETS — Shared Resources Credentials
  # =====================================================
  CREDENTIALS_ADMIN_PASSWORD: ${{ secrets.CREDENTIALS_ADMIN_PASSWORD }}
  CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
  CREDENTIALS_GITHUB_USERNAME: ${{ secrets.CREDENTIALS_GITHUB_USERNAME }}
  CREDENTIALS_GITHUB_PASSWORD: ${{ secrets.CREDENTIALS_GITHUB_PASSWORD }}
  CREDENTIALS_MAILER_USERNAME: ${{ secrets.CREDENTIALS_MAILER_USERNAME }}
  CREDENTIALS_MAILER_PASSWORD: ${{ secrets.CREDENTIALS_MAILER_PASSWORD }}
  CREDENTIALS_CREDIT_SWITCH_PUBLIC_KEY: ${{ secrets.CREDENTIALS_CREDIT_SWITCH_PUBLIC_KEY }}
  CREDENTIALS_CREDIT_SWITCH_PRIVATE_KEY: ${{ secrets.CREDENTIALS_CREDIT_SWITCH_PRIVATE_KEY }}
  CREDENTIALS_CREDIT_SWITCH_SMS_PASSWORD: ${{ secrets.CREDENTIALS_CREDIT_SWITCH_SMS_PASSWORD }}
  CREDENTIALS_HUAWEI_CLOUD_ACCESS_KEY_ID: ${{ secrets.CREDENTIALS_HUAWEI_CLOUD_ACCESS_KEY_ID }}
  CREDENTIALS_HUAWEI_CLOUD_SECRET_ACCESS_KEY: ${{ secrets.CREDENTIALS_HUAWEI_CLOUD_SECRET_ACCESS_KEY }}
  CREDENTIALS_H2_PASSWORD: ${{ secrets.CREDENTIALS_H2_PASSWORD }}
  CREDENTIALS_PROVIDUS_API_PUBLIC_KEY: ${{ secrets.CREDENTIALS_PROVIDUS_API_PUBLIC_KEY }}
  CREDENTIALS_PROVIDUS_API_SECRET_KEY: ${{ secrets.CREDENTIALS_PROVIDUS_API_SECRET_KEY }}
  CREDENTIALS_TRUSTEES_CLIENT_SECRET: ${{ secrets.CREDENTIALS_TRUSTEES_CLIENT_SECRET }}
  CREDENTIALS_WEALTH_CLIENT_SECRET: ${{ secrets.CREDENTIALS_WEALTH_CLIENT_SECRET }}
  CREDENTIALS_ENC_SALT: ${{ secrets.CREDENTIALS_ENC_SALT }}
  CREDENTIALS_EXPO_TOKEN: ${{ secrets.CREDENTIALS_EXPO_TOKEN }}
  CREDENTIALS_OKHI_HEADER_VALUE: ${{ secrets.CREDENTIALS_OKHI_HEADER_VALUE }}
  CREDENTIALS_PAYSTACK_SECRET_KEY: ${{ secrets.CREDENTIALS_PAYSTACK_SECRET_KEY }}
  CREDENTIALS_SMILE_ID_PROD_API_KEY: ${{ secrets.CREDENTIALS_SMILE_ID_PROD_API_KEY }}
  CREDENTIALS_SMILE_ID_DEV_API_KEY: ${{ secrets.CREDENTIALS_SMILE_ID_DEV_API_KEY }}
  CREDENTIALS_MOBILE_SECRET: ${{ secrets.CREDENTIALS_MOBILE_SECRET }}
  CREDENTIALS_TRUSTEES_SECRET: ${{ secrets.CREDENTIALS_TRUSTEES_SECRET }}
  CREDENTIALS_NOTIFICATION_SECRET: ${{ secrets.CREDENTIALS_NOTIFICATION_SECRET }}
  CREDENTIALS_ID_HASHING_SECRET: ${{ secrets.CREDENTIALS_ID_HASHING_SECRET }}
  CREDENTIALS_WEB_SECRET: ${{ secrets.CREDENTIALS_WEB_SECRET }}
  CREDENTIALS_WALLET_SECRET: ${{ secrets.CREDENTIALS_WALLET_SECRET }}
  CREDENTIALS_WEALTH_SECRET: ${{ secrets.CREDENTIALS_WEALTH_SECRET }}
  CREDENTIALS_MIDDLE_WARE_API_KEY: ${{ secrets.CREDENTIALS_MIDDLE_WARE_API_KEY }}
  CREDENTIALS_DOJAH_SECRET_KEY: ${{ secrets.CREDENTIALS_DOJAH_SECRET_KEY }}
  CREDENTIALS_DOJAH_PRIVATE_KEY: ${{ secrets.CREDENTIALS_DOJAH_PRIVATE_KEY }}
  CREDENTIALS_PASTEL_API_KEY: ${{ secrets.CREDENTIALS_PASTEL_API_KEY }}
  CREDENTIALS_PASTEL_API_SECRET: ${{ secrets.CREDENTIALS_PASTEL_API_SECRET }}

  # =====================================================
  # GITHUB SECRETS — OBS, Image Pull, Ingress
  # =====================================================
  OBS_ACCESS_KEY_B64: ${{ secrets.OBS_ACCESS_KEY_B64 }}
  OBS_SECRET_KEY_B64: ${{ secrets.OBS_SECRET_KEY_B64 }}
  IMAGE_PULL_SECRET_DOCKERCONFIGJSON: ${{ secrets.IMAGE_PULL_SECRET_DOCKERCONFIGJSON }}
  SHARED_ELB_ID: ${{ secrets.SHARED_ELB_ID }}
  TLS_CERT_CLOUD_GATEWAY_B64: ${{ secrets.TLS_CERT_CLOUD_GATEWAY_B64 }}
  TLS_KEY_CLOUD_GATEWAY_B64: ${{ secrets.TLS_KEY_CLOUD_GATEWAY_B64 }}
  TLS_CERT_WEB_APP_B64: ${{ secrets.TLS_CERT_WEB_APP_B64 }}
  TLS_KEY_WEB_APP_B64: ${{ secrets.TLS_KEY_WEB_APP_B64 }}
  TLS_CERT_ADMIN_APP_B64: ${{ secrets.TLS_CERT_ADMIN_APP_B64 }}
  TLS_KEY_ADMIN_APP_B64: ${{ secrets.TLS_KEY_ADMIN_APP_B64 }}

  # Notifications
  POWER_AUTOMATE_WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}

  # Others
  ELB_IP: ${{ secrets.ELB_IP }}
  ELB_ID: ${{ secrets.ELB_ID }}
  CERTIFICATE_ID: ${{ secrets.CERTIFICATE_ID }}
  KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
  USERS_PRIVATE_KEY: ${{ secrets.USERS_PRIVATE_KEY }}
  USERS_PUBLIC_KEY: ${{ secrets.USERS_PUBLIC_KEY }}
  SERVICE_PUBLIC_KEY: ${{ secrets.SERVICE_PUBLIC_KEY }}
  HUAWEI_ACCESS_KEY: ${{ secrets.HUAWEI_ACCESS_KEY }}
  HUAWEI_SECRET_KEY: ${{ secrets.HUAWEI_SECRET_KEY }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}


jobs:

  # =====================================================
  # JOB 1: Detect Changed Services
  # =====================================================
  detect_changes:
    name: Detect Changed Backend Services
    runs-on: [self-hosted, linux-runner]
    environment: stag
    outputs:
      changed_java21: ${{ steps.check_changes.outputs.changed_java21 }}
      changed_java25: ${{ steps.check_changes.outputs.changed_java25 }}
      has_java21_changes: ${{ steps.check_changes.outputs.has_java21_changes }}
      has_java25_changes: ${{ steps.check_changes.outputs.has_java25_changes }}
      has_build_changes: ${{ steps.check_changes.outputs.has_build_changes }}
      helm_changed_services: ${{ steps.check_changes.outputs.helm_changed_services }}
      has_helm_only_changes: ${{ steps.check_changes.outputs.has_helm_only_changes }}
      shared_resources_changed: ${{ steps.check_changes.outputs.shared_resources_changed }}
      argocd_changed: ${{ steps.check_changes.outputs.argocd_changed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Commit Info
        run: |
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Triggered by: ${{ github.actor }}"
          echo "PR: ${{ github.event.pull_request.title }}"
          echo ""
          git log -1 --pretty=format:"%h by %an on %ad: %s" --date=short
          echo ""
          echo "Files Changed:"
          git show --name-only --oneline -1

      - name: Detect Changed Services
        id: check_changes
        run: |
          set -e

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "${BASE_REF}":"refs/remotes/origin/${BASE_REF}" || true

          echo "Comparing origin/${BASE_REF} → HEAD"
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")

          echo "=== ALL CHANGED FILES ==="
          echo "$CHANGED_FILES"
          echo "========================="

          JAVA_21_SERVICES="${{ env.JAVA_21_SERVICES }}"
          JAVA_25_SERVICES="${{ env.JAVA_25_SERVICES }}"
          ALL_SERVICES="${{ env.ALL_SERVICES }}"

          # -------------------------------------------------------
          # 1. Detect backend source changes (triggers docker build)
          # -------------------------------------------------------
          BUILD_CHANGED_SERVICES=$(echo "$CHANGED_FILES" \
            | grep -E "^${{ env.SERVICES_DIR }}/" \
            | cut -d'/' -f2 \
            | sort -u \
            | xargs || true)

          echo "Services with source changes (build): $BUILD_CHANGED_SERVICES"

          CHANGED_JAVA21=""
          CHANGED_JAVA25=""

          for svc in $BUILD_CHANGED_SERVICES; do
            if echo "$ALL_SERVICES" | grep -qw "$svc"; then
              if echo "$JAVA_25_SERVICES" | grep -qw "$svc"; then
                CHANGED_JAVA25="$CHANGED_JAVA25 $svc"
              else
                CHANGED_JAVA21="$CHANGED_JAVA21 $svc"
              fi
            fi
          done

          CHANGED_JAVA21=$(echo "$CHANGED_JAVA21" | xargs)
          CHANGED_JAVA25=$(echo "$CHANGED_JAVA25" | xargs)

          # -------------------------------------------------------
          # 2. Detect helm-only chart changes
          #    Only charts that actually changed — source changes
          #    (backend/) are irrelevant to helm linting
          # -------------------------------------------------------
          HELM_CHANGED_SERVICES=$(echo "$CHANGED_FILES" \
            | grep -E "^charts/mobile-backend/" \
            | cut -d'/' -f3 \
            | sort -u \
            | xargs || true)

          HELM_ONLY_SERVICES=""
          for svc in $HELM_CHANGED_SERVICES; do
            if ! echo "$BUILD_CHANGED_SERVICES" | grep -qw "$svc"; then
              HELM_ONLY_SERVICES="$HELM_ONLY_SERVICES $svc"
            fi
          done
          HELM_ONLY_SERVICES=$(echo "$HELM_ONLY_SERVICES" | xargs)

          echo "Helm-only changes (no rebuild): $HELM_ONLY_SERVICES"

          # -------------------------------------------------------
          # 3. Detect shared-resources helm changes
          # -------------------------------------------------------
          SHARED_RESOURCES_CHANGED=$(echo "$CHANGED_FILES" \
            | grep -E "^charts/shared-resources/" \
            | head -1 || true)

          if [ -n "$SHARED_RESOURCES_CHANGED" ]; then
            SHARED_CHANGED=true
          else
            SHARED_CHANGED=false
          fi

          echo "Shared resources changed: $SHARED_CHANGED"

          # -------------------------------------------------------
          # 4. Detect ArgoCD manifest changes
          # -------------------------------------------------------
          ARGOCD_CHANGED=$(echo "$CHANGED_FILES" \
            | grep -E "^argocd/" \
            | head -1 || true)

          if [ -n "$ARGOCD_CHANGED" ]; then
            ARGOCD_CHANGE=true
          else
            ARGOCD_CHANGE=false
          fi

          echo "ArgoCD manifests changed: $ARGOCD_CHANGE"

          # -------------------------------------------------------
          # Set outputs
          # -------------------------------------------------------
          if [ -z "$CHANGED_JAVA21" ]; then
            echo "changed_java21=none" >> "$GITHUB_OUTPUT"
            echo "has_java21_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed_java21=$CHANGED_JAVA21" >> "$GITHUB_OUTPUT"
            echo "has_java21_changes=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$CHANGED_JAVA25" ]; then
            echo "changed_java25=none" >> "$GITHUB_OUTPUT"
            echo "has_java25_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed_java25=$CHANGED_JAVA25" >> "$GITHUB_OUTPUT"
            echo "has_java25_changes=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$BUILD_CHANGED_SERVICES" ]; then
            echo "has_build_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_build_changes=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$HELM_ONLY_SERVICES" ]; then
            echo "helm_changed_services=none" >> "$GITHUB_OUTPUT"
            echo "has_helm_only_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "helm_changed_services=$HELM_ONLY_SERVICES" >> "$GITHUB_OUTPUT"
            echo "has_helm_only_changes=true" >> "$GITHUB_OUTPUT"
          fi

          echo "shared_resources_changed=$SHARED_CHANGED" >> "$GITHUB_OUTPUT"
          echo "argocd_changed=$ARGOCD_CHANGE" >> "$GITHUB_OUTPUT"

      - name: Output Job Summary
        run: |
          echo "## Backend Change Detection — Staging CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Queued for Docker Build" >> $GITHUB_STEP_SUMMARY
          echo "| Java Version | Services |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          JAVA21="${{ steps.check_changes.outputs.changed_java21 }}"
          JAVA25="${{ steps.check_changes.outputs.changed_java25 }}"
          [ "$JAVA21" == "none" ] && JAVA21="—"
          [ "$JAVA25" == "none" ] && JAVA25="—"
          echo "| Java 21 | \`$JAVA21\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Java 25 | \`$JAVA25\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Helm-Only Updates (no rebuild)" >> $GITHUB_STEP_SUMMARY
          HELM_ONLY="${{ steps.check_changes.outputs.helm_changed_services }}"
          [ "$HELM_ONLY" == "none" ] && HELM_ONLY="—"
          echo "\`$HELM_ONLY\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure Changes" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| shared-resources | ${{ steps.check_changes.outputs.shared_resources_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| argocd manifests | ${{ steps.check_changes.outputs.argocd_changed }} |" >> $GITHUB_STEP_SUMMARY


  # =====================================================
  # JOB 2: Code Quality and Security Checks
  # Runs in parallel with helm_lint
  #
  # Active checks:
  #   - Unit Tests (failures reported, not blocking)
  #   - SpotBugs static analysis (HTML report uploaded)
  #   - OWASP Dependency Check (report uploaded)
  #
  # Enterprise checks (uncomment when GitHub Enterprise
  # is activated):
  #   - Secret Scanning (GitHub Advanced Security)
  #   - CodeQL Static Analysis (GitHub Advanced Security)
  # =====================================================
  test:
    name: Code Quality and Security Checks
    runs-on: [self-hosted, linux-runner]
    environment: stag
    needs: detect_changes
    if: |
      github.actor != 'dependabot[bot]' &&
      needs.detect_changes.outputs.has_build_changes == 'true'
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GitHub CLI and jq (if missing)
        run: |
          if ! command -v gh &> /dev/null; then
            echo "gh CLI not found, installing..."
            sudo apt-get update
            sudo apt-get install -y gh
          else
            echo "gh CLI already installed, skipping."
          fi
          if ! command -v jq &> /dev/null; then
            echo "jq not found, installing..."
            sudo apt-get install -y jq
          else
            echo "jq already installed, skipping."
          fi

      # -------------------------------------------------------
      # Dependabot checks
      # -------------------------------------------------------
      - name: Fetch Dependabot Metadata
        id: dependabot
        uses: dependabot/fetch-metadata@v2
        if: ${{ github.actor == 'dependabot[bot]' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Open Dependabot Alerts
        if: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          echo "Checking Dependabot alerts..."
          ALERTS=$(gh api repos/${{ github.repository }}/dependabot/alerts --jq '. | length')
          echo "Found $ALERTS open Dependabot alerts"
          if [ "$ALERTS" -gt 0 ]; then
            echo "Security alerts detected. Failing build until alerts are resolved."
            exit 1
          else
            echo "No Dependabot alerts found. Continuing build."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Resolve which services to scan — only changed services
      # -------------------------------------------------------
      - name: Resolve Changed Services for Scanning
        id: resolve_services
        run: |
          JAVA21="${{ needs.detect_changes.outputs.changed_java21 }}"
          JAVA25="${{ needs.detect_changes.outputs.changed_java25 }}"

          ALL_CHANGED=""
          [ "$JAVA21" != "none" ] && ALL_CHANGED="$ALL_CHANGED $JAVA21"
          [ "$JAVA25" != "none" ] && ALL_CHANGED="$ALL_CHANGED $JAVA25"
          ALL_CHANGED=$(echo "$ALL_CHANGED" | xargs)

          echo "Services to scan: $ALL_CHANGED"
          echo "services=$ALL_CHANGED" >> "$GITHUB_OUTPUT"

          SCAN_PATHS=""
          for svc in $ALL_CHANGED; do
            SCAN_PATHS="$SCAN_PATHS backend/$svc"
          done
          SCAN_PATHS=$(echo "$SCAN_PATHS" | xargs)
          echo "scan_paths=$SCAN_PATHS" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # Unit Tests — only changed services
      # Failures are reported but do not block the pipeline.
      # Tighten this gate once test baseline is clean.
      # -------------------------------------------------------
      - name: Run Unit Tests for Changed Services
        id: unit_tests
        continue-on-error: true
        run: |
          SCAN_PATHS="${{ steps.resolve_services.outputs.scan_paths }}"

          if [ -z "$SCAN_PATHS" ]; then
            echo "No services to test."
            exit 0
          fi

          echo "Running unit tests (failures ignored)..."
          for dir in $SCAN_PATHS; do
            if [ -f "$dir/pom.xml" ]; then
              echo "Running Maven tests in $dir"
              mvn -f "$dir/pom.xml" test \
                -Dmaven.test.failure.ignore=true \
                -DfailIfNoTests=false \
                --no-snapshot-updates \
                -Dmaven.javadoc.skip=true \
                -B -V || true
            else
              echo "Skipping $dir — no pom.xml found"
            fi
          done

      # -------------------------------------------------------
      # SpotBugs — only changed services
      # Static analysis — report uploaded, not blocking
      # -------------------------------------------------------
      - name: Run SpotBugs Static Analysis
        id: spotbugs
        continue-on-error: true
        run: |
          SCAN_PATHS="${{ steps.resolve_services.outputs.scan_paths }}"

          if [ -z "$SCAN_PATHS" ]; then
            echo "No services to scan."
            exit 0
          fi

          rm -rf reports/spotbugs
          mkdir -p reports/spotbugs

          for dir in $SCAN_PATHS; do
            if [ -f "$dir/pom.xml" ]; then
              echo "Running SpotBugs in $dir"
              OUT_DIR="$(pwd)/reports/spotbugs/$(basename $dir)"
              mkdir -p "$OUT_DIR"
              mvn -f "$dir/pom.xml" com.github.spotbugs:spotbugs-maven-plugin:4.9.6.0:spotbugs \
                -Dspotbugs.htmlOutput=true \
                -Dspotbugs.outputDirectory="$OUT_DIR" \
                -Dspotbugs.failOnError=false \
                || echo "SpotBugs scan failed for $dir — continuing."
            else
              echo "Skipping $dir — no pom.xml found"
            fi
          done

          echo "SpotBugs reports generated in reports/spotbugs/"
          ls -R reports/spotbugs || echo "No SpotBugs reports found."

      - name: Upload SpotBugs HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-html-reports
          path: reports/spotbugs/
          retention-days: 3

      # -------------------------------------------------------
      # OWASP Dependency Check — only changed services
      # Vulnerability scan — report uploaded, not blocking
      # High severity gate is disabled — enable when ready
      # -------------------------------------------------------
      - name: Run OWASP Dependency Check
        id: owasp
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          SCAN_PATHS="${{ steps.resolve_services.outputs.scan_paths }}"

          if [ -z "$SCAN_PATHS" ]; then
            echo "No services to scan."
            exit 0
          fi

          echo "Running OWASP Dependency Check for changed services..."
          for dir in $SCAN_PATHS; do
            if [ -f "$dir/pom.xml" ]; then
              echo "Scanning $dir..."
              mvn -f "$dir/pom.xml" org.owasp:dependency-check-maven:check \
                -Dformat=ALL \
                -DfailOnError=false
            else
              echo "Skipping $dir — no pom.xml found"
            fi
          done

      - name: Gather OWASP Reports
        if: always()
        run: |
          mkdir -p reports/owasp
          SCAN_PATHS="${{ steps.resolve_services.outputs.scan_paths }}"
          for dir in $SCAN_PATHS; do
            if [ -f "$dir/pom.xml" ]; then
              SVC=$(basename $dir)
              cp "$dir/target/dependency-check-report.html" \
                "reports/owasp/${SVC}-dependency-check-report.html" || true
            fi
          done

      - name: Delete Previous OWASP Artifact
        uses: geekyeggo/delete-artifact@v4
        with:
          name: owasp-dependency-check-reports

      - name: Upload OWASP Dependency Check Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-reports
          path: reports/owasp/
          overwrite: true
          retention-days: 3

      # High severity gate — disabled, enable when baseline is clean
      # - name: Fail on High Severity Vulnerabilities
      #   run: |
      #     found=0
      #     for f in reports/owasp/*-dependency-check-report.json; do
      #       if [ -f "$f" ]; then
      #         high=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.cvssScore >= 7)] | length' "$f")
      #         if [ "$high" -gt 0 ]; then
      #           echo "Found $high high-severity vulnerabilities in $f"
      #           found=1
      #         fi
      #       fi
      #     done
      #     if [ "$found" -eq 1 ]; then
      #       exit 1
      #     fi

      # -------------------------------------------------------
      # Job Summary
      # -------------------------------------------------------
      - name: Output Job Summary
        if: always()
        run: |
          echo "## Code Quality & Security Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Scanned" >> $GITHUB_STEP_SUMMARY
          echo "| Service |" >> $GITHUB_STEP_SUMMARY
          echo "|---|" >> $GITHUB_STEP_SUMMARY
          for svc in ${{ steps.resolve_services.outputs.services }}; do
            echo "| \`$svc\` |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ steps.unit_tests.outcome }} (non-blocking) |" >> $GITHUB_STEP_SUMMARY
          echo "| SpotBugs | ${{ steps.spotbugs.outcome }} (report uploaded) |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP Dependency Check | ${{ steps.owasp.outcome }} (report uploaded) |" >> $GITHUB_STEP_SUMMARY
          echo "| High Severity Gate | Disabled — enable when baseline is clean |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Enterprise scans (CodeQL, Secret Scanning) are commented out — uncomment when GitHub Enterprise is activated."

