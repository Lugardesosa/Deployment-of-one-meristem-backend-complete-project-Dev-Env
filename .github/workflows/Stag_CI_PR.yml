  # =====================================================
  # JOB 3: Helm Lint — validate changed Helm charts only
  # Runs in parallel with test job
  # Catches broken chart syntax before merge
  #
  # =====================================================
  helm_lint:
    name: Helm Lint Changed Charts
    runs-on: [self-hosted, linux-runner]
    needs: detect_changes
    if: |
      needs.detect_changes.outputs.has_helm_only_changes == 'true' ||
      needs.detect_changes.outputs.shared_resources_changed == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Helm is Installed
        run: |
          if ! command -v helm &>/dev/null; then
            echo "Installing Helm..."
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          else
            echo "Helm already installed: $(helm version --short)"
          fi

      # -------------------------------------------------------
      # Lint only charts that actually changed in charts/
      # -------------------------------------------------------
      - name: Lint Changed Service Charts
        id: lint_services
        run: |
          HELM_ONLY="${{ needs.detect_changes.outputs.helm_changed_services }}"

          if [ "$HELM_ONLY" == "none" ] || [ -z "$HELM_ONLY" ]; then
            echo "No service chart changes detected — skipping service lint."
          else
            FAILED=()
            PASSED=()

            for svc in $HELM_ONLY; do
              CHART_DIR="charts/mobile-backend/${svc}"
              if [ -d "$CHART_DIR" ]; then
                echo "Linting $CHART_DIR..."
                if helm lint "$CHART_DIR" \
                  -f "$CHART_DIR/values-stag_env.yaml"; then
                  echo "$svc — lint passed"
                  PASSED+=("$svc")
                else
                  echo "$svc — lint failed"
                  FAILED+=("$svc")
                fi
              else
                echo "No chart found at $CHART_DIR — skipping"
              fi
            done

            if [ ${#FAILED[@]} -gt 0 ]; then
              echo ""
              echo "Helm lint failed for: ${FAILED[*]}"
              exit 1
            fi
          fi

      - name: Lint Shared Resources Chart
        if: needs.detect_changes.outputs.shared_resources_changed == 'true'
        run: |
          echo "Linting charts/shared-resources..."
          if helm lint charts/shared-resources \
            -f charts/shared-resources/values.yaml; then
            echo "shared-resources — lint passed"
          else
            echo "shared-resources — lint failed"
            exit 1
          fi

      - name: Output Job Summary
        if: always()
        run: |
          echo "## Helm Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Chart | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          HELM_ONLY="${{ needs.detect_changes.outputs.helm_changed_services }}"
          if [ "$HELM_ONLY" != "none" ] && [ -n "$HELM_ONLY" ]; then
            for svc in $HELM_ONLY; do
              echo "| \`$svc\` | checked |" >> $GITHUB_STEP_SUMMARY
            done
          fi
          SHARED="${{ needs.detect_changes.outputs.shared_resources_changed }}"
          [ "$SHARED" == "true" ] && echo "| \`shared-resources\` | checked |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Only charts that actually changed in \`charts/\` are linted." >> $GITHUB_STEP_SUMMARY


  # =====================================================
  # JOB 4: Build & Push to Huawei SWR
  # Needs test + helm_lint (both must pass or be skipped)
  # Gated by has_build_changes
  # =====================================================
  build_and_push:
    name: Build & Push to Huawei SWR
    runs-on: [self-hosted, linux-runner]
    needs: [detect_changes, test, helm_lint]
    environment: stag
    if: |
      always() &&
      needs.detect_changes.outputs.has_build_changes == 'true' &&
      needs.test.result == 'success' &&
      (needs.helm_lint.result == 'success' || needs.helm_lint.result == 'skipped')
    permissions:
      contents: write
      packages: write
      id-token: write

    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        id: set_tag
        run: |
          IMAGE_TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)-${{ github.run_number }}
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $IMAGE_TAG"

      - name: Inject RSA Keys
        env:
          USERS_PRIVATE_KEY: ${{ secrets.USERS_PRIVATE_KEY }}
          USERS_PUBLIC_KEY: ${{ secrets.USERS_PUBLIC_KEY }}
          SERVICE_PUBLIC_KEY: ${{ secrets.SERVICE_PUBLIC_KEY }}
        run: |
          echo "Injecting RSA keys..."

          mkdir -p backend/users-service/src/main/resources/keys
          echo "${USERS_PRIVATE_KEY}" > backend/users-service/src/main/resources/keys/private.pem
          echo "${USERS_PUBLIC_KEY}"  > backend/users-service/src/main/resources/keys/public.pem
          echo "✓ Injected private + public keys for users-service"

          for svc in notification-service wallet-service report-service trustees-service wealth-service; do
            mkdir -p backend/$svc/src/main/resources/keys
            echo "${SERVICE_PUBLIC_KEY}" > backend/$svc/src/main/resources/keys/public.pem
            echo "Injected public key for $svc"
          done

      - name: Make Build Script Executable
        run: chmod +x ./scripts/backend-scripts/build-push-swr.sh

      - name: Resolve Changed Services
        id: resolve
        run: |
          JAVA21="${{ needs.detect_changes.outputs.changed_java21 }}"
          JAVA25="${{ needs.detect_changes.outputs.changed_java25 }}"

          ALL_CHANGED=""
          [ "$JAVA21" != "none" ] && ALL_CHANGED="$ALL_CHANGED $JAVA21"
          [ "$JAVA25" != "none" ] && ALL_CHANGED="$ALL_CHANGED $JAVA25"
          ALL_CHANGED=$(echo "$ALL_CHANGED" | xargs)

          echo "Resolved services for build: $ALL_CHANGED"

          if [ -z "$ALL_CHANGED" ]; then
            echo "ERROR: has_build_changes was true but no services resolved."
            exit 1
          fi

          echo "CHANGED_SERVICES=$ALL_CHANGED" >> "$GITHUB_ENV"

      - name: Build & Push Changed Services
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          SWR_REGISTRY_URL: ${{ secrets.SWR_REGISTRY_URL }}
          SWR_ORGANIZATION_NAME: ${{ secrets.SWR_ORGANIZATION_NAME }}
          HUAWEI_SWR_USERNAME: ${{ secrets.HUAWEI_SWR_USERNAME }}
          HUAWEI_SWR_PASSWORD: ${{ secrets.HUAWEI_SWR_PASSWORD }}
        run: |
          echo "Services confirmed for build: $CHANGED_SERVICES"
          bash ./scripts/backend-scripts/build-push-swr.sh

      - name: Commit Image Map for CD
        run: |
          IMAGE_TAG="${{ steps.set_tag.outputs.image_tag }}"

          mkdir -p .github/ci-artifacts

          echo "IMAGE_TAG=$IMAGE_TAG"                      >  .github/ci-artifacts/image_metadata.env
          echo "RUN_NUMBER=${{ github.run_number }}"       >> .github/ci-artifacts/image_metadata.env
          echo "COMMIT_SHA=${{ github.sha }}"              >> .github/ci-artifacts/image_metadata.env

          > .github/ci-artifacts/image_map.csv
          for svc in $CHANGED_SERVICES; do
            echo "${svc},${{ secrets.SWR_REGISTRY_URL }}/${{ secrets.SWR_ORGANIZATION_NAME }}/${svc}:${IMAGE_TAG}" \
              >> .github/ci-artifacts/image_map.csv
          done

          echo "=== image_metadata.env ==="
          cat .github/ci-artifacts/image_metadata.env
          echo ""
          echo "=== image_map.csv ==="
          cat .github/ci-artifacts/image_map.csv

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/ci-artifacts/
          if git diff --cached --quiet; then
            echo "No change to ci-artifacts — already up to date."
          else
            git commit -m "ci: image map for $IMAGE_TAG [skip ci]"
            git push origin HEAD
            echo "Image map committed and pushed."
          fi

      - name: Output Job Summary
        if: always()
        run: |
          echo "## Build & Push — Huawei SWR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.set_tag.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ secrets.SWR_REGISTRY_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Built" >> $GITHUB_STEP_SUMMARY
          echo "| Java Version | Services |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          JAVA21="${{ needs.detect_changes.outputs.changed_java21 }}"
          JAVA25="${{ needs.detect_changes.outputs.changed_java25 }}"
          [ "$JAVA21" == "none" ] && JAVA21="—"
          [ "$JAVA25" == "none" ] && JAVA25="—"
          echo "| Java 21 | \`$JAVA21\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Java 25 | \`$JAVA25\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Before merging — run an image scan on Huawei SWR for all built images." >> $GITHUB_STEP_SUMMARY
