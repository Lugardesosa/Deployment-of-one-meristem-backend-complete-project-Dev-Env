
# =====================================================
# GitHub Actions Workflow: CD - Deploy to Staging
# Triggered on push to stag_env (i.e. after PR merge)
# One Meristem Backend Service
# =====================================================

name: CD - One-Meristem Backend Deploy to Staging

on:
  push:
    branches:
      - stag_env
    paths:
      - "backend/**"
      - "charts/**"
      - "argocd/**"
      - "scripts/**"
  workflow_dispatch:

env:
  # =====================================================
  # SERVICE DEFINITIONS
  # =====================================================
  SERVICES_DIR: backend
  JAVA_21_SERVICES: "config-server cloud-gateway users-service notification-service wallet-service trustees-service report-service"
  JAVA_25_SERVICES: "wealth-service"
  ALL_SERVICES: "config-server cloud-gateway users-service notification-service wallet-service trustees-service report-service wealth-service"

  # =====================================================
  # GITHUB VARIABLES
  # =====================================================
  GIT_REPO_URL: ${{ vars.GIT_REPO_URL }}
  GIT_BRANCH: ${{ vars.GIT_BRANCH }}
  APP_NAMESPACE: ${{ vars.APP_NAMESPACE }}
  ARGOCD_NAMESPACE: ${{ vars.ARGOCD_NAMESPACE }}
  ARGOCD_PROJECT: ${{ vars.ARGOCD_PROJECT }}
  ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
  HELM_REPO_PATH: ${{ vars.HELM_REPO_PATH }}
  HELM_MOBILE_REPO_PATH: ${{ vars.HELM_MOBILE_REPO_PATH }}
  VALUES_FILE: ${{ vars.VALUES_FILE }}
  CLUSTER_SERVER_URL: ${{ vars.CLUSTER_SERVER_URL }}

  # ArgoCD App Names
  CONFIG_SERVER_APP_NAME: ${{ vars.CONFIG_SERVER_APP_NAME }}
  NOTIFICATION_SERVICE_APP_NAME: ${{ vars.NOTIFICATION_SERVICE_APP_NAME }}
  WALLET_SERVICE_APP_NAME: ${{ vars.WALLET_SERVICE_APP_NAME }}
  REPORT_SERVICE_APP_NAME: ${{ vars.REPORT_SERVICE_APP_NAME }}
  USERS_SERVICE_APP_NAME: ${{ vars.USERS_SERVICE_APP_NAME }}
  TRUSTEES_SERVICE_APP_NAME: ${{ vars.TRUSTEES_SERVICE_APP_NAME }}
  WEALTH_SERVICE_APP_NAME: ${{ vars.WEALTH_SERVICE_APP_NAME }}
  CLOUD_GATEWAY_APP_NAME: ${{ vars.CLOUD_GATEWAY_APP_NAME }}
  WEB_APP_APP_NAME: ${{ vars.WEB_APP_APP_NAME }}
  ADMIN_APP_APP_NAME: ${{ vars.ADMIN_APP_APP_NAME }}

  # Ingress & Networking
  APP_NAME: ${{ vars.APP_NAME }}
  INGRESS_HOST: ${{ vars.INGRESS_HOST }}
  ARGO_INGRESS_HOST: ${{ vars.ARGO_INGRESS_HOST }}
  STAG_INGRESS_HOST: ${{ vars.STAG_INGRESS_HOST }}

  # =====================================================
  # GITHUB SECRETS — SWR & Cluster
  # =====================================================
  ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  # =====================================================
  # GITHUB SECRETS — Shared Resources Credentials
  # =====================================================
  CREDENTIALS_ADMIN_PASSWORD: ${{ secrets.CREDENTIALS_ADMIN_PASSWORD }}
  CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
  CREDENTIALS_GITHUB_USERNAME: ${{ secrets.CREDENTIALS_GITHUB_USERNAME }}
  CREDENTIALS_GITHUB_PASSWORD: ${{ secrets.CREDENTIALS_GITHUB_PASSWORD }}
  CREDENTIALS_MAILER_USERNAME: ${{ secrets.CREDENTIALS_MAILER_USERNAME }}
  CREDENTIALS_MAILER_PASSWORD: ${{ secrets.CREDENTIALS_MAILER_PASSWORD }}
  CREDENTIALS_CREDIT_SWITCH_PUBLIC_KEY: ${{ secrets.CREDENTIALS_CREDIT_SWITCH_PUBLIC_KEY }}
  CREDENTIALS_CREDIT_SWITCH_PRIVATE_KEY: ${{ secrets.CREDENTIALS_CREDIT_SWITCH_PRIVATE_KEY }}
  CREDENTIALS_CREDIT_SWITCH_SMS_PASSWORD: ${{ secrets.CREDENTIALS_CREDIT_SWITCH_SMS_PASSWORD }}
  CREDENTIALS_HUAWEI_CLOUD_ACCESS_KEY_ID: ${{ secrets.CREDENTIALS_HUAWEI_CLOUD_ACCESS_KEY_ID }}
  CREDENTIALS_HUAWEI_CLOUD_SECRET_ACCESS_KEY: ${{ secrets.CREDENTIALS_HUAWEI_CLOUD_SECRET_ACCESS_KEY }}
  CREDENTIALS_H2_PASSWORD: ${{ secrets.CREDENTIALS_H2_PASSWORD }}
  CREDENTIALS_PROVIDUS_API_PUBLIC_KEY: ${{ secrets.CREDENTIALS_PROVIDUS_API_PUBLIC_KEY }}
  CREDENTIALS_PROVIDUS_API_SECRET_KEY: ${{ secrets.CREDENTIALS_PROVIDUS_API_SECRET_KEY }}
  CREDENTIALS_TRUSTEES_CLIENT_SECRET: ${{ secrets.CREDENTIALS_TRUSTEES_CLIENT_SECRET }}
  CREDENTIALS_WEALTH_CLIENT_SECRET: ${{ secrets.CREDENTIALS_WEALTH_CLIENT_SECRET }}
  CREDENTIALS_ENC_SALT: ${{ secrets.CREDENTIALS_ENC_SALT }}
  CREDENTIALS_EXPO_TOKEN: ${{ secrets.CREDENTIALS_EXPO_TOKEN }}
  CREDENTIALS_OKHI_HEADER_VALUE: ${{ secrets.CREDENTIALS_OKHI_HEADER_VALUE }}
  CREDENTIALS_PAYSTACK_SECRET_KEY: ${{ secrets.CREDENTIALS_PAYSTACK_SECRET_KEY }}
  CREDENTIALS_SMILE_ID_PROD_API_KEY: ${{ secrets.CREDENTIALS_SMILE_ID_PROD_API_KEY }}
  CREDENTIALS_SMILE_ID_DEV_API_KEY: ${{ secrets.CREDENTIALS_SMILE_ID_DEV_API_KEY }}
  CREDENTIALS_MOBILE_SECRET: ${{ secrets.CREDENTIALS_MOBILE_SECRET }}
  CREDENTIALS_TRUSTEES_SECRET: ${{ secrets.CREDENTIALS_TRUSTEES_SECRET }}
  CREDENTIALS_NOTIFICATION_SECRET: ${{ secrets.CREDENTIALS_NOTIFICATION_SECRET }}
  CREDENTIALS_ID_HASHING_SECRET: ${{ secrets.CREDENTIALS_ID_HASHING_SECRET }}
  CREDENTIALS_WEB_SECRET: ${{ secrets.CREDENTIALS_WEB_SECRET }}
  CREDENTIALS_WALLET_SECRET: ${{ secrets.CREDENTIALS_WALLET_SECRET }}
  CREDENTIALS_WEALTH_SECRET: ${{ secrets.CREDENTIALS_WEALTH_SECRET }}
  CREDENTIALS_MIDDLE_WARE_API_KEY: ${{ secrets.CREDENTIALS_MIDDLE_WARE_API_KEY }}
  CREDENTIALS_DOJAH_SECRET_KEY: ${{ secrets.CREDENTIALS_DOJAH_SECRET_KEY }}
  CREDENTIALS_DOJAH_PRIVATE_KEY: ${{ secrets.CREDENTIALS_DOJAH_PRIVATE_KEY }}
  CREDENTIALS_PASTEL_API_KEY: ${{ secrets.CREDENTIALS_PASTEL_API_KEY }}
  CREDENTIALS_PASTEL_API_SECRET: ${{ secrets.CREDENTIALS_PASTEL_API_SECRET }}

  # =====================================================
  # GITHUB SECRETS — OBS, Image Pull, Ingress
  # =====================================================
  OBS_ACCESS_KEY_B64: ${{ secrets.OBS_ACCESS_KEY_B64 }}
  OBS_SECRET_KEY_B64: ${{ secrets.OBS_SECRET_KEY_B64 }}
  IMAGE_PULL_SECRET_DOCKERCONFIGJSON: ${{ secrets.IMAGE_PULL_SECRET_DOCKERCONFIGJSON }}
  SHARED_ELB_ID: ${{ secrets.SHARED_ELB_ID }}
  TLS_CERT_CLOUD_GATEWAY_B64: ${{ secrets.TLS_CERT_CLOUD_GATEWAY_B64 }}
  TLS_KEY_CLOUD_GATEWAY_B64: ${{ secrets.TLS_KEY_CLOUD_GATEWAY_B64 }}
  TLS_CERT_WEB_APP_B64: ${{ secrets.TLS_CERT_WEB_APP_B64 }}
  TLS_KEY_WEB_APP_B64: ${{ secrets.TLS_KEY_WEB_APP_B64 }}
  TLS_CERT_ADMIN_APP_B64: ${{ secrets.TLS_CERT_ADMIN_APP_B64 }}
  TLS_KEY_ADMIN_APP_B64: ${{ secrets.TLS_KEY_ADMIN_APP_B64 }}


jobs:
  # =====================================================
  # JOB 1: Detect Changed Services
  # Same detection logic as CI
  # Uses HEAD^ HEAD for push events
  # =====================================================
  detect_changes:
    name: Detect Changed Backend Services
    runs-on: [self-hosted, linux-runner]
    outputs:
      changed_java21: ${{ steps.check_changes.outputs.changed_java21 }}
      changed_java25: ${{ steps.check_changes.outputs.changed_java25 }}
      has_java21_changes: ${{ steps.check_changes.outputs.has_java21_changes }}
      has_java25_changes: ${{ steps.check_changes.outputs.has_java25_changes }}
      has_build_changes: ${{ steps.check_changes.outputs.has_build_changes }}
      helm_changed_services: ${{ steps.check_changes.outputs.helm_changed_services }}
      has_helm_only_changes: ${{ steps.check_changes.outputs.has_helm_only_changes }}
      shared_resources_changed: ${{ steps.check_changes.outputs.shared_resources_changed }}
      argocd_changed: ${{ steps.check_changes.outputs.argocd_changed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Branch Info
        run: |
          echo "Repository  : $GITHUB_REPOSITORY"
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit      : ${{ github.sha }}"
          echo ""
          git branch -vv
          git log -1 --oneline
          echo ""
          echo "=== Files Changed ==="
          git diff --name-only HEAD^ HEAD

      - name: Detect Changed Services
        id: check_changes
        run: |
          set -e

          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)

          echo "=== ALL CHANGED FILES ==="
          echo "$CHANGED_FILES"
          echo "========================="

          JAVA_21_SERVICES="${{ env.JAVA_21_SERVICES }}"
          JAVA_25_SERVICES="${{ env.JAVA_25_SERVICES }}"
          ALL_SERVICES="${{ env.ALL_SERVICES }}"

          # -------------------------------------------------------
          # 1. Detect backend source changes (triggers image tag update)
          # -------------------------------------------------------
          BUILD_CHANGED_SERVICES=$(echo "$CHANGED_FILES" \
            | grep -E "^${{ env.SERVICES_DIR }}/" \
            | cut -d'/' -f2 \
            | sort -u \
            | xargs || true)

          echo "Services with source changes: $BUILD_CHANGED_SERVICES"

          CHANGED_JAVA21=""
          CHANGED_JAVA25=""

          for svc in $BUILD_CHANGED_SERVICES; do
            if echo "$ALL_SERVICES" | grep -qw "$svc"; then
              if echo "$JAVA_25_SERVICES" | grep -qw "$svc"; then
                CHANGED_JAVA25="$CHANGED_JAVA25 $svc"
              else
                CHANGED_JAVA21="$CHANGED_JAVA21 $svc"
              fi
            fi
          done

          CHANGED_JAVA21=$(echo "$CHANGED_JAVA21" | xargs)
          CHANGED_JAVA25=$(echo "$CHANGED_JAVA25" | xargs)

          # -------------------------------------------------------
          # 2. Detect helm-only changes (chart changed, no source)
          # -------------------------------------------------------
          HELM_CHANGED_SERVICES=$(echo "$CHANGED_FILES" \
            | grep -E "^charts/apps/mobile-backend/" \
            | cut -d'/' -f4 \
            | sort -u \
            | xargs || true)

          HELM_ONLY_SERVICES=""
          for svc in $HELM_CHANGED_SERVICES; do
            if ! echo "$BUILD_CHANGED_SERVICES" | grep -qw "$svc"; then
              HELM_ONLY_SERVICES="$HELM_ONLY_SERVICES $svc"
            fi
          done
          HELM_ONLY_SERVICES=$(echo "$HELM_ONLY_SERVICES" | xargs)

          # -------------------------------------------------------
          # 3. Detect shared-resources chart changes
          # -------------------------------------------------------
          SHARED_RESOURCES_CHANGED=$(echo "$CHANGED_FILES" \
            | grep -E "^charts/shared-resources/" \
            | head -1 || true)
          [ -n "$SHARED_RESOURCES_CHANGED" ] && SHARED_CHANGED=true || SHARED_CHANGED=false

          # -------------------------------------------------------
          # 4. Detect ArgoCD manifest changes
          # -------------------------------------------------------
          ARGOCD_CHANGED_FILES=$(echo "$CHANGED_FILES" \
            | grep -E "^argocd/" \
            | head -1 || true)
          [ -n "$ARGOCD_CHANGED_FILES" ] && ARGOCD_CHANGE=true || ARGOCD_CHANGE=false

          # -------------------------------------------------------
          # Set outputs
          # -------------------------------------------------------
          if [ -z "$CHANGED_JAVA21" ]; then
            echo "changed_java21=none" >> "$GITHUB_OUTPUT"
            echo "has_java21_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed_java21=$CHANGED_JAVA21" >> "$GITHUB_OUTPUT"
            echo "has_java21_changes=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$CHANGED_JAVA25" ]; then
            echo "changed_java25=none" >> "$GITHUB_OUTPUT"
            echo "has_java25_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed_java25=$CHANGED_JAVA25" >> "$GITHUB_OUTPUT"
            echo "has_java25_changes=true" >> "$GITHUB_OUTPUT"
          fi

          [ -z "$BUILD_CHANGED_SERVICES" ] \
            && echo "has_build_changes=false" >> "$GITHUB_OUTPUT" \
            || echo "has_build_changes=true" >> "$GITHUB_OUTPUT"

          if [ -z "$HELM_ONLY_SERVICES" ]; then
            echo "helm_changed_services=none" >> "$GITHUB_OUTPUT"
            echo "has_helm_only_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "helm_changed_services=$HELM_ONLY_SERVICES" >> "$GITHUB_OUTPUT"
            echo "has_helm_only_changes=true" >> "$GITHUB_OUTPUT"
          fi

          echo "shared_resources_changed=$SHARED_CHANGED" >> "$GITHUB_OUTPUT"
          echo "argocd_changed=$ARGOCD_CHANGE" >> "$GITHUB_OUTPUT"

      - name: Output Job Summary
        run: |
          echo "## Change Detection — Staging CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Java Version | Services |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          JAVA21="${{ steps.check_changes.outputs.changed_java21 }}"
          JAVA25="${{ steps.check_changes.outputs.changed_java25 }}"
          [ "$JAVA21" == "none" ] && JAVA21="—"
          [ "$JAVA25" == "none" ] && JAVA25="—"
          echo "| Java 21 | \`$JAVA21\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Java 25 | \`$JAVA25\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| shared-resources | ${{ steps.check_changes.outputs.shared_resources_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| argocd manifests | ${{ steps.check_changes.outputs.argocd_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| helm only        | ${{ steps.check_changes.outputs.has_helm_only_changes }} |" >> $GITHUB_STEP_SUMMARY


  # =====================================================
  # JOB 2: Read Image Map Written by CI
  # No rebuild — reads .github/ci-artifacts/ committed
  # by CI build_and_push job after successful push to SWR
  # Only runs when backend services changed
  # Fails loudly if CI never committed the artifact files
  # =====================================================
  read_image_map:
    name: Read CI Image Map
    runs-on: [self-hosted, linux-runner]
    needs: detect_changes
    if: needs.detect_changes.outputs.has_build_changes == 'true'
    outputs:
      image_tag: ${{ steps.loadmeta.outputs.image_tag }}
      built_services: ${{ steps.loadmeta.outputs.built_services }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Image Map
        id: loadmeta
        run: |
          METADATA=".github/ci-artifacts/image_metadata.env"
          IMAGE_MAP=".github/ci-artifacts/image_map.csv"

          if [ ! -f "$METADATA" ] || [ ! -f "$IMAGE_MAP" ]; then
            echo "ERROR: CI artifact files not found."
            echo "Expected:"
            echo "  $METADATA"
            echo "  $IMAGE_MAP"
            echo ""
            echo "This means either:"
            echo "  1. CI pipeline did not run for this PR"
            echo "  2. CI build_and_push job failed before committing the image map"
            echo "  3. Image scan was not completed before merge"
            exit 1
          fi

          echo "=== image_metadata.env ==="
          cat "$METADATA"
          echo ""
          echo "=== image_map.csv ==="
          cat "$IMAGE_MAP"
          echo ""

          IMAGE_TAG=$(grep '^IMAGE_TAG=' "$METADATA" | cut -d'=' -f2)
          BUILT_SERVICES=$(cut -d',' -f1 "$IMAGE_MAP" | xargs)

          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: IMAGE_TAG is empty in $METADATA"
            exit 1
          fi

          if [ -z "$BUILT_SERVICES" ]; then
            echo "ERROR: No services found in $IMAGE_MAP"
            exit 1
          fi

          echo "Image tag resolved : $IMAGE_TAG"
          echo "Services from CI   : $BUILT_SERVICES"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "built_services=$BUILT_SERVICES" >> "$GITHUB_OUTPUT"

      - name: Output Job Summary
        run: |
          echo "## Image Map — Read from CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.loadmeta.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Services  | \`${{ steps.loadmeta.outputs.built_services }}\` |" >> $GITHUB_STEP_SUMMARY


  # =====================================================
  # JOB 3: Deploy via ArgoCD
  # Runs after read_image_map succeeds OR is skipped
  # (skipped means helm/argocd/shared-resources only change)
  #
  # Two responsibilities:
  #   1. yq + git commit — updates image.repository and
  #      image.tag in values-stag_env.yaml per changed service
  #      ArgoCD watches git and shows OutOfSync after commit
  #
  #   2. argocd app set — injects credentials into ArgoCD
  #      for shared-resources ONLY — secrets never touch git
  # =====================================================
  deploy:
    name: Deploy via ArgoCD
    runs-on: [self-hosted, linux-runner]
    needs: [detect_changes, read_image_map]
    permissions:
      contents: write   # required for git commit + push of values files
    if: |
      always() &&
      (needs.read_image_map.result == 'success' ||
       needs.read_image_map.result == 'skipped') &&
      (needs.detect_changes.outputs.has_build_changes == 'true' ||
       needs.detect_changes.outputs.has_helm_only_changes == 'true' ||
       needs.detect_changes.outputs.shared_resources_changed == 'true' ||
       needs.detect_changes.outputs.argocd_changed == 'true')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # INSTALL ARGOCD CLI
      # Only installs if not already present on runner
      # -------------------------------------------------------
      - name: Install ArgoCD CLI
        run: |
          if ! command -v argocd &>/dev/null; then
            echo "ArgoCD CLI not found — installing..."
            curl -sSL -o /usr/local/bin/argocd \
              https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
            chmod +x /usr/local/bin/argocd
            echo "ArgoCD CLI installed."
          else
            echo "ArgoCD CLI already present — skipping."
          fi
          argocd version --client

      # -------------------------------------------------------
      # INSTALL YQ
      # Only installs if not already present on runner
      # -------------------------------------------------------
      - name: Install yq
        run: |
          if ! command -v yq &>/dev/null; then
            echo "yq not found — installing..."
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
            echo "yq installed: $(yq --version)"
          else
            echo "yq already present: $(yq --version)"
          fi

      # -------------------------------------------------------
      # LOGIN TO ARGOCD
      # -------------------------------------------------------
      - name: Login to ArgoCD
        run: |
          argocd login ${{ env.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }} \
            --insecure \
            --grpc-web

      # -------------------------------------------------------
      # APPLY ARGOCD APPLICATION MANIFESTS
      # Only runs when argocd/ folder changed
      # envsubst on argocd manifests ONLY —
      # NEVER run envsubst on helm charts — corrupts {{ }} templates
      # -------------------------------------------------------
      - name: Apply ArgoCD Application Manifests
        if: needs.detect_changes.outputs.argocd_changed == 'true'
        run: |
          export GIT_REPO_URL="${{ env.GIT_REPO_URL }}"
          export GIT_BRANCH="${{ env.GIT_BRANCH }}"
          export ARGOCD_NAMESPACE="${{ env.ARGOCD_NAMESPACE }}"
          export ARGOCD_PROJECT="${{ env.ARGOCD_PROJECT }}"
          export APP_NAMESPACE="${{ env.APP_NAMESPACE }}"
          export HELM_REPO_PATH="${{ env.HELM_REPO_PATH }}"
          export HELM_MOBILE_REPO_PATH="${{ env.HELM_MOBILE_REPO_PATH }}"
          export VALUES_FILE="${{ env.VALUES_FILE }}"
          export CONFIG_SERVER_APP_NAME="${{ env.CONFIG_SERVER_APP_NAME }}"
          export CLOUD_GATEWAY_APP_NAME="${{ env.CLOUD_GATEWAY_APP_NAME }}"
          export NOTIFICATION_SERVICE_APP_NAME="${{ env.NOTIFICATION_SERVICE_APP_NAME }}"
          export WALLET_SERVICE_APP_NAME="${{ env.WALLET_SERVICE_APP_NAME }}"
          export REPORT_SERVICE_APP_NAME="${{ env.REPORT_SERVICE_APP_NAME }}"
          export USERS_SERVICE_APP_NAME="${{ env.USERS_SERVICE_APP_NAME }}"
          export TRUSTEES_SERVICE_APP_NAME="${{ env.TRUSTEES_SERVICE_APP_NAME }}"
          export WEALTH_SERVICE_APP_NAME="${{ env.WEALTH_SERVICE_APP_NAME }}"
          export CLUSTER_SERVER_URL="${{ env.CLUSTER_SERVER_URL }}"

          echo "Applying ArgoCD application manifests..."
          envsubst < ./argocd/apps/application.yaml | kubectl apply -f -
          echo "ArgoCD manifests applied."

      # -------------------------------------------------------
      # INJECT CREDENTIALS INTO ARGOCD FOR SHARED-RESOURCES
      # argocd app set used ONLY for credentials —
      # secrets must never be committed to git
      # Runs when backend changed OR shared-resources changed
      # -------------------------------------------------------
      - name: Set Shared Resources Credentials in ArgoCD
        if: |
          needs.detect_changes.outputs.has_build_changes == 'true' ||
          needs.detect_changes.outputs.shared_resources_changed == 'true'
        run: |
          echo "Injecting shared-resources credentials into ArgoCD..."
          argocd app set shared-resources \
            --helm-set credentials.adminPassword="${{ secrets.CREDENTIALS_ADMIN_PASSWORD }}" \
            --helm-set credentials.encryptionKey="${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}" \
            --helm-set credentials.githubUsername="${{ secrets.CREDENTIALS_GITHUB_USERNAME }}" \
            --helm-set credentials.githubPassword="${{ secrets.CREDENTIALS_GITHUB_PASSWORD }}" \
            --helm-set credentials.mailerUsername="${{ secrets.CREDENTIALS_MAILER_USERNAME }}" \
            --helm-set credentials.mailerPassword="${{ secrets.CREDENTIALS_MAILER_PASSWORD }}" \
            --helm-set credentials.creditSwitchPublicKey="${{ secrets.CREDENTIALS_CREDIT_SWITCH_PUBLIC_KEY }}" \
            --helm-set credentials.creditSwitchPrivateKey="${{ secrets.CREDENTIALS_CREDIT_SWITCH_PRIVATE_KEY }}" \
            --helm-set credentials.creditSwitchSmsPassword="${{ secrets.CREDENTIALS_CREDIT_SWITCH_SMS_PASSWORD }}" \
            --helm-set credentials.huaweiCloudAccessKeyId="${{ secrets.CREDENTIALS_HUAWEI_CLOUD_ACCESS_KEY_ID }}" \
            --helm-set credentials.huaweiCloudSecretAccessKey="${{ secrets.CREDENTIALS_HUAWEI_CLOUD_SECRET_ACCESS_KEY }}" \
            --helm-set credentials.h2Password="${{ secrets.CREDENTIALS_H2_PASSWORD }}" \
            --helm-set credentials.providusApiPublicKey="${{ secrets.CREDENTIALS_PROVIDUS_API_PUBLIC_KEY }}" \
            --helm-set credentials.providusApiSecretKey="${{ secrets.CREDENTIALS_PROVIDUS_API_SECRET_KEY }}" \
            --helm-set credentials.trusteesClientSecret="${{ secrets.CREDENTIALS_TRUSTEES_CLIENT_SECRET }}" \
            --helm-set credentials.wealthClientSecret="${{ secrets.CREDENTIALS_WEALTH_CLIENT_SECRET }}" \
            --helm-set credentials.encSalt="${{ secrets.CREDENTIALS_ENC_SALT }}" \
            --helm-set credentials.expoToken="${{ secrets.CREDENTIALS_EXPO_TOKEN }}" \
            --helm-set credentials.okhiHeaderValue="${{ secrets.CREDENTIALS_OKHI_HEADER_VALUE }}" \
            --helm-set credentials.paystackSecretKey="${{ secrets.CREDENTIALS_PAYSTACK_SECRET_KEY }}" \
            --helm-set credentials.smileIdProdApiKey="${{ secrets.CREDENTIALS_SMILE_ID_PROD_API_KEY }}" \
            --helm-set credentials.smileIdDevApiKey="${{ secrets.CREDENTIALS_SMILE_ID_DEV_API_KEY }}" \
            --helm-set credentials.mobileSecret="${{ secrets.CREDENTIALS_MOBILE_SECRET }}" \
            --helm-set credentials.trusteesSecret="${{ secrets.CREDENTIALS_TRUSTEES_SECRET }}" \
            --helm-set credentials.notificationSecret="${{ secrets.CREDENTIALS_NOTIFICATION_SECRET }}" \
            --helm-set credentials.idHashingSecret="${{ secrets.CREDENTIALS_ID_HASHING_SECRET }}" \
            --helm-set credentials.webSecret="${{ secrets.CREDENTIALS_WEB_SECRET }}" \
            --helm-set credentials.walletSecret="${{ secrets.CREDENTIALS_WALLET_SECRET }}" \
            --helm-set credentials.wealthSecret="${{ secrets.CREDENTIALS_WEALTH_SECRET }}" \
            --helm-set credentials.middlewareApiKey="${{ secrets.CREDENTIALS_MIDDLE_WARE_API_KEY }}" \
            --helm-set credentials.dojahSecretKey="${{ secrets.CREDENTIALS_DOJAH_SECRET_KEY }}" \
            --helm-set credentials.dojahPrivateKey="${{ secrets.CREDENTIALS_DOJAH_PRIVATE_KEY }}" \
            --helm-set credentials.pastelApiKey="${{ secrets.CREDENTIALS_PASTEL_API_KEY }}" \
            --helm-set credentials.pastelApiSecret="${{ secrets.CREDENTIALS_PASTEL_API_SECRET }}" \
            --helm-set obsSecret.data.accessKey="${{ secrets.OBS_ACCESS_KEY_B64 }}" \
            --helm-set obsSecret.data.secretKey="${{ secrets.OBS_SECRET_KEY_B64 }}" \
            --helm-set imagePullSecret.dockerconfigjson="${{ secrets.IMAGE_PULL_SECRET_DOCKERCONFIGJSON }}" \
            --helm-set ingress.elbId="${{ secrets.SHARED_ELB_ID }}" \
            --helm-set ingress.cloudGateway.tlsCert="${{ secrets.TLS_CERT_CLOUD_GATEWAY_B64 }}" \
            --helm-set ingress.cloudGateway.tlsKey="${{ secrets.TLS_KEY_CLOUD_GATEWAY_B64 }}" \
            --helm-set ingress.webApp.tlsCert="${{ secrets.TLS_CERT_WEB_APP_B64 }}" \
            --helm-set ingress.webApp.tlsKey="${{ secrets.TLS_KEY_WEB_APP_B64 }}" \
            --helm-set ingress.adminApp.tlsCert="${{ secrets.TLS_CERT_ADMIN_APP_B64 }}" \
            --helm-set ingress.adminApp.tlsKey="${{ secrets.TLS_KEY_ADMIN_APP_B64 }}" \
            --insecure \
            --grpc-web
          echo "Shared resources credentials injected."

      # -------------------------------------------------------
      # UPDATE IMAGE TAGS IN HELM VALUES FILES VIA YQ
      # Reads image_map.csv written by CI build_and_push job
      # Updates image.repository and image.tag per changed service
      # Only touches values files for services in the CSV —
      # no other services are affected
      # -------------------------------------------------------
      - name: Update Helm Image Tags via yq
        if: needs.detect_changes.outputs.has_build_changes == 'true'
        run: |
          IMAGE_MAP=".github/ci-artifacts/image_map.csv"

          if [ ! -f "$IMAGE_MAP" ]; then
            echo "ERROR: $IMAGE_MAP not found. Cannot update image tags."
            exit 1
          fi

          echo "=== image_map.csv ==="
          cat "$IMAGE_MAP"
          echo ""

          UPDATED=()
          SKIPPED=()

          while IFS=, read -r svc full_ref; do
            svc=$(echo "$svc" | xargs)
            full_ref=$(echo "$full_ref" | xargs)

            REPO_ONLY=$(echo "$full_ref" | cut -d':' -f1)
            TAG_ONLY=$(echo "$full_ref" | cut -d':' -f2)

            VALUES_FILE="charts/apps/mobile-backend/${svc}/${{ env.VALUES_FILE }}"

            if [ ! -f "$VALUES_FILE" ]; then
              echo "WARN: Values file not found for $svc → $VALUES_FILE — skipping"
              SKIPPED+=("$svc")
              continue
            fi

            echo "--------------------------------------------------"
            echo "Updating $svc"
            echo "  Values file : $VALUES_FILE"
            echo "  Repository  : $REPO_ONLY"
            echo "  Tag         : $TAG_ONLY"
            echo ""
            echo "Before:"
            yq e '.image' "$VALUES_FILE"

            yq e -i ".image.repository = \"${REPO_ONLY}\"" "$VALUES_FILE"
            yq e -i ".image.tag = \"${TAG_ONLY}\"" "$VALUES_FILE"

            echo "After:"
            yq e '.image' "$VALUES_FILE"
            UPDATED+=("$svc")
          done < "$IMAGE_MAP"

          echo ""
          echo "Updated : ${UPDATED[*]:-none}"
          echo "Skipped : ${SKIPPED[*]:-none}"

      # -------------------------------------------------------
      # COMMIT UPDATED VALUES FILES BACK TO STAG_ENV
      # ArgoCD watches this repo — this git commit is what
      # triggers OutOfSync and makes manual sync possible
      # [skip ci] prevents CD from triggering itself again
      # -------------------------------------------------------
      - name: Commit Updated Helm Values
        if: needs.detect_changes.outputs.has_build_changes == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add charts/apps/mobile-backend/

          if git diff --cached --quiet; then
            echo "No changes to values files — already up to date."
          else
            IMAGE_TAG="${{ needs.read_image_map.outputs.image_tag }}"
            SERVICES="${{ needs.read_image_map.outputs.built_services }}"

            git commit -m "cd: update image tags to $IMAGE_TAG for [$SERVICES] [skip ci]"
            git push origin ${{ env.GIT_BRANCH }}
            echo "Values files committed and pushed."
            echo "ArgoCD will now show OutOfSync — proceed to UI to sync."
          fi

      # -------------------------------------------------------
      # PIPELINE COMPLETE
      # Summary of what ran and what to do next
      # -------------------------------------------------------
      - name: Pipeline Summary
        if: always()
        run: |
          echo "## CD Pipeline Complete — Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch       | \`${{ env.GIT_BRANCH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Merge Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag    | \`${{ needs.read_image_map.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Services     | \`${{ needs.read_image_map.outputs.built_services }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend build changes | ${{ needs.detect_changes.outputs.has_build_changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm only changes     | ${{ needs.detect_changes.outputs.has_helm_only_changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared resources      | ${{ needs.detect_changes.outputs.shared_resources_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD manifests      | ${{ needs.detect_changes.outputs.argocd_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What happened" >> $GITHUB_STEP_SUMMARY
          echo "- Image tags updated in \`values-stag_env.yaml\` via yq and committed to git" >> $GITHUB_STEP_SUMMARY
          echo "- Credentials injected into ArgoCD via \`argocd app set\` (never committed to git)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Step" >> $GITHUB_STEP_SUMMARY
          echo "Log into ArgoCD UI and manually sync the updated applications." >> $GITHUB_STEP_SUMMARY


# **Complete flow:**
# ```
# detect_changes
#     └── read_image_map         (only if has_build_changes=true)
#             │                   reads .github/ci-artifacts/image_map.csv
#             │                   reads .github/ci-artifacts/image_metadata.env
#             └── deploy          (runs if any change flag is true)
#                   ├── install argocd cli + yq
#                   ├── login to argocd
#                   ├── apply argocd manifests      (if argocd/ changed)
#                   ├── set shared-resources creds  (if backend or shared changed)
#                   │     └── argocd app set only — credentials never touch git
#                   ├── update helm values via yq   (if backend changed)
#                   │     └── reads image_map.csv → updates image.repository + image.tag
#                   └── git commit + push values    (if backend changed)
#                         └── ArgoCD detects OutOfSync → manual sync from UI


