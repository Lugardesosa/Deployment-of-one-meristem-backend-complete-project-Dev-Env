
# ----------------------------------------
# One-Meristem Mobile-backend CD for Staging Env
# ----------------------------------------

name: One-Meristem-Mobile-backend CD for Staging Env 

on:
  push:
    branches:
      - stag_enj
    paths:
      - "charts/**"            # helm charts
      - "backend/**"          # backend services
      #- ".github/workflows/Stag_CD_Push.yml"
      - "argocd/**"
      - "scripts/**"
  workflow_dispatch:



env:
  APP_NAMESPACE: ${{ vars.APP_NAMESPACE }}
  ARGOCD_NAMESPACE: ${{ vars.ARGOCD_NAMESPACE }}
  GIT_BRANCH: ${{ vars.GIT_BRANCH }}
  HELM_REPO_PATH: ${{ vars.HELM_REPO_PATH }}
  HELM_MOBILE_REPO_PATH: ${{ vars.HELM_MOBILE_REPO_PATH }}
  APP_NAME: ${{ vars.APP_NAME }}
  INGRESS_HOST: ${{ vars.INGRESS_HOST }}
  CLUSTER_SERVER_URL: ${{ vars.CLUSTER_SERVER_URL }}
  CONFIG_SERVER_APP_NAME: ${{ vars.CONFIG_SERVER_APP_NAME }}
  CLOUD_GATEWAY_APP_NAME: ${{ vars.CLOUD_GATEWAY_APP_NAME }}
  CONSUL_APP_NAME: ${{ vars.CONSUL_APP_NAME }}
  NOTIFICATION_SERVICE_APP_NAME: ${{ vars.NOTIFICATION_SERVICE_APP_NAME }}
  WALLET_SERVICE_APP_NAME: ${{ vars.WALLET_SERVICE_APP_NAME }}
  REPORT_SERVICE_APP_NAME: ${{ vars.REPORT_SERVICE_APP_NAME }}
  USERS_SERVICE_APP_NAME: ${{ vars.USERS_SERVICE_APP_NAME }}
  TRUSTEES_SERVICE_APP_NAME: ${{ vars.TRUSTEES_SERVICE_APP_NAME }}
  VALUES_FILE: ${{ vars.VALUES_FILE }}
  GIT_REPO_URL: ${{ vars.GIT_REPO_URL }}
  MOBILE_CERTIFICATE_IDS: ${{ vars.MOBILE_CERTIFICATE_IDS }}
  ARGO_CERTIFICATE_ID: ${{ vars.ARGO_CERTIFICATE_ID }}
  MOBILE_ELB_ID: ${{ vars.MOBILE_ELB_ID }}
  ARGO_ELB_ID: ${{ vars.ARGO_ELB_ID }}
  MOBILE_ELB_IP: ${{ vars.MOBILE_ELB_IP }}
  ARGO_ELB_IP: ${{ vars.ARGO_ELB_IP }}
  ARGOCD_PROJECT: ${{ vars.ARGOCD_PROJECT }}
  ARGO_INGRESS_HOST: ${{ vars.ARGO_INGRESS_HOST }} #<-- Change this to your ArgoCD ingress host
  STAG_INGRESS_HOST: ${{ vars.STAG_INGRESS_HOST }} #<-- Change this to your Staging ingress host
  BRANCH_ENV: ${{ vars.BRANCH_ENV }} #<---- To represent the helm values.yaml used via branch on push
  HUAWEI_ENTERPRISE_PROJECT_ID: ${{ vars.HUAWEI_ENTERPRISE_PROJECT_ID }}
      
 
  
  # Stored Secrets in Github Secrets
  SWR_REGISTRY_URL: ${{ secrets.SWR_REGISTRY_URL }}
  HUAWEI_SWR_USERNAME: ${{ secrets.HUAWEI_SWR_USERNAME }}
  HUAWEI_SWR_PASSWORD: ${{ secrets.HUAWEI_SWR_PASSWORD }}
  SWR_ORGANIZATION_NAME: ${{ secrets.SWR_ORGANIZATION_NAME }}
  SWR_REGION: ${{ secrets.SWR_REGION }}
  ELB_IP: ${{ secrets.ELB_IP }}
  ELB_ID: ${{ secrets.ELB_ID }}
  CERTIFICATE_ID: ${{ secrets.CERTIFICATE_ID }}
  KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
  HUAWEI_ACCESS_KEY: ${{ secrets.HUAWEI_ACCESS_KEY }}
  HUAWEI_SECRET_KEY: ${{ secrets.HUAWEI_SECRET_KEY }}
  

  SERVICES_DIR: ${{ vars.SERVICES_DIR }}
  REPO_NAME: ${{ vars.REPO_NAME }}


jobs:
  deploy:
    name: Validate and Commit Manifests for Argo CD
    runs-on: [self-hosted, linux-runner]
    environment: stag  # Branch Environment variable 

    env:
      APP_NAMESPACE: ${{ vars.APP_NAMESPACE }}
      ARGOCD_NAMESPACE: ${{ vars.ARGOCD_NAMESPACE }}
      APP_NAME: ${{ vars.APP_NAME }}
      GIT_BRANCH: ${{ vars.GIT_BRANCH }}
      HELM_REPO_PATH: ${{ vars.HELM_REPO_PATH }}
      SWR_REGISTRY_URL: ${{ secrets.SWR_REGISTRY_URL }}
      SWR_ORGANIZATION_NAME: ${{ secrets.SWR_ORGANIZATION_NAME }}
      SWR_REGION: ${{ secrets.SWR_REGION }}
      STAG_INGRESS_HOST: ${{ vars.STAG_INGRESS_HOST }}

    steps:
      # ----------------------------------------
      # Step 1: Checkout Code
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Needed for git diff detection

      # ----------------------------------------
      # Step 2: Debug Git Info
      # ----------------------------------------
      - name: Debug Branch Info
        run: |
          echo "----------------------------------------"
          echo "Current branch and commit info:"
          git branch -vv
          git log -1 --oneline
          echo "----------------------------------------"

      #----------------------------------------
      #Step 3: Detect Changed Subfolders
      # ----------------------------------------
      - name: Detect Changed Services and Files
        id: detect_changes
        run: |
          echo "Detecting changes in backend/, charts/, argocd/, and scripts/..."
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          
          echo "All changed files:"
          echo "$CHANGED_FILES"
          echo ""
          
          # Extract backend services (only valid ones)
          BACKEND_SERVICES=$(echo "$CHANGED_FILES" | \
            grep -E "^backend/(users-service|notification-service|cloud-gateway|config-server|wallet-service|report-service|trustees-service)/" | \
            awk -F/ '{print $1"/"$2}' | \
            sort -u)
          
          # Extract charts changes
          CHARTS_CHANGES=$(echo "$CHANGED_FILES" | grep "^charts/" || echo "")
          
          # Extract argocd changes
          ARGOCD_CHANGES=$(echo "$CHANGED_FILES" | grep "^argocd/" || echo "")
          
          # Extract scripts changes
          SCRIPTS_CHANGES=$(echo "$CHANGED_FILES" | grep "^scripts/" || echo "")
          
          echo "=== Detection Results ==="
          echo "Backend services changed:"
          echo "$BACKEND_SERVICES"
          echo ""
          echo "Charts changed:"
          echo "$CHARTS_CHANGES"
          echo ""
          echo "ArgoCD changed:"
          echo "$ARGOCD_CHANGES"
          echo ""
          echo "Scripts changed:"
          echo "$SCRIPTS_CHANGES"
          echo ""
          
          # Set outputs
          if [ -n "$BACKEND_SERVICES" ]; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            BACKEND_SERVICES_CSV=$(echo "$BACKEND_SERVICES" | tr '\n' ',' | sed 's/,$//')
            echo "changed_services=$BACKEND_SERVICES_CSV" >> "$GITHUB_OUTPUT"
          else
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_services=none" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -n "$CHARTS_CHANGES" ]; then
            echo "charts_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "charts_changed=false" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -n "$ARGOCD_CHANGES" ]; then
            echo "argocd_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "argocd_changed=false" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -n "$SCRIPTS_CHANGES" ]; then
            echo "scripts_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts_changed=false" >> "$GITHUB_OUTPUT"
          fi
          
          # Check if ANY relevant changes exist
          if [ -n "$BACKEND_SERVICES" ] || [ -n "$CHARTS_CHANGES" ] || [ -n "$ARGOCD_CHANGES" ] || [ -n "$SCRIPTS_CHANGES" ]; then
            echo "any_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changes=false" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------
      # Step 4: Substitute environment variables
      # ----------------------------------------
      - name: Substitute environment variables in manifests
        if: |
          steps.detect_changes.outputs.charts_changed == 'true' ||
          steps.detect_changes.outputs.argocd_changed == 'true' ||
          steps.detect_changes.outputs.scripts_changed == 'true'
        run: |
          echo "Exporting environment variables for envsubst..."
          
          # Export all necessary variables
          export GIT_REPO_URL="${{ env.GIT_REPO_URL }}"
          export GIT_BRANCH="${{ env.GIT_BRANCH }}"
          export ARGOCD_NAMESPACE="${{ env.ARGOCD_NAMESPACE }}"
          export ARGOCD_PROJECT="${{ env.ARGOCD_PROJECT }}"
          export APP_NAMESPACE="${{ env.APP_NAMESPACE }}"
          export CLUSTER_SERVER_URL="${{ env.CLUSTER_SERVER_URL }}"
          export HELM_REPO_PATH="${{ env.HELM_REPO_PATH }}"
          export HELM_MOBILE_REPO_PATH="${{ env.HELM_MOBILE_REPO_PATH }}"
          export VALUES_FILE="${{ env.VALUES_FILE }}"
          export BRANCH_ENV="${{ env.BRANCH_ENV }}"
          export CONFIG_SERVER_APP_NAME="${{ env.CONFIG_SERVER_APP_NAME }}"
          export CLOUD_GATEWAY_APP_NAME="${{ env.CLOUD_GATEWAY_APP_NAME }}"
          export CONSUL_APP_NAME="${{ env.CONSUL_APP_NAME }}"
          export NOTIFICATION_SERVICE_APP_NAME="${{ env.NOTIFICATION_SERVICE_APP_NAME }}"
          export WALLET_SERVICE_APP_NAME="${{ env.WALLET_SERVICE_APP_NAME }}"
          export REPORT_SERVICE_APP_NAME="${{ env.REPORT_SERVICE_APP_NAME }}"
          export USERS_SERVICE_APP_NAME="${{ env.USERS_SERVICE_APP_NAME }}"
          export TRUSTEES_SERVICE_APP_NAME="${{ env.TRUSTEES_SERVICE_APP_NAME }}"
          export INGRESS_HOST="${{ env.INGRESS_HOST }}"
          export STAG_INGRESS_HOST="${{ env.STAG_INGRESS_HOST }}"
          export ARGO_INGRESS_HOST="${{ env.ARGO_INGRESS_HOST }}"
          export MOBILE_ELB_ID="${{ env.MOBILE_ELB_ID }}"
          export ARGO_ELB_ID="${{ env.ARGO_ELB_ID }}"
          export MOBILE_ELB_IP="${{ env.MOBILE_ELB_IP }}"
          export ARGO_ELB_IP="${{ env.ARGO_ELB_IP }}"
          export MOBILE_CERTIFICATE_IDS="${{ env.MOBILE_CERTIFICATE_IDS }}"
          export MOBILE_ELB_ID: ${{ env.MOBILE_ELB_ID }}
          export HUAWEI_ACCESS_KEY: ${{ env.HUAWEI_ACCESS_KEY }}
          export HUAWEI_SECRET_KEY: ${{ env.HUAWEI_SECRET_KEY }}
          export HUAWEI_ENTERPRISE_PROJECT_ID: ${{ env.HUAWEI_ENTERPRISE_PROJECT_ID }}
          
          echo "Substituting environment variables in Argo CD manifests..."
          find ./argocd -type f -name "*.yaml" -print0 | while IFS= read -r -d '' file; do
            echo "Processing $file"
            envsubst < "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
          done

          echo "Substituting environment variables in Helm charts..."
          find ./charts -type f -name "*.yaml" -print0 | while IFS= read -r -d '' file; do
            echo "Processing $file"
            envsubst < "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
          done

          echo "Substitution complete. Checking for unreplaced placeholders..."
          grep -R "\${" ./argocd || echo "All placeholders substituted in argocd/"
          grep -R "\${" ./charts || echo "All placeholders substituted in charts/"


      # -----------------------
      # Step 5: DOWNLOAD ONLY LIGHT METADATA
      # -----------------------
      - name: Download CI image metadata
        uses: actions/download-artifact@v4
        with:
          name: image_metadata
          path: image_output/

      # -----------------------
      # Step 6:. READ THE IMAGE TAG + CHANGED SERVICES
      # -----------------------
      - name: Load metadata
        id: loadmeta
        run: |
          echo "IMAGE_TAG=$(grep '^IMAGE_TAG=' image_output/image_metadata.env | cut -d'=' -f2)" >> $GITHUB_ENV

          echo "IMAGE_MAP_CSV:"
          cat image_output/image_map.csv

          # Extract changed services from CSV
          CHANGED_SERVICES=$(cut -d',' -f1 image_output/image_map.csv | tr '\n' ',' | sed 's/,$//')
          echo "CHANGED_SERVICES=${CHANGED_SERVICES}" >> $GITHUB_ENV
      
      # ----------------------------------------
      # Step 5: Load image tag info (from CI)
      # ----------------------------------------
      # - name: Load Image Info
      #   id: image_info
      #   if: steps.detect_changes.outputs.backend_changed == 'true'
      #   run: |
      #     echo "Fetching image tag info from previous CI build..."
      #     if [ -f "image_output/image_map.csv" ]; then
      #       echo "Found image_output/image_map.csv from CI build."
      #       cat image_output/image_map.csv
      #       echo "image_map_exists=true" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "No image_output/image_map.csv found — using timestamp fallback."
      #       mkdir -p image_output
      #       echo "default,${SWR_REGISTRY_URL}/${SWR_ORGANIZATION_NAME}/unknown:$(date +'%Y%m%d-%H%M%S')" > image_output/image_map.csv
      #       echo "image_map_exists=true" >> "$GITHUB_OUTPUT"
      #     fi

      # -----------------------
      # Step 7: UPDATE HELM VALUES ONLY FOR CHANGED SERVICES
      # -----------------------
      - name: Update Helm Image Tags
        run: |
          echo "Loading mapping..."
          declare -A IMG_MAP

          while IFS=, read -r svc ref; do
            svc=$(echo "$svc" | xargs)
            ref=$(echo "$ref" | xargs)
            IMG_MAP["$svc"]="$ref"
          done < image_output/image_map.csv

          echo "Updating only changed services: $CHANGED_SERVICES"

          for svc in $(echo "$CHANGED_SERVICES" | tr ',' ' '); do
            SERVICE_NAME=$(basename "$svc")
            VALUES_FILE="./charts/mobile-backend/${SERVICE_NAME}/values-${BRANCH_ENV}.yaml"

            if [ -f "$VALUES_FILE" ]; then
              FULL_REF="${IMG_MAP[$svc]}"
              REPO_ONLY=$(echo "$FULL_REF" | sed 's/:.*//')
              TAG_ONLY=$(echo "$FULL_REF" | sed 's/.*://')

              echo "Updating $SERVICE_NAME → $REPO_ONLY:$TAG_ONLY"

              yq e -i ".image.repository = \"${REPO_ONLY}\"" "$VALUES_FILE"
              yq e -i ".image.tag = \"${TAG_ONLY}\"" "$VALUES_FILE"
            else
              echo "⚠ No values file found for $SERVICE_NAME → skipped"
            fi
          done
      # # ----------------------------------------
      # # Step 6: Substitute image repository & tags in Helm charts
      # # ----------------------------------------
      # - name: Substitute Variables and Image Tags
      #   if: |
      #     steps.detect_changes.outputs.any_changes == 'true' &&
      #     (steps.detect_changes.outputs.backend_changed == 'true' && 
      #      steps.image_info.outputs.image_map_exists == 'true')
      #   run: |
      #     echo "Substituting image values in Helm charts..."
      #     declare -A IMG_MAP

      #     if [ -f image_output/image_map.csv ]; then
      #       while IFS=, read -r svc ref; do
      #         svc=$(echo "$svc" | xargs)
      #         ref=$(echo "$ref" | xargs)
      #         IMG_MAP["$svc"]="$ref"
      #       done < image_output/image_map.csv
      #       echo "Loaded image map:"
      #       cat image_output/image_map.csv
      #     fi

      #     for ENTRY in $(echo "${{ steps.detect_changes.outputs.changed_services }}" | tr ',' ' '); do
      #       SERVICE_NAME=$(basename "$ENTRY")
      #       VALUES_FILE="./charts/${SERVICE_NAME}/values-${BRANCH_ENV}.yaml"

      #       if [ -f "$VALUES_FILE" ]; then
      #         echo "--------------------------------------------------"
      #         echo "Processing $VALUES_FILE for service: ${SERVICE_NAME}"
      #         echo "Before substitution:"
      #         yq e '.image' "$VALUES_FILE" || true

      #         if [ -n "${IMG_MAP[$SERVICE_NAME]}" ]; then
      #           FULL_REF="${IMG_MAP[$SERVICE_NAME]}"
      #           REPO_ONLY=$(echo "$FULL_REF" | sed 's/:.*//')
      #           TAG_ONLY=$(echo "$FULL_REF" | sed 's/.*://')
      #         else
      #           REPO_ONLY="${SWR_REGISTRY_URL}/${SWR_ORGANIZATION_NAME}/${SERVICE_NAME}"
      #           TAG_ONLY=$(date +'%Y%m%d-%H%M%S')
      #         fi

      #         echo "Setting repository=${REPO_ONLY} tag=${TAG_ONLY}"
      #         yq e -i ".image.repository = \"${REPO_ONLY}\"" "$VALUES_FILE"
      #         yq e -i ".image.tag = \"${TAG_ONLY}\"" "$VALUES_FILE"

      #         echo "After substitution:"
      #         yq e '.image' "$VALUES_FILE"
      #         echo "--------------------------------------------------"
      #       else
      #         echo "Skipping: values file not found for service ${SERVICE_NAME}"
      #       fi
      #     done
      #     echo "Image substitution complete."


      # ----------------------------------------
      # Step 7: Commit and Push Updated Manifests
      # ----------------------------------------
      - name: Commit and Push Updated Manifests
        run: |
          echo "Checking for changes to commit..."
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      
          # Stage changes in relevant directories
          echo "Staging changes in charts/, argocd/, scripts/, and backend/..."
          git add charts/ argocd/ scripts/ 2>/dev/null || true
          
          # Show what's staged
          echo ""
          echo "=== Git Status ==="
          git status
          echo ""
      
          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit — manifests are already up to date."
          else
            echo "Changes detected, preparing commit..."
            
            # Build detailed commit message
            COMMIT_MSG="ci: update manifests"
            COMMIT_DETAILS=""
            
            if [ "${{ steps.detect_changes.outputs.backend_changed }}" == "true" ]; then
              COMMIT_DETAILS="${COMMIT_DETAILS}\n- Backend images updated"
            fi
            
            if [ "${{ steps.detect_changes.outputs.charts_changed }}" == "true" ]; then
              COMMIT_DETAILS="${COMMIT_DETAILS}\n- Helm charts updated"
            fi
            
            if [ "${{ steps.detect_changes.outputs.argocd_changed }}" == "true" ]; then
              COMMIT_DETAILS="${COMMIT_DETAILS}\n- ArgoCD manifests updated"
            fi
            
            if [ "${{ steps.detect_changes.outputs.scripts_changed }}" == "true" ]; then
              COMMIT_DETAILS="${COMMIT_DETAILS}\n- Scripts updated"
            fi
            
            # Add details if any
            if [ -n "$COMMIT_DETAILS" ]; then
              COMMIT_MSG="${COMMIT_MSG}${COMMIT_DETAILS}"
            fi
            
            echo "Commit message:"
            echo -e "$COMMIT_MSG"
            echo ""
            
            git commit -m "$(echo -e "$COMMIT_MSG")"
            
            echo "Pushing changes to $GIT_BRANCH..."
            git push origin $GIT_BRANCH
            
            echo "Changes pushed successfully!"
          fi


      # ----------------------------------------
      # Step 5: Post Deployment (Argo CD will Deploy Automatically)
      # ----------------------------------------
      - name: Post Deployment
        run: |
          echo "=================================================="
          echo "CD Pipeline Complete!"
          echo "=================================================="
          echo ""
          echo "Branch: $GIT_BRANCH"
          echo "Backend Changed: ${{ steps.detect_changes.outputs.backend_changed }}"
          echo "Charts Changed: ${{ steps.detect_changes.outputs.charts_changed }}"
          echo "ArgoCD Changed: ${{ steps.detect_changes.outputs.argocd_changed }}"
          echo "Scripts Changed: ${{ steps.detect_changes.outputs.scripts_changed }}"
          echo ""
          if git diff HEAD --quiet 2>/dev/null; then
            echo "Status: No changes were committed (already up to date)"
          else
            echo "Status: Changes committed and pushed"
            echo "ArgoCD will automatically sync the changes."
          fi
          echo ""
          echo "=================================================="
          echo "Thank you for using the One-Meristem Mobile Backend CD pipeline! See you next time! I love you!"
          echo "=================================================="
