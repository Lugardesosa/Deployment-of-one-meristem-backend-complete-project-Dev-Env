
# ----------------------------------------
# One-Meristem Mobile-backend CD for Staging Env
# ----------------------------------------

name: One-Meristem-Mobile-backend CD for Staging Env 

on:
  push:
    branches:
      - stag_env
    paths:
      #- ".github/workflows/stag_env/Stag_CD_PR.yml"  # CI/CD Pipeline config file
      #- "charts/**"            # helm charts
      - "backend/**"          # backend services
      - "charts/**"
      - ".github/workflows/Stag_CD_Push.yml"
  workflow_dispatch:



env:
  APP_NAMESPACE: ${{ vars.APP_NAMESPACE }}
  ARGOCD_NAMESPACE: ${{ vars.ARGOCD_NAMESPACE }}
  GIT_BRANCH: ${{ vars.GIT_BRANCH }}
  HELM_REPO_PATH: ${{ vars.HELM_REPO_PATH }}
  HELM_MOBILE_REPO_PATH: ${{ vars.HELM_MOBILE_REPO_PATH }}
  APP_NAME: ${{ vars.APP_NAME }}
  INGRESS_HOST: ${{ vars.INGRESS_HOST }}
  CLUSTER_SERVER_URL: ${{ vars.CLUSTER_SERVER_URL }}
  CONFIG_SERVER_APP_NAME: ${{ vars.CONFIG_SERVER_APP_NAME }}
  CLOUD_GATEWAY_APP_NAME: ${{ vars.CLOUD_GATEWAY_APP_NAME }}
  CONSUL_APP_NAME: ${{ vars.CONSUL_APP_NAME }}
  NOTIFICATION_SERVICE_APP_NAME: ${{ vars.NOTIFICATION_SERVICE_APP_NAME }}
  WALLET_SERVICE_APP_NAME: ${{ vars.WALLET_SERVICE_APP_NAME }}
  REPORT_SERVICE_APP_NAME: ${{ vars.REPORT_SERVICE_APP_NAME }}
  USERS_SERVICE_APP_NAME: ${{ vars.USERS_SERVICE_APP_NAME }}
  TRUSTEES_SERVICE_APP_NAME: ${{ vars.TRUSTEES_SERVICE_APP_NAME }}
  VALUES_FILE: ${{ vars.VALUES_FILE }}
  GITHUB_REPO_URL: "https://github.com/mit-meristem/one_meristem_app.git"
  MOBILE_CERTIFICATE_IDS: ${{ vars.MOBILE_CERTIFICATE_IDS }}
  ARGO_CERTIFICATE_ID: ${{ vars.ARGO_CERTIFICATE_ID }}
  MOBILE_ELB_ID: ${{ vars.MOBILE_ELB_ID }}
  ARGO_ELB_ID: ${{ vars.ARGO_ELB_ID }}
  MOBILE_ELB_IP: ${{ vars.MOBILE_ELB_IP }}
  ARGO_ELB_IP: ${{ vars.ARGO_ELB_IP }}
  ARGOCD_PROJECT: ${{ vars.ARGOCD_PROJECT }}
  ARGO_INGRESS_HOST: ${{ vars.ARGO_INGRESS_HOST }} #<-- Change this to your ArgoCD ingress host
  STAG_INGRESS_HOST: ${{ vars.STAG_INGRESS_HOST }} #<-- Change this to your Staging ingress host
  BRANCH_ENV: ${{ github.event.pull_request.base.ref }} #<---- To represent the helm values.yaml used via branch
 
  
  # Stored Secrets in Github Secrets
  SWR_REGISTRY_URL: ${{ secrets.SWR_REGISTRY_URL }}
  HUAWEI_SWR_USERNAME: ${{ secrets.HUAWEI_SWR_USERNAME }}
  HUAWEI_SWR_PASSWORD: ${{ secrets.HUAWEI_SWR_PASSWORD }}
  SWR_ORGANIZATION_NAME: ${{ secrets.SWR_ORGANIZATION_NAME }}
  SWR_REGION: ${{ secrets.SWR_REGION }}
  ELB_IP: ${{ secrets.ELB_IP }}
  ELB_ID: ${{ secrets.ELB_ID }}
  CERTIFICATE_ID: ${{ secrets.CERTIFICATE_ID }}
  KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
  USERS_PRIVATE_KEY: ${{ secrets.USERS_PRIVATE_KEY }}
  USERS_PUBLIC_KEY: ${{ secrets.USERS_PUBLIC_KEY }}
  SERVICE_PUBLIC_KEY: ${{ secrets.SERVICE_PUBLIC_KEY }}
  

  SERVICES_DIR: ${{ vars.SERVICES_DIR }}
  REPO_NAME: ${{ vars.REPO_NAME }}


jobs:
  deploy:
    name: Validate and Commit Manifests for Argo CD
    runs-on: [self-hosted, linux-runner]
    environment: stag  # Branch Environment variable 

    env:
      APP_NAMESPACE: ${{ vars.APP_NAMESPACE }}
      ARGOCD_NAMESPACE: ${{ vars.ARGOCD_NAMESPACE }}
      APP_NAME: ${{ vars.APP_NAME }}
      GIT_BRANCH: ${{ vars.GIT_BRANCH }}
      HELM_REPO_PATH: ${{ vars.HELM_REPO_PATH }}
      SWR_REGISTRY_URL: ${{ secrets.SWR_REGISTRY_URL }}
      SWR_ORGANIZATION_NAME: ${{ secrets.SWR_ORGANIZATION_NAME }}
      SWR_REGION: ${{ secrets.SWR_REGION }}
      STAG_INGRESS_HOST: ${{ vars.STAG_INGRESS_HOST }}

    steps:
      # ----------------------------------------
      # Step 1: Checkout Code
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Needed for git diff detection

      # ----------------------------------------
      # Step 2: Debug Git Info
      # ----------------------------------------
      - name: Debug Branch Info
        run: |
          echo "----------------------------------------"
          echo "Current branch and commit info:"
          git branch -vv
          git log -1 --oneline
          echo "----------------------------------------"

      #----------------------------------------
      #Step 3: Detect Changed Subfolders
      # ----------------------------------------
      - name: Detect Changed Services
        id: detect_changes
        run: |
          echo "Detecting changed subfolders in backend/, charts/, and scripts/..."
          CHANGED_DIRS=$(git diff --name-only HEAD^ HEAD | grep -E "^(backend|charts|scripts)/" | awk -F'/' '{print $1"/"$2}' | sort -u)
          
          echo "Changed directories:"
          echo "$CHANGED_DIRS"

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No relevant subfolder changes detected."
            echo "changed_dirs=none" >> "$GITHUB_OUTPUT"
          else
            CHANGED_DIRS=$(echo "$CHANGED_DIRS" | tr '\n' ',' | sed 's/,$//')
            echo "changed_dirs=$CHANGED_DIRS" >> "$GITHUB_OUTPUT"
          fi

            # ----------------------------------------
      # Step 4: Substitute environment variables
      # ----------------------------------------
      - name: Substitute environment variables in manifests
        if: steps.detect_changes.outputs.changed_dirs != 'none'
        run: |
          echo "Substituting environment variables in Argo CD manifests..."
          find ./argocd -type f -name "*.yaml" -print0 | while IFS= read -r -d '' file; do
            echo "Processing $file"
            envsubst < "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
          done

          echo "Substituting environment variables in Helm charts (if any)..."
          find ./charts -type f -name "*.yaml" -print0 | while IFS= read -r -d '' file; do
            echo "Processing $file"
            envsubst < "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
          done

          echo "Substitution complete. Checking for unreplaced placeholders..."
          grep -R "\${" ./argocd || echo "All placeholders substituted in argocd/"
          grep -R "\${" ./charts || echo "All placeholders substituted in charts/"

          echo ""
          echo "===== SAMPLE OUTPUT FROM argocd-apps.yaml ====="
          head -n 40 ./argocd/apps/argocd-apps.yaml || echo "No argocd-apps.yaml found"

          echo ""
          echo "===== SAMPLE OUTPUT FROM one Helm chart template ====="
          find ./charts -type f -name "*.yaml" | head -n 1 | xargs -r head -n 40


      # ----------------------------------------
      # Step 5: Load image tag info (from CI)
      # ----------------------------------------
      - name: Load Image Info
        id: image_info
        run: |
          echo "Fetching image tag info exported from CI pipeline..."
          if [ -f "image_output/image_map.csv" ]; then
            echo "Found image_output/image_map.csv from CI build."
            cat image_output/image_map.csv
          else
            echo "No image_output/image_map.csv found — using timestamp fallback."
            mkdir -p image_output
            echo "default,${SWR_REGISTRY_URL}/${SWR_ORGANIZATION_NAME}/unknown:$(date +'%Y%m%d-%H%M%S')" > image_output/image_map.csv
          fi

      # ----------------------------------------
      # Step 6: Substitute image repository & tags in Helm charts
      # ----------------------------------------
      - name: Substitute Variables and Image Tags
        if: steps.detect_changes.outputs.changed_dirs != 'none'
        run: |
          echo "Substituting image values in Helm charts..."
          declare -A IMG_MAP

          if [ -f image_output/image_map.csv ]; then
            while IFS=, read -r svc ref; do
              svc=$(echo "$svc" | xargs)
              ref=$(echo "$ref" | xargs)
              IMG_MAP["$svc"]="$ref"
            done < image_output/image_map.csv
            echo "Loaded image map:"
            cat image_output/image_map.csv
          fi

          for ENTRY in $(echo "${{ steps.detect_changes.outputs.changed_dirs }}" | tr ',' ' '); do
            SERVICE_NAME=$(basename "$ENTRY")
            VALUES_FILE="./charts/${SERVICE_NAME}/values-${BRANCH_ENV}.yaml"

            if [ -f "$VALUES_FILE" ]; then
              echo "--------------------------------------------------"
              echo "Processing $VALUES_FILE for service: ${SERVICE_NAME}"
              echo "Before substitution:"
              yq e '.image' "$VALUES_FILE" || true

              if [ -n "${IMG_MAP[$SERVICE_NAME]}" ]; then
                FULL_REF="${IMG_MAP[$SERVICE_NAME]}"
                REPO_ONLY=$(echo "$FULL_REF" | sed 's/:.*//')
                TAG_ONLY=$(echo "$FULL_REF" | sed 's/.*://')
              else
                REPO_ONLY="${SWR_REGISTRY_URL}/${SWR_ORGANIZATION_NAME}/${SERVICE_NAME}"
                TAG_ONLY=$(date +'%Y%m%d-%H%M%S')
              fi

              echo "Setting repository=${REPO_ONLY} tag=${TAG_ONLY}"
              yq e -i ".image.repository = \"${REPO_ONLY}\"" "$VALUES_FILE"
              yq e -i ".image.tag = \"${TAG_ONLY}\"" "$VALUES_FILE"

              echo "After substitution:"
              yq e '.image' "$VALUES_FILE"
              echo "--------------------------------------------------"
            else
              echo "Skipping: values file not found for service ${SERVICE_NAME}"
            fi
          done
          echo "Image substitution complete."


      # ----------------------------------------
      # Step 4: Commit and Push Updated Manifests
      # ----------------------------------------
      - name: Commit and Push Updated Manifests
        if: steps.detect_changes.outputs.changed_dirs != 'none'
        run: |
          echo "Committing updated manifests for Argo CD..."
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      
          # Stage all changes (new, modified, deleted) 
          git add -A ./argocd ./charts ./scripts ./backend || true

          git status
      
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping commit step."
          else
            git commit -m "ci: update Helm image tags and substituted manifests"
            git push origin $GIT_BRANCH || echo "Push skipped (no changes)."
          fi


      # ----------------------------------------
      # Step 5: Post Deployment (Argo CD will Deploy Automatically)
      # ----------------------------------------
      - name: Post Deployment
        run: |
          echo "Changes have been pushed to '$GIT_BRANCH'. Argo CD will handle the deployment automatically."
          echo "Thank you for using the One-Meristem Mobile Backend CD pipeline! See you next time! I love you!"
