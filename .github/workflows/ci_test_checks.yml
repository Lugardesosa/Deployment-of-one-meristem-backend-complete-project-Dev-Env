# =====================================================-------
# GitHub Actions Workflow: CI - Pull Request Check to dev_env
# =====================================================-------

name: CI - PR Check

on:
  pull_request:
    branches:
      - dev_env

env:
  REPO_NAME: Meristem-Innovation-Team/one_meristem_app
  SERVICES_DIR: backend

jobs:
  build:
    name: Detect and Build Changed Microservices
    runs-on: self-hosted
    outputs:
      changed_services: ${{ steps.check_change.outputs.changed_services }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.0
        with: 
          fetch-depth: 2

      - name: Detect Changed Microservices
        id: check_change
        run: |
          git fetch origin dev_env
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E "${{ env.SERVICES_DIR }}/(cloud-gateway|users-service|config-server|notification-service|wallet-service|core-service|report-service|meriapp-config|platform|trusties-service)/" | cut -d'/' -f2 | sort -u | xargs)
          echo "Changed services: $CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "changed_services=none" >> "$GITHUB_OUTPUT"
          else
            echo "changed_services=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Java Static Code Analysis
    runs-on: self-hosted
    needs: build
    if: needs.build.outputs.changed_services != 'none'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Checkstyle
        run: |
          cd ${{ env.SERVICES_DIR }}
          for svc in ${{ needs.build.outputs.changed_services }}; do
            echo "Running Checkstyle for $svc"
            cd "$svc" || continue
            if [ -f pom.xml ]; then
              mvn checkstyle:check -B
            else
              echo "No pom.xml found in $svc"
            fi
            cd ..
          done
