# Allow headers with underscores (e.g., X_USER_ID)
underscores_in_headers on;

# Ensure headers are passed through to the backend
proxy_pass_request_headers on;

# WebSocket upgrade map — determines Connection header value based on Upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Forward WebSocket upgrade headers to backend
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Prevent NGINX from killing idle WebSocket connections (default is 60s)
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
