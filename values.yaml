

###############################################################################
# shared-resources chart values – everything here maps 1‑to‑1 to the          #
# parameters we templated earlier (PV, SA, RBAC, SecretProviderClass, Secret) #
###############################################################################
shared-resources:

  # Namespace & SA -----------------------------------------------------------
  namespace: one-meristem-app
  serviceAccount:
    name: app-spc-sa
    dewResources:
      - db-admin-secret-one-meristem-dev-env
      - redis-credentials-one-meristem-dev-env
      - kafka-credentials-one-meristem-dev-env
      - db-notification_service-secret-one-meristem-dev-env
      - db-users_service-secret-one-meristem-dev-env
      - db-wallet_service-secret-one-meristem-dev-env
      - db-report_service-secret-one-meristem-dev-env

  # RBAC ---------------------------------------------------------------------
  role:
    name: sa-secret-role
  roleBinding:
    name: sa-secret-rolebinding

  # PersistentVolume ---------------------------------------------------------
  pv:
    name: pv-evs
    region: af-south-1
    diskVolumeType: SSD
    capacity: 100Gi
    accessMode: ReadWriteOnce
    reclaimPolicy: Delete
    storageClass: csi-disk
    volumeHandle: volume-abc123        # change per env if you pre‑create EVS
    chargingMode: prePaid
    periodType: year
    periodNum: "1"
    cryptKeyId: key-xyz456             # your KMS key‑ID (optional)

  # SecretProviderClass ------------------------------------------------------
  secretProviderClass:
    name: huawei-csms-credentials
    provider: cce                      # fixed for Huawei CCE CSI
    k8sSecretName: huawei-csms-credentials

  # Static “hybrid” Kubernetes Secret ---------------------------------------
  k8sSecret:
    name: credentials



###############################################################################
# cloud-gateway microservice values                                          #
###############################################################################
cloud-gateway:
  #Deployment configuration for cloud-gateway service
  replicaCount: 2

  image:
    repository: swr.cn-south-1.myhuaweicloud.com/one-meristem/cloud-gateway
    pullPolicy: IfNotPresent
    tag: "latest"

  imagePullSecrets:
    - name: [] #relying on CCE's automatic injection

  serviceAccount:
    name: app-spc-sa

  resources:
    limits:
      cpu: "0.5"
      memory: 1Gi
    requests:
      cpu: "0.3"
      memory: 512Mi

  volumeMounts:
    - name: huawei-csms-credentials
      mountPath: /mnt/secrets-store
    - name: pv-evs
      mountPath: /data
      readOnly: true

  volumes:
    - name: pv-evs
      persistentVolumeClaim:
        claimName: cloud-gateway-pvc-evs
    - name: huawei-csms-credentials
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: huawei-csms-credentials
          csi.storage.k8s.io/provisioner-secret-name: huawei-csms-credentials
          csi.storage.k8s.io/provisioner-secret-namespace: one-meristem-app
    - name: secret-volume
      secret:
        secretName: credentials

  env:
    SPRING_PROFILES_ACTIVE: "default"
    GITHUB_BRANCH: "wallet"
    APP_PROFILE: "dev"
    SERVER_PORT: "20010"
    COMPANY_NAME: "Meristem Securities Limited"
    DATA_PRIVACY_POLICY_URL: "https://www.onemerristem.merristem.com"
    GREEN_LOGO_URL: "https://obs-unstructured-logo-one-meristem-dev-env.obs.af-south-1.myhuaweicloud.com/Meristem_Green_Logo.png"
    WHITE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-dev-env.obs.af-south-1.myhuaweicloud.com/Meristem_White_Logo.png"
    FINANCE_LOGO_URL: "https://obs-unstructured-logo-one-meristem-dev-env.obs.af-south-1.myhuaweicloud.com/Meristem_Finance_Logo.png"
    CONFIG_SERVER_URL: "http://config-server:20000/config"
    USER_SERVICE_URI: "http://users-service:20020"
    NOTIFICATION_SERVICE_URI: "http://notification-service:20030"
    WALLET_SERVICE_URI: "http://wallet-service:20040"
    REPORT_SERVICE_URI: "http://report-service:20050"
    ADMIN_USERNAME: "admin"

  secretEnv:
    ADMIN_PASSWORD:
      secretName: credentials
      secretKey: key3
    ENCRYPTION_KEY:
      secretName: credentials
      secretKey: key4
    REDIS_HOST:
      secretName: huawei-csms-credentials
      secretKey: REDIS_HOST
    REDIS_PASSWORD:
      secretName: huawei-csms-credentials
      secretKey: REDIS_PASSWORD
    H2_PASSWORD:
      secretName: credentials
      secretKey: key13

  #PVC configuration
  pvc:
    name: cloud-gateway-pvc-evs
    annotations:
      everest.io/disk-volume-type: SSD
      #everest.io/crypt-key-id: <key_id>   #Input your key id here
      #everest.io/csi.charging-mode: prePaid
      #everest.io/csi.period-type: year
      #everest.io/csi.period-num: 1
      failure-domain.beta.kubernetes.io/region: af-south-1
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: csi-disk
    volumeName: pv-evs

  # HorizontalPodAutoscaler configuration
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70


  # Ingress configuration
  ingress:
    enabled: true
    name: cloud-gateway-ingress
    elbId: <your_elb_id>
    elbIp: <your_elb_ip>
    certificateIds: <your_certificate_ids>
    host: onemerristem.merristem.com
    servicePort: 20010

  # Service configuration
  service:
    type: ClusterIP
    port: 443
    targetPort: 20010
    annotations:
      kubernetes.io/elb.class: performance
      kubernetes.io/elb.protocol-port: "https:443"
      kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
      kubernetes.io/elb.health-check-flag: "on"
      kubernetes.io/elb.health-check-option: '{"protocol":"HTTPS","port":"443","uri":"/health","interval":5,"timeout":10,"rise":2,"fall":2}'
