    - name: SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME
      valueFrom:
        secretKeyRef:
          name: credentials
          key: key1
    - name: SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: credentials
          key: key2
    - name: SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START
      value: "true"
    - name: ENCRYPTION_KEY
      valueFrom:
        secretKeyRef:
          name: credentials
          key: key4
    - name: SPRING_CLOUD_CONFIG_SERVER_GIT_TIMEOUT
      value: "30"
    - name: SPRING_CLOUD_CONFIG_SERVER_GIT_REFRESH_RATE
      value: "10"

  secretEnv:
    ADMIN_PASSWORD:
      secretName: credentials
      secretKey: key3
    SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME:
      secretName: credentials
      secretKey: key1
    SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD:
      secretName: credentials
      secretKey: key2
    ENCRYPTION_KEY:
      secretName: credentials
      secretKey: key4
    H2_PASSWORD:
      secretName: credentials
      secretKey: key13

  volumeMounts:
    - name: secret-volume
      mountPath: /etc/my-secert
      readOnly: true
    - name: pv-evs
      mountPath: /mnt/evs
      readOnly: true

  volumes:
    - name: pv-evs
      persistentVolumeClaim:
        claimName: config-server-pvc-evs
    - name: secret-volume
      secret:
        secretName: credentials

  persistence:
    enabled: true
    claimName: config-server-pvc-evs
    storageClass: csi-disk
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations:
      everset.io/disk-volume-type: SSD
      failure-domain.beta.kubernetes.io/region: af-south-1


  # HorizontalPodAutoscaler configuration
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70

  #PVC configuration
  pvc:
    name: config-server-pvc-evs
    annotations:
      everest.io/disk-volume-type: SSD
      #everest.io/crypt-key-id: <key_id>   #Input your key id here
      #everest.io/csi.charging-mode: prePaid
      #everest.io/csi.period-type: year
      #everest.io/csi.period-num: 1
      failure-domain.beta.kubernetes.io/region: af-south-1
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: csi-disk
    volumeName: pv-evs


  # Service configuration
  service:
    type: ClusterIP
    port: 443
    targetPort: 20000
    annotations:
      kubernetes.io/elb.class: performance
      kubernetes.io/elb.protocol-port: "https:443"
      kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
      kubernetes.io/elb.health-check-flag: "on"
      kubernetes.io/elb.health-check-option: '{"protocol":"HTTPS","port":"443","uri":"/health","interval":5,"timeout":10,"rise":2,"fall":2}'

###############################################################################
# consul microservice values                                   #
###############################################################################
consul:
  #Deployment configuration for consul service

  replicaCount: 1

  image:
    repository: consul
    tag: "1.21.2"
    pullPolicy: IfNotPresent
    args:
    - "agent"
    - "-server"
    - "-bootstrap-expect"
    - "1"
    - "-ui"
    - "-client"
    - "0.0.0.0"

  serviceAccount:
    name: app-spc-sa

  resources:
    limits:
      cpu: "500m"
      memory: "128Mi"
    requests:
      cpu: "250m"
      memory: "64Mi"

  volumeMounts:
    - name: pv-evs
      mountPath: /consul/data

  volumes:
    - name: pv-evs
      persistentVolumeClaim:
        claimName: consul-pvc-evs

  containerPorts:
    - name: consul-http
      port: 8500
    - name: consul-port-8301
      port: 8301
    - name: consul-port-8302
      port: 8302
    - name: consul-port-8600
      port: 8600
    - name: consul-port-8300
      port: 8300


  restartPolicy: Always

  imagePullSecrets:
    - name: [] # relying on CCE's automatic injection

  # HorizontalPodAutoscaler configuration
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70

  # Ingress configuration
  ingress:
    enabled: true
    name: consul-ingress
    elbId: <your_elb_id>
    elbIp: <your_elb_ip>
    certificateIds: <your_certificate_ids>
    host: onemerristem.merristem.com
    servicePort: 8500
    

  #Service configuration
  service:
    type: NodePort  # or "LoadBalancer" if you prefer ELB directly without Ingress
    portName: consul
    port: 8500
    targetPort: 8500
    nodePort: 30000  # Optional: only if using NodePort type
    annotations: 
      kubernetes.io/elb.class: performance
      kubernetes.io/elb.protocol-port: "https:443"
      kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
      kubernetes.io/elb.health-check-flag: "on"
      kubernetes.io/elb.health-check-option: '{"protocol":"HTTPS","port":"443","uri":"/health","interval":5,"timeout":10,"rise":2,"fall":2}'
    

