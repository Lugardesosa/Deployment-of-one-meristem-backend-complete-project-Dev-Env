# =============================================================================
# SHARED RESOURCES — Wave 0
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-resources
  namespace: ${ARGOCD_NAMESPACE}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-sync-succeeded.teams: channelName
    notifications.argoproj.io/subscribe.on-out-of-sync.teams: channelName
    notifications.argoproj.io/subscribe.on-healthy.teams: channelName
    notifications.argoproj.io/subscribe.on-unhealthy.teams: channelName
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: ${ARGOCD_PROJECT}
  source:
    repoURL: ${GIT_REPO_URL}
    targetRevision: ${GIT_BRANCH}
    path: ${HELM_REPO_PATH}/shared-resources
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # All values empty here — injected via argocd app set from pipeline
        # Credentials
        - name: credentials.adminPassword
          value: ""
        - name: credentials.encryptionKey
          value: ""
        - name: credentials.githubUsername
          value: ""
        - name: credentials.githubPassword
          value: ""
        - name: credentials.mailerHost
          value: ""
        - name: credentials.mailerUsername
          value: ""
        - name: credentials.mailerPassword
          value: ""
        - name: credentials.creditSwitchPublicKey
          value: ""
        - name: credentials.creditSwitchPrivateKey
          value: ""
        - name: credentials.creditSwitchSmsPassword
          value: ""
        - name: credentials.huaweiCloudAccessKeyId
          value: ""
        - name: credentials.huaweiCloudSecretAccessKey
          value: ""
        - name: credentials.h2Password
          value: ""
        - name: credentials.providusApiPublicKey
          value: ""
        - name: credentials.providusApiSecretKey
          value: ""
        - name: credentials.trusteesClientSecret
          value: ""
        - name: credentials.encSalt
          value: ""
        - name: credentials.expoToken
          value: ""
        - name: credentials.okhiHeaderValue
          value: ""
        - name: credentials.paystackSecretKey
          value: ""
        # OBS
        - name: obsSecret.data.accessKey
          value: ""
        - name: obsSecret.data.secretKey
          value: ""
        # Image pull secret
        - name: imagePullSecret.dockerconfigjson
          value: ""
        # Ingress
        - name: ingress.elbId
          value: ""
        - name: ingress.cloudGateway.tlsCert
          value: ""
        - name: ingress.cloudGateway.tlsKey
          value: ""
        - name: ingress.webApp.tlsCert
          value: ""
        - name: ingress.webApp.tlsKey
          value: ""
        - name: ingress.adminApp.tlsCert
          value: ""
        - name: ingress.adminApp.tlsKey
          value: ""
        # # ⚠ Move these to GitHub Actions secrets — base64 is not encryption
        # - name: obsSecret.data.accessKey
        #   value: "SFBVQUVaSzNETExQTFZGWFpJQzU="
        # - name: obsSecret.data.secretKey
        #   value: "c05weTlSN0FjN0JIZU9VcDVhRGhyRERkY1lFYWh1M1BVQnNWM0s0NQ=="
  destination:
    server: ${CLUSTER_SERVER_URL}
    namespace: ${APP_NAMESPACE}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: shared-resources
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: obs-access-secret
      namespace: one-meristem-app
      jsonPointers:
        - /data
        - /metadata/annotations
        - /metadata/labels
    - group: ""
      kind: Secret
      name: credentials
      namespace: one-meristem-app
      jsonPointers:
        - /data

---

