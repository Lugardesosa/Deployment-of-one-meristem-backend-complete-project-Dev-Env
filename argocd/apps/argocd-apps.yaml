#------------------ ARGO CD APPLICATIONS ------------------#
# This file contains the Argo CD applications configuration for deploying the one-meristem-app microservices.


# Shared Resources Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-resources
  namespace: ${ARGOCD_NAMESPACE}
spec:
  project: ${ARGOCD_PROJECT}
  source:
    repoURL: https://github.com/mit-meristem/one_meristem_app.git
    targetRevision: ${GIT_BRANCH} 
    path: ${HELM_REPO_PATH}/shared-resources
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: ${CLUSTER_SERVER_URL}
    namespace: ${APP_NAMESPACE}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---

