# ------------------ ARGO CD APPLICATIONS ------------------#
# This file contains the Argo CD applications configuration for deploying the one-meristem-app microservices on Production.

# =============================================================================
# ARGO CD APPLICATION: cert-manager CRDs

# PURPOSE:
# This application installs the cert-manager CustomResourceDefinitions (CRDs)
# into the cluster.

# WHY THIS EXISTS:
# - cert-manager depends on these CRDs to define its APIs (Certificate,
#   ClusterIssuer, Order, Challenge, etc).
# - CRDs MUST be installed before the cert-manager controller is deployed.
# - CRDs are cluster-scoped and must NEVER be pruned once created.

# IMPORTANT NOTES:
# - This application should be synced FIRST.
# - Pruning is intentionally disabled to prevent accidental CRD deletion.
# - This application changes very rarely.
# DEPLOYMENT ORDER:
# Wave -5: cert-manager CRDs
# Wave  0: cert-manager controller
# Wave  3: EAB Sealed Secrets (this app)
# Wave  5: ClusterIssuers (this app)
# Wave 10+: Application certificates
# =============================================================================

#------------------ ARGO CD APPLICATIONS ------------------#
# Backend microservices for one-meristem-app namespace
# Repo: https://github.com/mit-meristem/one_meristem_app.git
#
# SYNC POLICY: Manual — no automated sync
# Sync from ArgoCD UI or CLI: argocd app sync <app-name>
# Rollback from ArgoCD UI: select revision and click Rollback
#
# DEPLOYMENT WAVE ORDER (sync-wave only applies during manual sync-all):
# Wave  0: shared-resources
# Wave  5: config-server, consul
# Wave 10: all backend services

