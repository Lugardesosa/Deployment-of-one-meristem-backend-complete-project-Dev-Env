#------------------ ARGO CD APPLICATIONS ------------------#
# This file contains the Argo CD applications configuration for deploying the one-meristem-app microservices.


# Shared Resources Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-resources
  namespace: argocd
spec:
  project: one-meristem-app
  source:
    repoURL: https://github.com/mit-meristem/one_meristem_app.git
    targetRevision: ${GIT_BRANCH} 
    path: ${HELM_REPO_PATH}/shared-resources
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: ${CLUSTER_SERVER_URL}
    namespace: ${APP_NAMESPACE}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---

# Config Server Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-server
  namespace: argocd
spec:
  project: one-meristem-app
  source:
    repoURL: https://github.com/mit-meristem/one_meristem_app.git
    targetRevision: ${GIT_BRANCH}
    path: ${HELM_MOBILE_REPO_PATH}/${CONFIG_SERVER_APP_NAME}
    helm:
      valueFiles:
        - values-stag_env.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: one-meristem-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

